async function generateFactoryExcelReport(factoryId){
  const ok = await ensureExcelLib(); if(!ok){ toast('⚠️ تعذّر تحميل مكتبة Excel'); return; }
  toast('جاري تجميع بيانات المصنع والصور...');
  const d = await gatherFullFactoryData(factoryId);
  const { f, s, cameras, screens, faults, lighting, cameraMods, racks, switches, servers, ups, maintenance, drives } = d;
  let faultImages=[], serverImages=[];
  try{ const ids=faults.map(x=>x.id); if(ids.length){ const {data}=await supa.from('fault_images').select('*').in('fault_id',ids); faultImages=data||[]; } }catch(e){}
  try{ const ids=servers.map(x=>x.id); if(ids.length){ const {data}=await supa.from('server_images').select('*').in('server_id',ids); serverImages=data||[]; } }catch(e){}
  await urlsToDataUris([
    ...cameras.map(c=>c.photo_url), ...faultImages.map(im=>im.image_url), ...lighting.map(l=>l.photo_url),
    ...cameraMods.flatMap(c=>[c.photo_before_url,c.photo_after_url]), ...racks.map(r=>r.photo_url),
    ...switches.map(sw=>sw.photo_url), ...ups.map(u=>u.photo_url), ...serverImages.map(im=>im.image_url)
  ]);

  const wb = new ExcelJS.Workbook();
  const border = { top:{style:'thin',color:{argb:'FFC9D3E3'}}, left:{style:'thin',color:{argb:'FFC9D3E3'}}, bottom:{style:'thin',color:{argb:'FFC9D3E3'}}, right:{style:'thin',color:{argb:'FFC9D3E3'}} };
  const headStyle = c=>{ c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12716A'}}; c.border=border; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; };
  function sheet(name, headers, rows, colWidths){
    const ws = wb.addWorksheet(name, {views:[{rightToLeft:true, state:'frozen', ySplit:1}]});
    ws.columns = (colWidths||headers.map(()=>18)).map(w=>({width:w}));
    const hr = ws.getRow(1); headers.forEach((h,i)=>{ hr.getCell(i+1).value=h; headStyle(hr.getCell(i+1)); }); hr.height=24;
    rows.forEach((r,i)=>{ const row=ws.addRow(r); row.eachCell(c=>{ c.border=border; if(i%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3F7FB'}}; }); });
    return ws;
  }
  function sheetWithImages(name, headers, rows, imgColIdx, getUrl){
    const ws = wb.addWorksheet(name, {views:[{rightToLeft:true, state:'frozen', ySplit:1}]});
    ws.columns = headers.map(()=>({width:16}));
    const hr = ws.getRow(1); headers.forEach((h,i)=>{ hr.getCell(i+1).value=h; headStyle(hr.getCell(i+1)); }); hr.height=24;
    rows.forEach((r,i)=>{
      const rr=i+2; r.forEach((v,ci)=>{ const c=ws.getCell(rr,ci+1); if(ci!==imgColIdx) c.value=v; c.border=border; });
      ws.getRow(rr).height=70;
      const url = getUrl(i); if(url) addEmbeddedImage(wb, ws, __imgDataCache[url], imgColIdx, rr-1, 85, 85);
    });
    return ws;
  }

  // 1) بيانات المصنع + 2) الملخص
  sheet('بيانات المصنع والملخص', ['البند','القيمة'], [
    ['اسم المصنع', f?f.name:''], ['تاريخ التقرير', new Date().toLocaleDateString('ar-EG')],
    ['إجمالي الكاميرات', s.camerasTotal], ['الكاميرات العاملة', s.camerasUp], ['الكاميرات المنقطعة', s.camerasDown],
    ['نسبة تشغيل الكاميرات %', Math.round(s.camUptime*100)/100], ['إجمالي الشاشات', s.screens], ['الشاشات المنقطعة', s.screensDown],
    ['نسبة تشغيل الشاشات %', Math.round(s.scrUptime*100)/100]
  ], [26,20]);

  if(cameras.length) sheetWithImages('الكاميرات', ['الرقم','الاسم','الحالة','Switch','Port','ملاحظات','صورة'],
    cameras.map(c=>{ const sw=switches.find(x=>x.id===c.switch_id); return [c.camera_number||'',c.camera_name,c.status,sw?sw.switch_name:'',c.port_number||'',c.notes||'',null]; }), 6, i=>cameras[i].photo_url);
  if(screens.length) sheet('الشاشات', ['الرقم','الاسم','الحالة','ملاحظات'], screens.map(sc=>[sc.screen_number||'',sc.screen_name,sc.status,sc.notes||'']));
  if(racks.length) sheetWithImages('Racks', ['الاسم','الموقع','ملاحظات','صورة'], racks.map(r=>[r.rack_name,r.location||'',r.notes||'',null]), 3, i=>racks[i].photo_url);
  if(switches.length) sheetWithImages('Switches', ['الاسم','النوع','إجمالي Ports','مستخدمة','فارغة','كاميرات','صورة'],
    switches.map(sw=>[sw.switch_name,sw.switch_type||'',sw.total_ports||0,sw.used_ports||0,Math.max(0,(sw.total_ports||0)-(sw.used_ports||0)),getSwitchCameraCount(sw),null]), 6, i=>switches[i].photo_url);
  if(servers.length) sheetWithImages('Servers', ['الاسم','الحالة','الموديل','IP','OS','صورة'],
    servers.map(sv=>[sv.server_name,sv.status,`${sv.brand||''} ${sv.model||''}`,sv.ip_address||'',sv.os_name||'',null]), 5, i=>{ const im=serverImages.find(x=>x.server_id===servers[i].id); return im?im.image_url:null; });
  if(drives.length) sheet('Hard Drives', ['السيرفر','Slot','النوع','السعة','الحالة'], drives.map(dr=>{ const sv=servers.find(x=>x.id===dr.server_id); return [sv?sv.server_name:'',dr.slot_number||'',dr.drive_type||'',fmtStorage(dr.capacity_gb),dr.status]; }));
  if(ups.length) sheetWithImages('UPS', ['الاسم','الموقع','الحالة','صورة'], ups.map(u=>[u.ups_name,u.location||'',u.status,null]), 3, i=>ups[i].photo_url);
  if(faults.length) sheetWithImages('الأعطال', ['الجهاز','النوع','الخطورة','الحالة','التاريخ','صورة'],
    faults.map(fl=>[fl.device_name,fl.fault_type||'',fl.severity,fl.status,new Date(fl.reported_at).toLocaleDateString('ar-EG'),null]), 5, i=>{ const im=faultImages.find(x=>x.fault_id===faults[i].id); return im?im.image_url:null; });
  if(maintenance.length) sheet('الصيانة', ['الهدف','نوع الصيانة','الموعد','ملاحظات'], maintenance.map(m=>[m.target_name,m.maintenance_type,fmtDateAr(m.scheduled_date),m.notes||'']));
  if(lighting.length) sheetWithImages('الإضاءة', ['المكان','المشكلة','الحالة','صورة'], lighting.map(l=>[l.place_name||'',l.problem_description||l.description||'',l.status,null]), 3, i=>lighting[i].photo_url);
  if(cameraMods.length) sheet('الكاميرات للتعديل', ['الكاميرا','الموقع','السبب','الحالة'], cameraMods.map(c=>[c.camera_name,c.place_name||'',c.problem_description||'',c.status]));

  const buf = await wb.xlsx.writeBuffer();
  closeModal();
  await saveOrShareFile(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `تقرير-شامل-${f?f.name:''}-${new Date().toISOString().slice(0,10)}.xlsx`);
  await logAudit('إنشاء تقرير مصنع شامل (Excel)', f?f.name:factoryId);
}

async function generateFactoryImageReport(factoryId){
  toast('جاري تجميع بيانات المصنع...');
  const d = await gatherFullFactoryData(factoryId);
  const { f, s, cameras, faults, racks, switches, servers, ups } = d;
  const chartCv = buildFactoryChartCanvas(d);
  const W=1080, H=1500;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#0B1220'); grad.addColorStop(1,'#0E1830');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#38D9C9'; ctx.font='700 26px Arial'; ctx.fillText(f?f.name:'', W/2, 60);
  ctx.fillStyle='#E9EEFB'; ctx.font='900 22px Arial'; ctx.fillText('التقرير الشامل', W/2, 96);
  ctx.fillStyle='#8CA0C4'; ctx.font='14px Arial'; ctx.fillText(new Date().toLocaleDateString('ar-EG'), W/2, 122);
  const cards = [['الكاميرات',cameras.length],['نسبة التشغيل',fmtPct2(s.camUptime)],['الشاشات',s.screens],['الأعطال',faults.length],['Racks',racks.length],['Switches',switches.length],['Servers',servers.length],['UPS',ups.length],['Ports فارغة',switches.reduce((a,sw)=>a+Math.max(0,(sw.total_ports||0)-(sw.used_ports||0)),0)]];
  const cw=(W-4*30)/3, ch=95, top=150;
  cards.forEach(([label,val],i)=>{
    const col=i%3, row=Math.floor(i/3), x=30+col*(cw+30), y=top+row*(ch+14);
    ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(x,y,cw,ch);
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.strokeRect(x,y,cw,ch);
    ctx.fillStyle='#8CA0C4'; ctx.font='500 14px Arial'; ctx.fillText(String(label),x+cw/2,y+28);
    ctx.fillStyle='#38D9C9'; ctx.font='900 28px Arial'; ctx.fillText(String(val),x+cw/2,y+64);
  });
  const chartY = top + 3*(ch+14) + 20;
  ctx.drawImage(chartCv, 20, chartY, W-40, (W-40)*(chartCv.height/chartCv.width));
  ctx.fillStyle='#5E6E92'; ctx.font='12px Arial'; ctx.fillText('تصدير تلقائي — بيانات فعلية 100%', W/2, H-20);
  cv.toBlob(async blob=>{ await saveOrShareFile(blob, `تقرير-شامل-${f?f.name:''}-${new Date().toISOString().slice(0,10)}.png`); await logAudit('إنشاء تقرير مصنع شامل (صورة)', f?f.name:factoryId); }, 'image/png', 0.95);
}

  const blob = await html2pdf().set({margin:8, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'}}).from(el).outputPdf('blob');
  el.remove();

/* ============================================================
   مركز التصدير الشامل (Export Center) — مستقل عن التصدير الفردي
   يجمع كل بيانات التطبيق من كل الجداول ويصدّرها بأي صيغة مطلوبة
   ============================================================ */
/* ============================================================
   تحويل روابط الصور إلى Base64 لتضمينها فعليًا داخل الملفات
   (Excel/PDF/Word/PowerPoint) بدل مجرد كتابة الرابط
   ============================================================ */
const __imgDataCache = {};
async function urlToDataUri(url){
  if(!url) return null;
  if(__imgDataCache[url]) return __imgDataCache[url];
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const dataUri = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    __imgDataCache[url] = dataUri;
    return dataUri;
  }catch(e){ console.warn('تعذّر تحميل الصورة للتضمين:', url, e); return null; }
}
async function urlsToDataUris(urls){
  const unique = [...new Set(urls.filter(Boolean))];
  await Promise.all(unique.map(u=> urlToDataUri(u)));
  return __imgDataCache;
}

async function gatherAllAppData(){
  const data = { exportedAt:new Date().toISOString(), sites: factoriesData.map(computeFactory), totals: computeTotals(factoriesData.map(computeFactory)) };
  const safe = async (table, extra) => { try{ let q = supa.from(table).select('*'); if(extra) q = extra(q); const {data:d,error} = await q; if(error) throw error; return d||[]; }catch(e){ return []; } };
  [data.cameras, data.screens, data.faults, data.maintenanceLog, data.archive,
   data.storeItems, data.storeTransactions, data.storeItemImages,
   data.layouts, data.racks, data.switches, data.ups, data.auditLog,
   data.cameraMods, data.lighting, data.preventiveTasks, data.faultImages, data.maintenanceImagesAll, data.roomNeeds, data.oncall,
   data.servers, data.serverDrives, data.serverImages] = await Promise.all([
    safe('cameras'), safe('screens'), safe('faults'), safe('maintenance_log'),
    safe('reports_archive', q=>q.order('report_date',{ascending:false}).limit(200)),
    safe('store_items'), safe('store_transactions'), safe('store_item_images'),
    safe('factory_layouts'), safe('factory_racks'), safe('factory_switches'), safe('factory_ups'),
    safe('audit_log', q=>q.order('ts',{ascending:false}).limit(300)),
    safe('camera_modifications'), safe('lighting_needs'), safe('preventive_maintenance'),

    safe('oncall_schedule', q=>q.order('duty_date',{ascending:false}).limit(90)),
    safe('factory_servers'), safe('server_drives'), safe('server_images')

  return data;
}

/* ---------- Excel شامل (بصور مضمّنة فعليًا، وليست روابط) ---------- */
function addEmbeddedImage(wb, ws, dataUri, colIdx0, rowIdx0, wPx, hPx){
  if(!dataUri) return false;
  try{
    const m = /^data:image\/(\w+);base64,/.exec(dataUri);
    const ext = m ? (m[1]==='jpg'?'jpeg':m[1]) : 'jpeg';
    const base64 = dataUri.split(',')[1];
    const imgId = wb.addImage({ base64, extension: ext==='png'?'png':'jpeg' });
    ws.addImage(imgId, { tl:{col:colIdx0, row:rowIdx0}, ext:{width:wPx, height:hPx} });
    return true;
  }catch(e){ console.warn('تعذّر تضمين صورة في Excel', e); return false; }
}

  // التقارير (الأرشيف)
  if(d.archive.length) sheetFromRows('التقارير', ['التاريخ','الوردية','معد التقرير','حالة الغرفة'],
    d.archive.map(a=>[fmtDateAr(a.report_date), a.shift||'', a.preparer||'', a.room_status||'']));
  // Servers — بصورة أولى مضمّنة فعليًا لكل سيرفر
  if(d.servers && d.servers.length){
    const ws = wb.addWorksheet('Servers', {views:[{rightToLeft:true, state:'frozen', ySplit:1}]});
    const headers = ['المصنع','اسم السيرفر','الحالة','الشركة','الموديل','IP','Hostname','OS','صورة'];
    ws.columns = headers.map(()=>({width:16}));
    const hr = ws.getRow(1); headers.forEach((h,i)=>{ hr.getCell(i+1).value=h; headStyle(hr.getCell(i+1)); }); hr.height=26;
    d.servers.forEach((s,i)=>{
      const rr = i+2;
      const vals = [d.sites.find(x=>x.id===s.factory_id)?.name||'', s.server_name, s.status, s.brand||'', s.model||'', s.ip_address||'', s.hostname||'', s.os_name||''];
      vals.forEach((v,ci)=>{ const c=ws.getCell(rr,ci+1); c.value=v; c.border=border; });
      ws.getCell(rr,9).border=border; ws.getRow(rr).height=75;
      const img = (d.serverImages||[]).find(im=>im.server_id===s.id);
      if(img) addEmbeddedImage(wb, ws, __imgDataCache[img.image_url], 8, rr-1, 90, 90);
    });
  }
  // Hard Drives — تفصيل كل هارد لكل سيرفر
  if(d.serverDrives && d.serverDrives.length){
    sheetFromRows('Hard Drives', ['السيرفر','Slot','النوع','الموديل','السعة GB','الحالة'],
      d.serverDrives.map(dr=>{ const srv=(d.servers||[]).find(s=>s.id===dr.server_id); return [srv?srv.server_name:'', dr.slot_number||'', dr.drive_type||'', dr.model||'', dr.capacity_gb||0, dr.status]; }));
  }
  // جدول المناوبة
  if(d.oncall && d.oncall.length) sheetFromRows('جدول المناوبة', ['التاريخ','المناوب','ملاحظات'],
    d.oncall.map(o=>[fmtDateAr(o.duty_date), o.display_name, o.notes||'']));
  // سجل التدقيق
  if(d.auditLog.length) sheetFromRows('سجل البيانات', ['التاريخ','المستخدم','العملية','التفاصيل'],
    d.auditLog.slice(0,300).map(r=>[new Date(r.ts).toLocaleString('ar-EG'), r.actor_name, r.action, r.details||'']), [18,18,22,40]);
  return wb;
}

/* ---------- بناء HTML شامل (يُستخدم لـ PDF وWord) ---------- */
async function buildAllReportHtml(d){
  const t = d.totals;
  const section = (title, bodyHtml) => `<h2 style="color:#12716A;border-bottom:2px solid #12716A;padding-bottom:5px;margin-top:22px;font-size:16px">${title}</h2>${bodyHtml}`;
  const table = (headers, rows) => `<table style="width:100%;border-collapse:collapse;font-size:10.5px;margin-top:6px" border="1" cellpadding="5">
    <tr style="background:#0B1220;color:#fff">${headers.map(h=>`<th>${h}</th>`).join('')}</tr>
    ${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
  </table>`;
  // تحميل الصور اللازمة كـ Base64 لتضمينها فعليًا (وليست روابط) في PDF/Word
  const allImgUrls = [
    ...d.storeItemImages.map(im=>im.image_url),
    ...d.layouts.filter(l=>l.file_type==='image').map(l=>l.file_url),
    ...d.racks.map(r=>r.photo_url), ...d.switches.map(sw=>sw.photo_url), ...d.ups.map(u=>u.photo_url),
    ...(d.faultImages||[]).map(im=>im.image_url), ...(d.maintenanceImagesAll||[]).map(im=>im.image_url),
    ...d.cameras.map(c=>c.photo_url), ...(d.cameraMods||[]).flatMap(c=>[c.photo_before_url,c.photo_after_url]),
    ...(d.lighting||[]).map(l=>l.photo_url), ...(d.roomNeeds||[]).map(r=>r.photo_url),
    ...(d.serverImages||[]).map(im=>im.image_url)
  ];
  await urlsToDataUris(allImgUrls);
  const imgTag = (url, w) => { const du = __imgDataCache[url]; return du ? `<img src="${du}" style="width:${w||90}px;height:${w||90}px;object-fit:cover;border:1px solid #ccc;border-radius:4px;margin:2px">` : ''; };

  let html = `<div style="direction:rtl;font-family:Arial;color:#0B1220;padding:10px">
    <div style="text-align:center;padding:40px 0;border-bottom:4px solid #12716A;margin-bottom:20px">
      <h1 style="font-size:26px;margin-bottom:4px">التصدير الشامل لبيانات التطبيق</h1>
      <p style="color:#555">غرفة المراقبة المركزية — شركة جهينة للصناعات الغذائية</p>
      <p style="color:#888;font-size:12px">تاريخ التصدير: ${new Date().toLocaleString('ar-EG')}</p>
    </div>`;
  html += section('الملخص العام', `<p style="font-size:12.5px;line-height:1.9">
    إجمالي المصانع: ${d.sites.length} — إجمالي الكاميرات: ${t.camerasTotal} (تعمل ${t.camerasUp}، منقطعة ${t.camerasDown}، نسبة تشغيل ${fmtPct2(t.camUptime)}) —
    إجمالي الشاشات: ${t.screens} (تعمل ${t.screensUp}، منقطعة ${t.screensDown}) — أصناف المخزن: ${d.storeItems.length} —
    الراكات: ${d.racks.length} — السويتشات: ${d.switches.length} — UPS: ${d.ups.length} — الأعطال المسجلة: ${d.faults.length}.</p>`);
  html += section('بيانات المصانع', table(['المصنع','الشاشات','منقطعة','الكاميرات','تعمل','منقطعة','نسبة التشغيل'],
    d.sites.map(s=>[s.name,s.screens,s.screensDown,s.camerasTotal,s.camerasUp,s.camerasDown,fmtPct2(s.camUptime)])));

  // الخرائط — صور فعلية مضمّنة (وليست روابط)
  if(d.layouts.length) html += section('الخرائط والـ Layout', d.layouts.map(l=>`
    <div style="display:inline-block;text-align:center;margin:6px;vertical-align:top">
      ${l.file_type==='image' ? imgTag(l.file_url, 140) : `<div style="width:140px;height:100px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;color:#888">ملف PDF</div>`}
      <div style="font-size:10px;color:#555;max-width:140px">${d.sites.find(s=>s.id===l.factory_id)?.name||''}<br>${l.layout_name}</div>
    </div>`).join(''));

  if(d.racks.length || d.switches.length) html += section('البنية التحتية للشبكة', `
    ${d.racks.length? table(['المصنع','الراك','المكان','صورة'], d.racks.map(r=>[d.sites.find(s=>s.id===r.factory_id)?.name||'',r.rack_name,r.location||'',imgTag(r.photo_url,70)])) : ''}
    ${d.switches.length? table(['المصنع','السويتش','النوع','المنافذ','مستخدمة','كاميرات','صورة'], d.switches.map(sw=>[d.sites.find(s=>s.id===sw.factory_id)?.name||'',sw.switch_name,sw.switch_type||'',sw.total_ports||0,sw.used_ports||0,getSwitchCameraCount(sw),imgTag(sw.photo_url,70)])) : ''}`);
  if(d.ups.length) html += section('UPS ومصادر الطاقة', table(['المصنع','UPS','المكان','الحالة','صورة'], d.ups.map(u=>[d.sites.find(s=>s.id===u.factory_id)?.name||'',u.ups_name,u.location||'',u.status,imgTag(u.photo_url,70)])));
  if(d.storeItems.length) html += section('المخزن', table(['الصنف','النوع','الرصيد','صور'], d.storeItems.map(it=>{
    const bal=d.storeTransactions.filter(t=>t.item_id===it.id).reduce((a,t)=>a+(t.in_qty||0)-(t.out_qty||0),0);
    const imgs = d.storeItemImages.filter(im=>im.item_id===it.id).slice(0,3).map(im=>imgTag(im.image_url,60)).join('');
    return [it.item_name,it.item_type||'',bal,imgs];
  })));
  if(d.faults.length) html += section('الأعطال', table(['المصنع','الجهاز','الخطورة','الحالة','صورة'], d.faults.map(f=>{
    const img = (d.faultImages||[]).find(im=>im.fault_id===f.id);
    return [d.sites.find(s=>s.id===f.factory_id)?.name||'',f.device_name,f.severity,f.status, img?imgTag(img.image_url,60):''];
  })));
  if(d.preventiveTasks.length) html += section('الصيانة الوقائية', table(['الموقع','نوع الصيانة','الموعد','صورة'], d.preventiveTasks.map(pt=>{
    const img = (d.maintenanceImagesAll||[]).find(im=>im.task_id===pt.id);
    return [pt.target_name, pt.maintenance_type, fmtDateAr(pt.scheduled_date), img?imgTag(img.image_url,60):''];
  })));
  if(d.lighting && d.lighting.length) html += section('احتياجات الإضاءة', table(['المصنع','المكان','الحالة','صورة'], d.lighting.map(l=>[l.factory_name,l.place_name,l.status,imgTag(l.photo_url,60)])));
  if(d.roomNeeds && d.roomNeeds.length) html += section('احتياجات الغرفة', table(['العنوان','الحالة','صورة'], d.roomNeeds.map(r=>[r.title,r.status,imgTag(r.photo_url,60)])));
  if(d.cameraMods && d.cameraMods.length) html += section('الكاميرات المطلوب تعديلها (قبل/بعد)', d.cameraMods.map(c=>`
    <div style="display:inline-block;text-align:center;margin:6px;vertical-align:top">
      <div style="display:flex;gap:4px">${imgTag(c.photo_before_url,80)}${imgTag(c.photo_after_url,80)}</div>
      <div style="font-size:10px;color:#555">${c.camera_name} — ${c.status}</div>
    </div>`).join(''));
  if(d.servers && d.servers.length) html += section('Servers', table(['المصنع','الاسم','الحالة','IP','OS','صورة'], d.servers.map(s=>{
    const img = (d.serverImages||[]).find(im=>im.server_id===s.id);
    return [d.sites.find(x=>x.id===s.factory_id)?.name||'', s.server_name, s.status, s.ip_address||'', s.os_name||'', img?imgTag(img.image_url,60):''];
  })));
  if(d.serverDrives && d.serverDrives.length) html += section('Hard Drives', table(['السيرفر','Slot','النوع','السعة GB','الحالة'], d.serverDrives.map(dr=>{
    const srv=(d.servers||[]).find(s=>s.id===dr.server_id); return [srv?srv.server_name:'', dr.slot_number||'', dr.drive_type||'', dr.capacity_gb||0, dr.status];
  })));
  if(d.archive.length) html += section('أرشيف التقارير', table(['التاريخ','الوردية','معد التقرير','الحالة'], d.archive.slice(0,50).map(a=>[fmtDateAr(a.report_date),a.shift||'',a.preparer||'',a.room_status||''])));
  html += `<p style="text-align:center;color:#888;margin-top:30px;font-size:11px;border-top:1px dashed #ccc;padding-top:10px">— تصدير شامل تلقائي من نظام غرفة المراقبة المركزية — إعداد وتشغيل: إبراهيم رمضان —</p></div>`;
  return html;
}

/* ---------- PDF شامل ---------- */
async function exportAllPdf(){
  const ok = await ensurePdfLib(); if(!ok){ toast('⚠️ تعذّر تحميل مكتبة PDF'); return; }
  toast('جاري تجميع كل بيانات التطبيق والصور...');
  try{
    const d = await gatherAllAppData();
    const el = document.createElement('div'); el.innerHTML = await buildAllReportHtml(d);
    document.body.appendChild(el);
    const blob = await html2pdf().set({margin:8, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'}, pagebreak:{mode:['css','legacy']}}).from(el).outputPdf('blob');
    el.remove();
    await saveOrShareFile(blob, exportCenterFilename('pdf'));
    await logAudit('تصدير شامل PDF', `${d.sites.length} مصنع`);
  }catch(e){ console.error(e); toast('🚫 تعذّر التصدير: '+(e.message||'')); }
}

/* ---------- صورة Infographic شاملة ---------- */
async function exportAllImage(){
  toast('جاري تجميع كل بيانات التطبيق...');
  try{
    const d = await gatherAllAppData();
    const t = d.totals;
    const rowH=38; const W=1080; const H=780 + d.sites.length*rowH + 160;
    const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx = cv.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#0B1220'); grad.addColorStop(1,'#0E1830');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
    ctx.fillStyle='#38D9C9'; ctx.font='700 26px Arial'; ctx.fillText('غرفة المراقبة المركزية — جهينة', W/2, 60);
    ctx.fillStyle='#E9EEFB'; ctx.font='900 32px Arial'; ctx.fillText('نظرة عامة شاملة على كل بيانات التطبيق', W/2, 104);
    ctx.fillStyle='#8CA0C4'; ctx.font='500 18px Arial'; ctx.fillText(new Date().toLocaleDateString('ar-EG'), W/2, 134);

    const cards = [
      ['المصانع', d.sites.length, '#38D9C9'], ['الكاميرات', t.camerasTotal, '#E9EEFB'], ['نسبة تشغيل الكاميرات', fmtPct2(t.camUptime), '#4ADE80'],
      ['الشاشات', t.screens, '#E9EEFB'], ['أصناف المخزن', d.storeItems.length, '#F5A623'], ['أجهزة UPS', d.ups.length, '#4ADE80'],
      ['الراكات', d.racks.length, '#38D9C9'], ['السويتشات', d.switches.length, '#38D9C9'], ['الأعطال المسجلة', d.faults.length, '#FF6B6B'],
    ];
    const cw=(W-4*30)/3, ch=95, top=165;
    cards.forEach(([label,val,color],i)=>{
      const col=i%3, row=Math.floor(i/3), x=30+col*(cw+30), y=top+row*(ch+14);
      ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(x,y,cw,ch);
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.strokeRect(x,y,cw,ch);
      ctx.fillStyle='#8CA0C4'; ctx.font='500 15px Arial'; ctx.fillText(label,x+cw/2,y+28);
      ctx.fillStyle=color; ctx.font='900 32px Arial'; ctx.fillText(String(val),x+cw/2,y+66);
    });
    let ty = top + 3*(ch+14) + 30;
    ctx.fillStyle='#E9EEFB'; ctx.font='700 20px Arial'; ctx.fillText('ملخص المصانع', W/2, ty); ty+=30;
    const cols=[['الموقع',300],['إجمالي',190],['تعمل',190],['منقطعة',190]];
    ctx.font='700 15px Arial'; ctx.fillStyle='#38D9C9';
    let cx=W-40; cols.forEach(([l,w])=>{ cx-=w; ctx.fillText(l,cx+w/2,ty+22); }); ty+=32;
    d.sites.forEach((s,i)=>{
      const ry=ty+i*rowH;
      if(i%2===0){ ctx.fillStyle='rgba(255,255,255,0.02)'; ctx.fillRect(30,ry,W-60,rowH); }
      let cx2=W-40; const vals=[s.name,s.camerasTotal,s.camerasUp,s.camerasDown];
      ctx.font='600 15px Arial';
      vals.forEach((v,j)=>{ const w=cols[j][1]; cx2-=w; ctx.fillStyle = j===3&&s.camerasDown>0?'#FF6B6B':(j===2?'#4ADE80':'#E9EEFB'); ctx.fillText(String(v),cx2+w/2,ry+24); });
    });
    ctx.fillStyle='#5E6E92'; ctx.font='500 13px Arial'; ctx.fillText('تصدير شامل تلقائي — بيانات فعلية 100%', W/2, H-40);
    ctx.fillStyle='#38D9C9'; ctx.font='700 15px Arial'; ctx.fillText('إعداد وتشغيل النظام: إبراهيم رمضان', W/2, H-16);
    cv.toBlob(async blob=>{ await saveOrShareFile(blob, exportCenterFilename('png')); await logAudit('تصدير شامل صورة', `${d.sites.length} مصنع`); }, 'image/png', 0.95);
  }catch(e){ console.error(e); toast('🚫 تعذّر التصدير: '+(e.message||'')); }
}

/* ---------- CSV شامل ---------- */
async function exportAllCsv(){
  toast('جاري تجميع كل بيانات التطبيق...');
  try{
    const d = await gatherAllAppData();
    const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
    const lines = ['\ufeff'];
    lines.push('== المصانع ==');
    lines.push(['المصنع','الشاشات','منقطعة','الكاميرات','تعمل','منقطعة','نسبة التشغيل %'].map(esc).join(','));
    d.sites.forEach(s=> lines.push([s.name,s.screens,s.screensDown,s.camerasTotal,s.camerasUp,s.camerasDown,Math.round(s.camUptime*100)/100].map(esc).join(',')));
    lines.push(''); lines.push('== المخزن =='); lines.push(['الصنف','النوع','الرصيد'].map(esc).join(','));
    d.storeItems.forEach(it=>{ const bal=d.storeTransactions.filter(t=>t.item_id===it.id).reduce((a,t)=>a+(t.in_qty||0)-(t.out_qty||0),0); lines.push([it.item_name,it.item_type||'',bal].map(esc).join(',')); });
    lines.push(''); lines.push('== Switches =='); lines.push(['المصنع','السويتش','النوع','المنافذ','مستخدمة','كاميرات'].map(esc).join(','));
    d.switches.forEach(sw=> lines.push([d.sites.find(s=>s.id===sw.factory_id)?.name||'',sw.switch_name,sw.switch_type||'',sw.total_ports||0,sw.used_ports||0,getSwitchCameraCount(sw)].map(esc).join(',')));
    lines.push(''); lines.push('== UPS =='); lines.push(['المصنع','UPS','المكان','الحالة'].map(esc).join(','));
    d.ups.forEach(u=> lines.push([d.sites.find(s=>s.id===u.factory_id)?.name||'',u.ups_name,u.location||'',u.status].map(esc).join(',')));
    await saveOrShareFile(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}), exportCenterFilename('csv'));
    await logAudit('تصدير شامل CSV', `${d.sites.length} مصنع`);
  }catch(e){ console.error(e); toast('🚫 تعذّر التصدير'); }
}

/* ---------- تصدير الكل في ملف ZIP واحد ---------- */
async function exportAllFormats(){
  const zipOk = await ensureZipLib();
  if(!zipOk){ toast('⚠️ تعذّر تحميل مكتبة الضغط ZIP — سيتم تصدير الصيغ منفصلة بدلًا من ذلك'); 
    await exportAllExcel(); await exportAllPdf(); await exportAllJson(); return; }
  toast('جاري تجهيز كل الصيغ... قد يستغرق دقيقة');
  try{
    const d = await gatherAllAppData();
    const zip = new JSZip();
    const folder = zip.folder(exportCenterFilename(''));

    const excelWb = await buildAllExcelWorkbook(d);
    folder.file('التقرير-الشامل.xlsx', await excelWb.xlsx.writeBuffer());

    folder.file('التقرير-الشامل.json', JSON.stringify(d,null,2));

    const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
    const csvLines = ['\ufeff== المصانع ==', ['المصنع','الشاشات','منقطعة','الكاميرات','تعمل','منقطعة'].map(esc).join(',')];
    d.sites.forEach(s=> csvLines.push([s.name,s.screens,s.screensDown,s.camerasTotal,s.camerasUp,s.camerasDown].map(esc).join(',')));
    folder.file('التقرير-الشامل.csv', csvLines.join('\n'));

    const reportHtmlBody = await buildAllReportHtml(d); // بالصور المضمّنة (Base64) — تُحسب مرة واحدة وتُستخدم لـ Word وPDF معًا
    const wordHtml = `<html><head><meta charset="utf-8"></head><body>${reportHtmlBody}</body></html>`;
    folder.file('التقرير-الشامل.doc', '\ufeff'+wordHtml);

    if(await ensurePdfLib()){
      const el = document.createElement('div'); el.innerHTML = reportHtmlBody;
      document.body.appendChild(el);
      const pdfBlob = await html2pdf().set({margin:8, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'}}).from(el).outputPdf('blob');
      el.remove();
      folder.file('التقرير-الشامل.pdf', pdfBlob);
    }
    if(await ensurePptxLib()){
      try{
        const pptx = new PptxGenJS();
        const t = d.totals;
        const cover = pptx.addSlide(); cover.background={color:'0B1220'};
        cover.addText('التقرير الشامل — غرفة المراقبة المركزية', {x:0.5,y:2.5,w:9,h:1,fontSize:28,bold:true,color:'38D9C9',align:'center'});
        d.sites.forEach(s=>{ const sl=pptx.addSlide(); sl.background={color:'0B1220'};
          sl.addText(s.name, {x:0.4,y:0.3,w:9,h:0.6,fontSize:22,bold:true,color:'38D9C9',align:'center'});
          sl.addTable([['البند','القيمة'],['الكاميرات',String(s.camerasTotal)],['تعمل',String(s.camerasUp)],['منقطعة',String(s.camerasDown)]],
            {x:0.6,y:1.2,w:8.8,fontSize:14,color:'E9EEFB',fill:{color:'182446'}});
        });
        folder.file('التقرير-الشامل.pptx', await pptx.write('arraybuffer'));
      }catch(e){ console.warn('تعذّر إضافة PowerPoint للحزمة', e); }
    }

    const zipBlob = await zip.generateAsync({type:'blob'});
    await saveOrShareFile(zipBlob, exportCenterFilename('zip'));
    await logAudit('تصدير شامل - كل الصيغ (ZIP)', `${d.sites.length} مصنع`);
    toast('✅ تم تجهيز حزمة التصدير الكاملة');
  }catch(e){ console.error(e); toast('🚫 تعذّر تجهيز الحزمة: '+(e.message||'')); }
}

// تسجيل Service Worker (يعمل فقط عند فتح التطبيق عبر رابط HTTPS حقيقي، ويُتجاهل بأمان غير ذلك)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{ /* يُتجاهل بأمان (مثلًا عند الفتح كملف محلي) */ });
  });
}

/* ============================================================
   فرض تحديث التطبيق: مسح كل النسخ المخزّنة (Cache) وService Worker
   القديم، ثم إعادة تحميل الصفحة من الإنترنت مباشرة بدون أي كاش
   ============================================================ */
async function forceAppUpdate(){
  toast('جاري تحديث التطبيق...');
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=> caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=> r.unregister()));
    }
  }catch(e){ console.warn('تعذّر مسح الكاش بالكامل (غير خطير)', e); }
  setTimeout(()=>{ location.href = location.origin + location.pathname + '?refresh=' + Date.now(); }, 300);
}

/* ============================================================
   جدول المناوبة (On-Call) — يظهر في الداشبورد من هو المسؤول اليوم
   ============================================================ */
async function loadOnCallCard(){
  const host = document.getElementById('oncallCard');
  if(!host) return;
  const today = new Date().toISOString().slice(0,10);
  try{
    const {data, error} = await supa.from('oncall_schedule').select('*').eq('duty_date', today).limit(1).single();
    if(error) throw error;
    host.innerHTML = `<div class="site-card" style="display:flex;align-items:center;justify-content:space-between;background:linear-gradient(150deg,#16233F,#0F1A30);margin-top:12px">
      <div><div style="font-size:10.5px;color:var(--muted)">👤 المناوب اليوم</div><div style="font-weight:800;font-family:'Tajawal';font-size:15px;color:var(--accent)">${data.display_name}</div>${data.notes?`<div style="font-size:10.5px;color:var(--muted-2)">${data.notes}</div>`:''}</div>
      ${isAdmin()?`<button class="btn sm" onclick="openOnCallManager()">📅 إدارة</button>`:''}
    </div>`;
  }catch(e){
    host.innerHTML = isAdmin() ? `<div class="site-card" style="margin-top:12px;text-align:center;cursor:pointer" onclick="openOnCallManager()">
      <div style="font-size:12px;color:var(--muted)">لا يوجد مناوب محدَّد اليوم — اضغط لتحديد الجدول</div>
    </div>` : '';
  }
}
async function openOnCallManager(){
  if(!isAdmin()) return;
  openModal(`<div class="modal-head"><h3>📅 إدارة جدول المناوبة</h3><button class="x-close" onclick="closeModal()">✕</button></div><div class="empty">جاري التحميل...</div>`);
  let list = [];
  try{ const {data} = await supa.from('oncall_schedule').select('*').gte('duty_date', new Date().toISOString().slice(0,10)).order('duty_date').limit(30); list = data||[]; }catch(e){}
  document.getElementById('modalHost').innerHTML = `
    <div class="modal-head"><h3>📅 إدارة جدول المناوبة</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>التاريخ</label><input class="input" type="date" id="oc_date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>اسم المناوب</label><input class="input" id="oc_name" placeholder="اسم الموظف المسؤول"></div>
    <div class="field"><label>ملاحظات</label><input class="input" id="oc_notes" placeholder="اختياري"></div>
    <button class="btn primary block" onclick="saveOnCall()">💾 حفظ</button>
    <div class="section-title"><h2 style="font-size:12px">الجدول القادم</h2></div>
    ${list.length ? list.map(o=>`<div class="site-card" style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center">
      <div><b>${fmtDateAr(o.duty_date)}</b> — ${o.display_name}</div>
      <button class="btn sm danger" onclick="deleteOnCall('${o.id}')">🗑</button>
    </div>`).join('') : '<div class="empty">لا يوجد جدول مستقبلي بعد.</div>'}
  `;
}
async function saveOnCall(){
  const payload = {
    duty_date: document.getElementById('oc_date').value,
    display_name: document.getElementById('oc_name').value.trim(),
    notes: document.getElementById('oc_notes').value.trim(),
    created_by: currentProfile.id
  };
  if(!payload.duty_date || !payload.display_name){ toast('أدخل التاريخ والاسم'); return; }
  try{
    const {error} = await supa.from('oncall_schedule').insert(payload);
    if(error) throw error;
    await logAudit('تحديد مناوبة', `${payload.display_name} — ${fmtDateAr(payload.duty_date)}`);
    toast('✅ تم الحفظ'); openOnCallManager(); loadOnCallCard();
  }catch(e){ console.error(e); toast('🚫 تعذّر الحفظ: '+(e.message||'تحقق من تشغيل schema_part10.sql')); }
}
async function deleteOnCall(id){
  try{ await supa.from('oncall_schedule').delete().eq('id',id); toast('تم الحذف'); openOnCallManager(); loadOnCallCard(); }
  catch(e){ toast('🚫 تعذّر الحذف'); }
}
