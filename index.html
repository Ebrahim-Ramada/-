      ${(r.photo_url && (isAdmin()||hasPerm('view_roomneeds_images')))? `<img src="${r.photo_url}" style="width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:zoom-in" onclick="openImageLightbox('${r.photo_url}')">`:''}
      ${r.notes? `<p style="font-size:11px;color:var(--muted);margin-top:6px">${r.notes}</p>`:''}
      <div class="btn-row" style="margin-top:8px">
        ${(isAdmin()||hasPerm('upload_roomneeds_images')) ? `<label class="btn sm" style="cursor:pointer">${r.photo_url?'استبدال الصورة':'📷 رفع صورة'}<input type="file" accept="image/*" style="display:none" onchange="uploadRoomNeedPhoto('${r.id}',this)"></label>` : ''}
        ${(r.photo_url && (isAdmin()||hasPerm('delete_roomneeds_images'))) ? `<button class="btn sm danger" onclick="removeRoomNeedPhoto('${r.id}')">🗑 حذف الصورة</button>` : ''}
        ${isAdmin()? `<select class="input" style="font-size:12px;padding:6px 8px;width:auto" onchange="updateRoomNeedStatus('${r.id}', this.value)">
          ${['لم يتم التنفيذ','قيد التنفيذ','تم التنفيذ'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn sm" onclick="openRoomNeedForm('${r.id}')">✏️</button>
        <button class="btn sm danger" onclick="deleteRoomNeed('${r.id}')">🗑 حذف السجل</button>` : ''}
      </div>
    </div>`).join('');
}
function openRoomNeedForm(id){
  const r = id ? roomNeedsData.find(x=>x.id===id) : null;
  const isNew = !r;
  const d = r || {title:'', description:'', priority:'متوسطة', status:'لم يتم التنفيذ', notes:'', fulfilled_date:''};
  openModal(`
    <div class="modal-head"><h3>${isNew?'إضافة احتياج جديد':'تعديل احتياج'}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>عنوان الاحتياج</label><input class="input" id="rn_title" value="${d.title}" placeholder="مثال: كرسي مكتب جديد"></div>
    <div class="field"><label>الوصف</label><textarea class="input" id="rn_desc">${d.description||''}</textarea></div>
    <div class="row2">
      <div class="field"><label>الأولوية</label><select class="input" id="rn_priority">${['منخفضة','متوسطة','عالية','عاجلة'].map(p=>`<option ${d.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="field"><label>الحالة</label><select class="input" id="rn_status">${['لم يتم التنفيذ','قيد التنفيذ','تم التنفيذ'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>تاريخ التنفيذ/التوفير (إن وُجد)</label><input class="input" type="date" id="rn_fulfilled" value="${d.fulfilled_date||''}"></div>
    <div class="field"><label>ملاحظات</label><textarea class="input" id="rn_notes">${d.notes||''}</textarea></div>
    <button class="btn primary block" onclick="saveRoomNeedForm('${isNew?'':id}')">💾 حفظ</button>
  `);
}
async function saveRoomNeedForm(id){
  const title = document.getElementById('rn_title').value.trim();
  if(!title){ toast('أدخل عنوان الاحتياج'); return; }
  const payload = {
    title, description: document.getElementById('rn_desc').value.trim(),
    priority: document.getElementById('rn_priority').value, status: document.getElementById('rn_status').value,
    fulfilled_date: document.getElementById('rn_fulfilled').value || null,
    notes: document.getElementById('rn_notes').value.trim(), updated_by: currentProfile.id
  };
  try{
    if(id){ const {error}=await supa.from('room_needs').update(payload).eq('id',id); if(error) throw error; await logAudit('تعديل احتياج غرفة', title); }
    else { payload.created_by=currentProfile.id; const {error}=await supa.from('room_needs').insert(payload); if(error) throw error; await logAudit('إضافة احتياج غرفة', title); }
    closeModal(); toast('✅ تم الحفظ'); loadRoomNeeds(); loadDashboardSummaries();
  }catch(e){ toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
async function updateRoomNeedStatus(id, status){
  try{
    const payload = {status};
    if(status==='تم التنفيذ') payload.fulfilled_date = new Date().toISOString().slice(0,10);
    await supa.from('room_needs').update(payload).eq('id',id);
    const r=roomNeedsData.find(x=>x.id===id); await logAudit('تحديث حالة احتياج غرفة', r?r.title:id, r?.status, status);
    toast('✅ تم التحديث'); loadRoomNeeds(); loadDashboardSummaries();
  }catch(e){ toast('🚫 تعذّر التحديث'); }
}
async function uploadRoomNeedPhoto(id, inputEl){
  if(!isAdmin() && !hasPerm('upload_roomneeds_images')){ toast('🚫 لا تملك صلاحية رفع الصور'); return; }
  const file = inputEl.files[0]; if(!file) return;
  toast('جاري رفع الصورة...');
  try{
    const compressed = await compressImageFile(file);
    const path = `roomneeds/${id}-${Date.now()}.jpg`;
    const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
    if(upErr) throw upErr;
    const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
    const {error} = await supa.from('room_needs').update({photo_url: pub.publicUrl}).eq('id', id);
    if(error) throw error;
    toast('✅ تم رفع الصورة'); loadRoomNeeds();
  }catch(e){ console.error(e); toast('🚫 تعذّر رفع الصورة: '+(e.message||'')); }
}
async function removeRoomNeedPhoto(id){
  if(!isAdmin() && !hasPerm('delete_roomneeds_images')){ toast('🚫 لا تملك صلاحية حذف الصور'); return; }
  try{ await supa.from('room_needs').update({photo_url:null}).eq('id',id); toast('✅ تم حذف الصورة'); loadRoomNeeds(); }
  catch(e){ toast('🚫 تعذّر الحذف'); }
}
function deleteRoomNeed(id){
  openModal(`<div class="modal-head"><h3>تأكيد الحذف</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <button class="btn danger block" onclick="confirmDeleteRoomNeed('${id}')">حذف نهائيًا</button>`);
}
async function confirmDeleteRoomNeed(id){
  try{ await supa.from('room_needs').delete().eq('id',id); await logAudit('حذف احتياج غرفة', id); closeModal(); toast('تم الحذف'); loadRoomNeeds(); loadDashboardSummaries(); }
  catch(e){ toast('🚫 تعذّر الحذف'); }
}
async function exportRoomNeedsExcel(){
  const ok = await ensureExcelLib(); if(!ok){ toast('⚠️ تعذّر تحميل مكتبة Excel'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('احتياجات الغرفة', {views:[{rightToLeft:true}]});
  ws.addRow(['العنوان','الوصف','الأولوية','الحالة','تاريخ الإضافة','تاريخ التنفيذ']).font={bold:true};
  roomNeedsData.forEach(r=> ws.addRow([r.title,r.description||'',r.priority,r.status,fmtDateAr(r.created_at.slice(0,10)),r.fulfilled_date?fmtDateAr(r.fulfilled_date):'']));
  ws.columns.forEach(c=>c.width=22);
  const buf = await wb.xlsx.writeBuffer();
  await saveOrShareFile(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `احتياجات-الغرفة-${new Date().toISOString().slice(0,10)}.xlsx`);
}
async function exportRoomNeedsPdf(){
  const ok = await ensurePdfLib(); if(!ok){ toast('⚠️ تعذّر تحميل مكتبة PDF'); return; }
  const el = document.createElement('div');
  el.style.cssText = 'direction:rtl;font-family:Arial;padding:14px;color:#0B1220';
  el.innerHTML = `<h2 style="text-align:center">تقرير احتياجات الغرفة</h2>
    <table style="width:100%;border-collapse:collapse;font-size:11px" border="1" cellpadding="5">
      <tr style="background:#0B1220;color:#fff"><th>العنوان</th><th>الوصف</th><th>الأولوية</th><th>الحالة</th></tr>
      ${roomNeedsData.map(r=>`<tr><td>${r.title}</td><td>${r.description||''}</td><td>${r.priority}</td><td>${r.status}</td></tr>`).join('')}
    </table>`;
  document.body.appendChild(el);
  const blob = await html2pdf().set({margin:8, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'}}).from(el).outputPdf('blob');
  el.remove();
  await saveOrShareFile(blob, `تقرير-احتياجات-الغرفة-${new Date().toISOString().slice(0,10)}.pdf`);
}


/* ============================================================
   الوحدة: خرائط المصانع (Factory Layouts) — صورة أو PDF
   ============================================================ */
let layoutsData = [];
function renderLayoutsPlaceholder(factoryId){
  const f = factoriesData.find(x=>x.id===factoryId);
  return `<div class="view active">
    <div class="section-title" style="margin-top:0"><h2>🗺️ الخرائط والـ Layout: ${f?f.name:'—'}</h2>
      ${isAdmin()? `<button class="btn primary sm" onclick="openLayoutForm('${factoryId}')">+ إضافة خريطة</button>`:''}
    </div>
    <button class="btn sm" onclick="goTo('factories')">→ رجوع للمصانع</button>
    <div id="layoutsListHost" style="margin-top:12px"><div class="empty">جاري التحميل...</div></div>
  </div>`;
}
async function loadLayouts(factoryId){
  try{
    const {data, error} = await supa.from('factory_layouts').select('*').eq('factory_id', factoryId).order('created_at',{ascending:false});
    if(error) throw error;
    layoutsData = data||[];
  }catch(e){
    console.warn(e);
    const host = document.getElementById('layoutsListHost');
    if(host) host.innerHTML = `<div class="empty">⚠️ هذه الميزة تحتاج تشغيل ملف schema_part5.sql في Supabase أولًا.</div>`;
    return;
  }
  const host = document.getElementById('layoutsListHost');
  if(!host) return;
  if(!layoutsData.length){ host.innerHTML='<div class="empty">لا توجد خرائط مضافة بعد.</div>'; return; }
  host.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${layoutsData.map(l=>`
    <div class="site-card" style="padding:10px">
      ${l.file_type==='pdf'
        ? `<div style="height:110px;background:var(--bg-2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer" onclick="window.open('${l.file_url}','_blank')">📄</div>`
        : `<img src="${l.file_url}" style="width:100%;height:110px;object-fit:cover;border-radius:8px;cursor:zoom-in" onclick="openImageLightbox('${l.file_url}')">`}
      <div style="font-size:12.5px;font-weight:700;margin-top:6px">${l.layout_name}</div>
      ${l.notes? `<div style="font-size:10.5px;color:var(--muted)">${l.notes}</div>`:''}
      ${l.original_file_url? `<div style="font-size:9.5px;color:var(--amber);margin-top:2px">✏️ مُعدَّلة</div>`:''}
      ${l.file_type==='image' ? `<button class="btn sm block" style="margin-top:6px" onclick="openLayoutServerMarkers('${l.id}','${factoryId}')">📍 السيرفرات على الخريطة</button>`:''}
      ${isAdmin()? `<div class="btn-row" style="margin-top:6px">
        ${l.file_type==='image' ? `<button class="btn sm primary" onclick="openLayoutEditor('${l.id}')">✏️ تعديل</button>`:''}
        ${l.original_file_url? `<button class="btn sm" onclick="restoreOriginalLayout('${l.id}')">↩️ الأصل</button>`:''}
        <button class="btn sm danger" onclick="deleteLayout('${l.id}','${l.factory_id}')">🗑 حذف</button>
      </div>`:''}
    </div>`).join('')}</div>`;
}
function openLayoutForm(factoryId){
  openModal(`
    <div class="modal-head"><h3>+ إضافة خريطة</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>اسم الخريطة</label><input class="input" id="ly_name" placeholder="مثال: الدور الأرضي / شبكة الكاميرات"></div>
    <div class="field"><label>ملاحظات</label><textarea class="input" id="ly_notes"></textarea></div>
    <div class="field"><label>الملف (صورة أو PDF)</label><input class="input" type="file" id="ly_file" accept="image/*,application/pdf"></div>
    <button class="btn primary block" onclick="saveLayoutForm('${factoryId}')">💾 رفع وحفظ</button>
  `);
}
async function saveLayoutForm(factoryId){
  const name = document.getElementById('ly_name').value.trim();
  const fileEl = document.getElementById('ly_file');
  const file = fileEl.files[0];
  if(!name){ toast('أدخل اسم الخريطة'); return; }
  if(!file){ toast('اختر ملف الخريطة'); return; }
  toast('جاري رفع الملف...');
  try{
    const isPdf = file.type === 'application/pdf';
    let uploadBlob = file, ext = 'pdf';
    if(!isPdf){ uploadBlob = await compressImageFile(file, 1400, 0.75); ext='jpg'; }
    const path = `layouts/${factoryId}-${Date.now()}.${ext}`;
    const {error: upErr} = await supa.storage.from('camera-photos').upload(path, uploadBlob, {contentType: isPdf?'application/pdf':'image/jpeg', upsert:true});
    if(upErr) throw upErr;
    const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
    const {error} = await supa.from('factory_layouts').insert({
      factory_id: factoryId, layout_name: name, file_url: pub.publicUrl, file_type: isPdf?'pdf':'image',
      notes: document.getElementById('ly_notes').value.trim(), created_by: currentProfile.id
    });
    if(error) throw error;
    const f = factoriesData.find(x=>x.id===factoryId);
    await logAudit('إضافة خريطة مصنع', `${f?f.name:''}: ${name}`);
    closeModal(); toast('✅ تم رفع الخريطة'); loadLayouts(factoryId);
  }catch(e){ console.error(e); toast('🚫 تعذّر الرفع: '+(e.message||'')); }
}

/* ============================================================
   علامات السيرفرات على خرائط الـ Layout — نقاط تفاعلية حقيقية
   (منفصلة عن صورة الخريطة نفسها، فتبقى قابلة للنقر والتحريك دائمًا)
   ============================================================ */
let currentLayoutMarkers = [];
let pendingMarkerCoords = null;
async function openLayoutServerMarkers(layoutId, factoryId){
  const l = layoutsData.find(x=>x.id===layoutId);
  if(!l){ toast('تعذّر إيجاد الخريطة'); return; }
  let factoryServers = [];
  try{ const {data} = await supa.from('factory_servers').select('*').eq('factory_id', factoryId); factoryServers = data||[]; }catch(e){}
  try{ const {data} = await supa.from('layout_server_markers').select('*').eq('layout_id', layoutId); currentLayoutMarkers = data||[]; }catch(e){ currentLayoutMarkers=[]; }
  window.__currentMarkerLayout = { layoutId, factoryId, imageUrl: l.file_url, servers: factoryServers };
  pendingMarkerCoords = null;
  renderLayoutMarkersModal();
}
function renderLayoutMarkersModal(){
  const ctx = window.__currentMarkerLayout;
  const markersHtml = currentLayoutMarkers.map(m=>{
    const srv = ctx.servers.find(s=>s.id===m.server_id);
    return `<div class="layout-marker-pin" style="position:absolute;right:${100-m.x_pct}%;top:${m.y_pct}%;transform:translate(50%,-50%);cursor:pointer;z-index:2" onclick='handleMarkerClick("${m.id}")'>
      <div style="width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">
        <span style="transform:rotate(45deg);font-size:12px">🖥️</span>
      </div>
      <div style="position:absolute;top:28px;right:50%;transform:translateX(50%);white-space:nowrap;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px">${srv?srv.server_name:'؟'}</div>
    </div>`;
  }).join('');
  const pendingHtml = pendingMarkerCoords ? `<div style="position:absolute;right:${100-pendingMarkerCoords.x}%;top:${pendingMarkerCoords.y}%;transform:translate(50%,-50%);z-index:3">
    <div style="width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--amber);transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;animation:blink 1s infinite"></div>
  </div>` : '';
  openModal(`
    <div class="modal-head"><h3>📍 السيرفرات على الخريطة</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div id="layoutMarkerImgWrap" style="position:relative;width:100%;border-radius:10px;overflow:hidden;cursor:${isAdmin()?'crosshair':'default'}" onclick="${isAdmin()?'onLayoutMapClick(event)':''}">
      <img src="${ctx.imageUrl}" style="width:100%;display:block" draggable="false">
      ${markersHtml}
      ${pendingHtml}
    </div>
    ${pendingMarkerCoords ? `
      <div class="field" style="margin-top:10px"><label>اختر السيرفر لوضع العلامة هنا</label>
        <select class="input" id="pendingMarkerServer">${ctx.servers.length? ctx.servers.map(s=>`<option value="${s.id}">${s.server_name}</option>`).join('') : '<option value="">لا توجد سيرفرات مسجّلة لهذا المصنع</option>'}</select>
      </div>
      <div class="btn-row">
        <button class="btn primary sm" onclick="saveLayoutMarker()">💾 حفظ العلامة</button>
        <button class="btn sm" onclick="pendingMarkerCoords=null; renderLayoutMarkersModal()">إلغاء</button>
      </div>` : ''}
    ${isAdmin() && !pendingMarkerCoords ? `<p style="font-size:10.5px;color:var(--muted-2);margin-top:10px">💡 دوس في أي مكان على الخريطة فوق عشان تحط علامة سيرفر جديدة. دوس على أي علامة موجودة عشان تفتح ملف السيرفر أو تحذفها.</p>` : ''}
    ${!isAdmin() ? `<p style="font-size:10.5px;color:var(--muted-2);margin-top:10px">💡 دوس على أي علامة 🖥️ عشان تفتح ملف السيرفر الكامل.</p>` : ''}
  `);
}
function onLayoutMapClick(evt){
  if(evt.target.closest('.layout-marker-pin')) return; // تجاهل الضغط لو كان على علامة موجودة (بيتعامل معاها handleMarkerClick)
  const wrap = document.getElementById('layoutMarkerImgWrap');
  const rect = wrap.getBoundingClientRect();
  const x = ((evt.clientX - rect.left) / rect.width) * 100;
  const y = ((evt.clientY - rect.top) / rect.height) * 100;
  pendingMarkerCoords = {x: Math.max(1,Math.min(99,x)), y: Math.max(1,Math.min(99,y))};
  renderLayoutMarkersModal();
}
async function saveLayoutMarker(){
  const serverId = document.getElementById('pendingMarkerServer').value;
  if(!serverId){ toast('اختر سيرفر أولًا'); return; }
  const ctx = window.__currentMarkerLayout;
  try{
    const {data, error} = await supa.from('layout_server_markers').insert({
      layout_id: ctx.layoutId, server_id: serverId, x_pct: pendingMarkerCoords.x, y_pct: pendingMarkerCoords.y, created_by: currentProfile.id
    }).select().single();
    if(error) throw error;
    currentLayoutMarkers.push(data);
    pendingMarkerCoords = null;
    const srv = ctx.servers.find(s=>s.id===serverId);
    await logAudit('إضافة علامة سيرفر على خريطة', srv?srv.server_name:serverId);
    toast('✅ تم وضع العلامة'); renderLayoutMarkersModal();
  }catch(e){ console.error(e); toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
function handleMarkerClick(markerId){
  const m = currentLayoutMarkers.find(x=>x.id===markerId);
  if(!m) return;
  if(isAdmin()){
    openModal(`<div class="modal-head"><h3>خيارات العلامة</h3><button class="x-close" onclick="closeModal()">✕</button></div>
      <button class="btn primary block" onclick="closeModal(); openServerProfile('${m.server_id}')">📋 فتح ملف السيرفر</button>
      <button class="btn danger block" style="margin-top:8px" onclick="deleteLayoutMarker('${m.id}')">🗑 حذف العلامة من الخريطة</button>
      <button class="btn block" style="margin-top:8px" onclick="renderLayoutMarkersModal()">رجوع</button>`);
  } else {
    closeModal(); openServerProfile(m.server_id);
  }
}
async function deleteLayoutMarker(markerId){
  try{
    await supa.from('layout_server_markers').delete().eq('id', markerId);
    currentLayoutMarkers = currentLayoutMarkers.filter(x=>x.id!==markerId);
    toast('✅ تم حذف العلامة'); renderLayoutMarkersModal();
  }catch(e){ toast('🚫 تعذّر الحذف'); }
}
async function deleteLayout(id, factoryId){
  const l = layoutsData.find(x=>x.id===id);
  const fid = l ? l.factory_id : factoryId;
  try{
    await supa.from('factory_layouts').delete().eq('id', id);
    await logAudit('حذف خريطة مصنع', l?l.layout_name:id);
    toast('✅ تم الحذف'); loadLayouts(fid);
  }catch(e){ toast('🚫 تعذّر الحذف'); }
}
async function restoreOriginalLayout(id){
  const l = layoutsData.find(x=>x.id===id);
  if(!l || !l.original_file_url) return;
  try{
    const {error} = await supa.from('factory_layouts').update({file_url: l.original_file_url}).eq('id', id);
    if(error) throw error;
    await logAudit('استعادة الخريطة الأصلية', l.layout_name);
    toast('✅ تم استعادة النسخة الأصلية'); loadLayouts(l.factory_id);
  }catch(e){ console.error(e); toast('🚫 تعذّر الاستعادة: '+(e.message||'')); }
}

/* ============================================================
   محرر تعديل الخريطة: رسم حر / أسهم / أشكال / علامات / نصوص
   مع تحديد ونقل وتغيير حجم و Undo/Redo وتكبير أثناء التعديل
   يحتفظ دائمًا بالصورة الأصلية منفصلة عن النسخة المعدَّلة
   ============================================================ */
let layoutEditor = null;
function openLayoutEditor(layoutId){
  const l = layoutsData.find(x=>x.id===layoutId);
  if(!l || l.file_type!=='image'){ toast('التعديل متاح فقط على الخرائط المصوَّرة'); return; }
  layoutEditor = { layoutId, factoryId:l.factory_id, elements:[], history:[], redoStack:[], tool:'pen', color:'#FF3B30', zoom:1, selectedIndex:-1 };
  openModal(`
    <div class="modal-head"><h3>✏️ تعديل الخريطة: ${l.layout_name}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px" id="layoutToolbar">
      ${[['select','↖️ تحديد'],['pen','✏️ رسم حر'],['arrow','➡️ سهم'],['rect','▭ مربع'],['circle','⭕ دائرة'],['pin','📍 علامة'],['text','🔤 نص']].map(([t,l2])=>
        `<button class="btn sm ${layoutEditor.tool===t?'primary':''}" id="tool_${t}" onclick="setLayoutTool('${t}')">${l2}</button>`).join('')}
      <input type="color" id="layoutColor" value="#FF3B30" style="width:36px;height:32px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer" onchange="layoutEditor.color=this.value">
    </div>
    <div style="display:flex;gap:5px;margin-bottom:8px">
      <button class="btn sm" onclick="layoutEditorUndo()">↩️ تراجع</button>
      <button class="btn sm" onclick="layoutEditorRedo()">↪️ إعادة</button>
      <button class="btn sm danger" onclick="deleteSelectedLayoutElement()">🗑 حذف المحدد</button>
      <button class="btn sm" onclick="zoomLayoutEditor(0.8)">➖</button>
      <button class="btn sm" onclick="zoomLayoutEditor(1.25)">➕</button>
    </div>
    <div style="overflow:auto;max-height:55vh;border:1px solid var(--border-soft);border-radius:10px;background:#111;text-align:center">
      <canvas id="layoutEditCanvas" style="touch-action:none;transform-origin:top center;max-width:none"></canvas>
    </div>
    <p style="font-size:10px;color:var(--muted-2);margin-top:6px">💡 الصورة الأصلية محفوظة دائمًا ويمكن استعادتها لاحقًا من زر "الأصل".</p>
    <button class="btn primary block" style="margin-top:8px" onclick="saveLayoutEdit()">💾 حفظ التعديل (نسخة جديدة)</button>
  `);
  setTimeout(()=> initLayoutCanvas(l.file_url), 60);
}
function initLayoutCanvas(imgUrl){
  const canvas = document.getElementById('layoutEditCanvas');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    const maxW = 1000;
    const scale = img.width > maxW ? maxW/img.width : 1;
    canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
    layoutEditor.bgImage = img;
    redrawLayoutCanvas();
    attachLayoutCanvasEvents(canvas);
  };
  img.onerror = ()=> toast('⚠️ تعذّر تحميل صورة الخريطة للتعديل (قد تحتاج الصورة دعم CORS)');
  img.src = imgUrl;
}
function redrawLayoutCanvas(){
  const canvas = document.getElementById('layoutEditCanvas'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(layoutEditor.bgImage) ctx.drawImage(layoutEditor.bgImage,0,0,canvas.width,canvas.height);
  layoutEditor.elements.forEach((el,i)=> drawLayoutElement(ctx, el, i===layoutEditor.selectedIndex));
}
function drawLayoutElement(ctx, el, selected){
  ctx.strokeStyle = el.color; ctx.fillStyle = el.color; ctx.lineWidth = 3; ctx.lineCap='round'; ctx.lineJoin='round';
  if(el.type==='pen'){ ctx.beginPath(); el.points.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke(); }
  else if(el.type==='arrow'){
    ctx.beginPath(); ctx.moveTo(el.x1,el.y1); ctx.lineTo(el.x2,el.y2); ctx.stroke();
    const angle = Math.atan2(el.y2-el.y1, el.x2-el.x1);
    ctx.beginPath(); ctx.moveTo(el.x2,el.y2);
    ctx.lineTo(el.x2-14*Math.cos(angle-0.4), el.y2-14*Math.sin(angle-0.4));
    ctx.lineTo(el.x2-14*Math.cos(angle+0.4), el.y2-14*Math.sin(angle+0.4));
    ctx.closePath(); ctx.fill();
  }
  else if(el.type==='rect'){ ctx.strokeRect(el.x,el.y,el.w,el.h); }
  else if(el.type==='circle'){ ctx.beginPath(); ctx.ellipse(el.cx,el.cy,Math.abs(el.rx),Math.abs(el.ry),0,0,2*Math.PI); ctx.stroke(); }
  else if(el.type==='pin'){
    ctx.beginPath(); ctx.arc(el.x,el.y,9,0,2*Math.PI); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    if(el.label){ ctx.fillStyle=el.color; ctx.font='bold 14px Arial'; ctx.textAlign='right'; ctx.fillText(el.label, el.x-14, el.y+5); }
  }
  else if(el.type==='text'){ ctx.font='bold 18px Arial'; ctx.textAlign='left'; ctx.fillText(el.text, el.x, el.y); }
  if(selected){
    const box = layoutElementBBox(el);
    ctx.strokeStyle='#38D9C9'; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
    ctx.strokeRect(box.x-6, box.y-6, box.w+12, box.h+12); ctx.setLineDash([]);
  }
}
function layoutElementBBox(el){
  if(el.type==='pen'){ const xs=el.points.map(p=>p.x), ys=el.points.map(p=>p.y); return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}; }
  if(el.type==='arrow'){ return {x:Math.min(el.x1,el.x2),y:Math.min(el.y1,el.y2),w:Math.abs(el.x2-el.x1),h:Math.abs(el.y2-el.y1)}; }
  if(el.type==='rect'){ return {x:el.x,y:el.y,w:el.w,h:el.h}; }
  if(el.type==='circle'){ return {x:el.cx-el.rx,y:el.cy-el.ry,w:el.rx*2,h:el.ry*2}; }
  if(el.type==='pin'){ return {x:el.x-9,y:el.y-9,w:18,h:18}; }
  if(el.type==='text'){ return {x:el.x,y:el.y-18,w:(el.text.length*10),h:22}; }
  return {x:0,y:0,w:0,h:0};
}
function pointInBBox(x,y,box){ return x>=box.x && x<=box.x+box.w && y>=box.y && y<=box.y+box.h; }
function setLayoutTool(t){
  layoutEditor.tool = t; layoutEditor.selectedIndex = -1;
  document.querySelectorAll('#layoutToolbar button').forEach(b=>b.classList.remove('primary'));
  const btn = document.getElementById('tool_'+t); if(btn) btn.classList.add('primary');
  redrawLayoutCanvas();
}
function pushLayoutHistory(){
  layoutEditor.history.push(JSON.stringify(layoutEditor.elements));
  if(layoutEditor.history.length>50) layoutEditor.history.shift();
  layoutEditor.redoStack = [];
}
function layoutEditorUndo(){
  if(!layoutEditor.history.length) return;
  layoutEditor.redoStack.push(JSON.stringify(layoutEditor.elements));
  layoutEditor.elements = JSON.parse(layoutEditor.history.pop());
  layoutEditor.selectedIndex=-1; redrawLayoutCanvas();
}
function layoutEditorRedo(){
  if(!layoutEditor.redoStack.length) return;
  layoutEditor.history.push(JSON.stringify(layoutEditor.elements));
  layoutEditor.elements = JSON.parse(layoutEditor.redoStack.pop());
  layoutEditor.selectedIndex=-1; redrawLayoutCanvas();
}
function deleteSelectedLayoutElement(){
  if(layoutEditor.selectedIndex<0) { toast('حدّد عنصرًا أولًا (أداة تحديد)'); return; }
  pushLayoutHistory();
  layoutEditor.elements.splice(layoutEditor.selectedIndex,1);
  layoutEditor.selectedIndex=-1; redrawLayoutCanvas();
}
function zoomLayoutEditor(factor){
  layoutEditor.zoom = Math.max(0.5, Math.min(3, layoutEditor.zoom*factor));
  document.getElementById('layoutEditCanvas').style.transform = `scale(${layoutEditor.zoom})`;
}
function getCanvasPos(canvas, evt){
  const rect = canvas.getBoundingClientRect();
  const p = evt.touches ? evt.touches[0] : evt;
  return { x:(p.clientX-rect.left)*(canvas.width/rect.width), y:(p.clientY-rect.top)*(canvas.height/rect.height) };
}
function attachLayoutCanvasEvents(canvas){
  let dragging=false, start=null, dragOffset=null;
  function down(evt){
    evt.preventDefault();
    const pos = getCanvasPos(canvas, evt);
    const tool = layoutEditor.tool;
    if(tool==='select'){
      let found=-1;
      for(let i=layoutEditor.elements.length-1;i>=0;i--){ if(pointInBBox(pos.x,pos.y,layoutElementBBox(layoutEditor.elements[i]))){ found=i; break; } }
      layoutEditor.selectedIndex = found;
      if(found>=0){ dragging=true; dragOffset=pos; pushLayoutHistory(); }
      redrawLayoutCanvas();
      return;
    }
    if(tool==='pin'){
      const label = prompt('اسم العلامة (اختياري):','') || '';
      pushLayoutHistory();
      layoutEditor.elements.push({type:'pin', x:pos.x, y:pos.y, label, color:layoutEditor.color});
      redrawLayoutCanvas(); return;
    }
    if(tool==='text'){
      const text = prompt('اكتب النص:','');
      if(text){ pushLayoutHistory(); layoutEditor.elements.push({type:'text', x:pos.x, y:pos.y, text, color:layoutEditor.color}); redrawLayoutCanvas(); }
      return;
    }
    dragging=true; start=pos;
    if(tool==='pen'){ pushLayoutHistory(); layoutEditor.elements.push({type:'pen', points:[pos], color:layoutEditor.color}); }
  }
  function move(evt){
    if(!dragging) return;
    evt.preventDefault();
    const pos = getCanvasPos(canvas, evt);
    const tool = layoutEditor.tool;
    if(tool==='select' && layoutEditor.selectedIndex>=0){
      const el = layoutEditor.elements[layoutEditor.selectedIndex];
      const dx = pos.x-dragOffset.x, dy = pos.y-dragOffset.y; dragOffset=pos;
      if(el.type==='pen') el.points.forEach(p=>{p.x+=dx;p.y+=dy;});
      else if(el.type==='arrow'){ el.x1+=dx;el.y1+=dy;el.x2+=dx;el.y2+=dy; }
      else if(el.type==='rect'){ el.x+=dx;el.y+=dy; }
      else if(el.type==='circle'){ el.cx+=dx;el.cy+=dy; }
      else if(el.type==='pin'||el.type==='text'){ el.x+=dx;el.y+=dy; }
      redrawLayoutCanvas(); return;
    }
    if(tool==='pen'){ layoutEditor.elements[layoutEditor.elements.length-1].points.push(pos); redrawLayoutCanvas(); return; }
    // معاينة حية للأشكال أثناء السحب
    redrawLayoutCanvas();
    const ctx = canvas.getContext('2d');
    if(tool==='arrow') drawLayoutElement(ctx, {type:'arrow',x1:start.x,y1:start.y,x2:pos.x,y2:pos.y,color:layoutEditor.color}, false);
    else if(tool==='rect') drawLayoutElement(ctx, {type:'rect',x:Math.min(start.x,pos.x),y:Math.min(start.y,pos.y),w:Math.abs(pos.x-start.x),h:Math.abs(pos.y-start.y),color:layoutEditor.color}, false);
    else if(tool==='circle') drawLayoutElement(ctx, {type:'circle',cx:(start.x+pos.x)/2,cy:(start.y+pos.y)/2,rx:Math.abs(pos.x-start.x)/2,ry:Math.abs(pos.y-start.y)/2,color:layoutEditor.color}, false);
  }
  function up(evt){
    if(!dragging) return;
    dragging=false;
    const tool = layoutEditor.tool;
    if(['arrow','rect','circle'].includes(tool)){
      const pos = getCanvasPos(canvas, evt.changedTouches?{clientX:evt.changedTouches[0].clientX,clientY:evt.changedTouches[0].clientY}:evt);
      pushLayoutHistory();
      if(tool==='arrow') layoutEditor.elements.push({type:'arrow',x1:start.x,y1:start.y,x2:pos.x,y2:pos.y,color:layoutEditor.color});
      else if(tool==='rect') layoutEditor.elements.push({type:'rect',x:Math.min(start.x,pos.x),y:Math.min(start.y,pos.y),w:Math.abs(pos.x-start.x),h:Math.abs(pos.y-start.y),color:layoutEditor.color});
      else if(tool==='circle') layoutEditor.elements.push({type:'circle',cx:(start.x+pos.x)/2,cy:(start.y+pos.y)/2,rx:Math.abs(pos.x-start.x)/2,ry:Math.abs(pos.y-start.y)/2,color:layoutEditor.color});
      redrawLayoutCanvas();
    }
  }
  canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', up);
}
async function saveLayoutEdit(){
  const canvas = document.getElementById('layoutEditCanvas');
  if(!canvas){ toast('تعذّر الحفظ'); return; }
  toast('جاري حفظ التعديل...');
  try{
    const l = layoutsData.find(x=>x.id===layoutEditor.layoutId);
    const blob = await new Promise(res=> canvas.toBlob(res, 'image/jpeg', 0.9));
    const path = `layouts/${layoutEditor.layoutId}-edited-${Date.now()}.jpg`;
    const {error: upErr} = await supa.storage.from('camera-photos').upload(path, blob, {contentType:'image/jpeg', upsert:true});
    if(upErr) throw upErr;
    const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
    const payload = { file_url: pub.publicUrl };
    if(!l.original_file_url) payload.original_file_url = l.file_url; // نحفظ الأصل أول مرة فقط
    const {error} = await supa.from('factory_layouts').update(payload).eq('id', layoutEditor.layoutId);
    if(error) throw error;
    await logAudit('تعديل خريطة (رسم/علامات)', l.layout_name);
    toast('✅ تم حفظ النسخة المعدَّلة'); closeModal(); loadLayouts(layoutEditor.factoryId);
  }catch(e){ console.error(e); toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}

      supa.from('factory_racks').select('*').eq('factory_id',factoryId).order('rack_name'),

    ]);

    ['racksListHost','switchesListHost'].forEach(id=>{ const h=document.getElementById(id); if(h) h.innerHTML=`<div class="empty">⚠️ يحتاج تشغيل schema_part5.sql في Supabase.</div>`; });

   كل مصنع (عدا الغرفة المركزية) له برج أو أكتر، وكل برج له رابط
   لاسلكي ينتهي في مصنع/برج تاني أو في الغرفة المركزية مباشرة
   ============================================================ */
const TOWER_STATUS_COLOR = {'يعمل':'ok','يعمل ويحتاج متابعة':'warn','ضعيف':'warn','منقطع':'bad','يحتاج صيانة':'warn','خارج الخدمة':'bad'};
function renderTowersList(factoryId){
  const host = document.getElementById('towersListHost');
  if(!host) return;
  const f = factoriesData.find(x=>x.id===factoryId);
  if(f?.is_central_hub) return;
  if(!isAdmin() && !hasPerm('view_network_map')){ host.innerHTML='<div class="empty">🚫 لا تملك صلاحية عرض الأبراج.</div>'; return; }
  if(!towersData.length){ host.innerHTML='<div class="empty">لا توجد أبراج مسجّلة بعد لهذا المصنع.</div>'; return; }
  host.innerHTML = towersData.map(t=>{
    const links = wirelessLinksData.filter(l=>l.from_tower_id===t.id);
    return `<div class="site-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="site-name" style="font-size:14px">🗼 ${t.tower_name}</div><div class="site-meta">${t.location||'—'} ${t.tower_type?'· '+t.tower_type:''}</div></div>
        <span class="pill ${TOWER_STATUS_COLOR[t.status]}">${t.status}</span>
      </div>
      ${t.frequency||t.bandwidth? `<div style="font-size:10.5px;color:var(--muted);margin-top:4px">${t.frequency?'التردد: '+t.frequency:''} ${t.bandwidth?'· Bandwidth: '+t.bandwidth:''}</div>`:''}
      ${links.length ? links.map(l=>{
        const toLabel = l.to_central_hub ? '🏛️ الغرفة المركزية' : 'برج آخر';
        return `<div style="margin-top:6px;padding:6px 8px;background:var(--bg-2);border-radius:8px;font-size:10.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="showWirelessLinkDetails('${l.id}')">
          <span>🔗 ${l.link_name} → ${toLabel}</span><span class="pill ${TOWER_STATUS_COLOR[l.status]}" style="font-size:9px">${l.status}</span>
        </div>`;
      }).join('') : ''}
      <div class="btn-row" style="margin-top:8px">
        ${(isAdmin()||hasPerm('edit_network_map'))? `
        <button class="btn sm" onclick="openWirelessLinkForm('${t.id}')">+ رابط لاسلكي</button>
        <button class="btn sm" onclick="openTowerGallery('${t.id}')">📷 الصور</button>
        <button class="btn sm" onclick="openTowerForm('${factoryId}','${t.id}')">✏️ تعديل</button>
        <button class="btn sm danger" onclick="deleteTower('${t.id}','${factoryId}')">🗑 حذف</button>` : `<button class="btn sm" onclick="openTowerGallery('${t.id}')">📷 الصور</button>`}
      </div>
    </div>`;
  }).join('');
}

          <img src="${im.image_url}" style="width:100%;height:85px;object-fit:cover;border-radius:8px;cursor:zoom-in" onclick='openGalleryLightbox(${JSON.stringify(currentTowerImages.map(x=>x.image_url))},${i})'>
          ${canEdit? `<button onclick="deleteTowerImage('${im.id}','${towerId}')" style="position:absolute;top:4px;left:4px;background:rgba(255,60,60,.9);color:#fff;border:none;width:22px;height:22px;border-radius:50%;font-size:11px;cursor:pointer">🗑</button>`:''}
        </div>`).join('')}

async function uploadTowerImages(towerId, inputEl){
  const files = Array.from(inputEl.files||[]);
  if(!files.length) return;
  toast(`جاري رفع ${files.length} صورة...`);
  let ok=0;
  for(const file of files){
    try{
      const compressed = await compressImageFile(file);
      const path = `towers/${towerId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
      if(upErr) throw upErr;
      const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
      const {error} = await supa.from('tower_images').insert({tower_id:towerId, image_url:pub.publicUrl, created_by:currentProfile.id});
      if(error) throw error;
      ok++;
    }catch(e){ console.error(e); }
  }
  const {data} = await supa.from('tower_images').select('*').eq('tower_id',towerId).order('sort_order');
  currentTowerImages = data||[];
  toast(`✅ تم رفع ${ok} صورة`); openTowerGallery(towerId);
}
async function deleteTowerImage(imageId, towerId){
  try{ await supa.from('tower_images').delete().eq('id',imageId); currentTowerImages = currentTowerImages.filter(x=>x.id!==imageId); toast('✅ تم الحذف'); openTowerGallery(towerId); }
  catch(e){ toast('🚫 تعذّر الحذف'); }
}

  };

    else { payload.created_by=currentProfile.id; const {error}=await supa.from('server_drives').insert(payload); if(error) throw error; }
    await logAudit(driveId?'تعديل هارد':'إضافة هارد', `Slot ${payload.slot_number}`);

    currentServerDrives = data||[];
    renderServerProfileModal(1);
  }catch(e){ console.error(e); toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
async function deleteDrive(driveId, serverId){

async function uploadServerImages(serverId, inputEl){

  toast(`جاري رفع ${files.length} صورة...`);
  let ok=0;
  for(const file of files){
    try{

      const path = `servers/${serverId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;

/* ============================================================
   الخريطة المركزية للشبكة (Central Network Map)
   تعرض كل المصانع وارتباطها اللاسلكي بالغرفة المركزية (مصنع الدولية)
   ============================================================ */
let centralMapTheme = localStorage.getItem('rc_centralmap_theme') || 'dark';
function toggleCentralMapTheme(){
  centralMapTheme = centralMapTheme==='dark' ? 'light' : 'dark';
  localStorage.setItem('rc_centralmap_theme', centralMapTheme);
  openCentralNetworkMap();
}
async function openCentralNetworkMap(){
  if(!isAdmin() && !hasPerm('view_network_map')){ toast('🚫 لا تملك صلاحية عرض الخريطة المركزية'); return; }
  openModal(`<div class="modal-head"><h3>🌐 الخريطة المركزية للشبكة</h3><button class="x-close" onclick="closeModal()">✕</button></div><div class="empty">جاري التحميل...</div>`);
  let allTowers = [], allLinks = [];
  try{ const {data} = await supa.from('antenna_towers').select('*'); allTowers = data||[]; }catch(e){}
  try{ const {data} = await supa.from('wireless_links').select('*'); allLinks = data||[]; }catch(e){}
  window.__centralMapData = { allTowers, allLinks };
  renderCentralNetworkMap();
}
function renderCentralNetworkMap(){
  const { allTowers, allLinks } = window.__centralMapData || {allTowers:[],allLinks:[]};
  const centralFactory = factoriesData.find(f=>f.is_central_hub);
  const otherFactories = factoriesData.filter(f=>!f.is_central_hub);
  const isLight = centralMapTheme==='light';
  const pal = isLight
    ? { bg:'#FFFFFF', text:'#111111', sub:'#555555', hubF:'#FFF6E5', hubS:'#B8860B', facF:'#EEF3FF', facS:'#1D4ED8', ok:'#0F7A3D', warn:'#B8860B', bad:'#C62828', line:'#333333' }
    : { bg:'#0B1220', text:'#E9EEFB', sub:'#8CA0C4', hubF:'#2A1F0E', hubS:'#F5A623', facF:'#182446', facS:'#38D9C9', ok:'#4ADE80', warn:'#F5A623', bad:'#FF6B6B', line:'#38D9C9' };

  const statusColor = s => s==='يعمل'?pal.ok : (s==='منقطع'||s==='خارج الخدمة'?pal.bad : pal.warn);

  const N = otherFactories.length;
  const RW = 130, RH = 46, GAP = 26;
  const svgW = Math.max(400, N*(RW+GAP)+GAP);
  const svgH = 320;
  const hubX = svgW/2, hubY = 50;
  const rowY = 230;

  let svg = `<svg id="centralMapSvg" viewBox="0 0 ${svgW} ${svgH}" style="width:100%;background:${pal.bg};border-radius:12px" xmlns="http://www.w3.org/2000/svg">`;
  // خطوط من كل مصنع للغرفة المركزية
  otherFactories.forEach((f,i)=>{
    const fx = GAP + i*(RW+GAP) + RW/2;
    const facTowers = allTowers.filter(t=>t.factory_id===f.id);
    const facLinks = allLinks.filter(l=> facTowers.some(t=>t.id===l.from_tower_id));
    const worstLink = facLinks.find(l=>l.status==='منقطع') || facLinks.find(l=>l.status==='ضعيف'||l.status==='يحتاج صيانة') || facLinks[0];
    const lineColor = worstLink ? statusColor(worstLink.status) : pal.sub;
    const dash = worstLink && worstLink.status==='منقطع' ? 'stroke-dasharray="6,5"' : '';
    svg += `<path onclick="showCentralLinkDetails('${f.id}')" style="cursor:pointer" d="M${hubX},${hubY+RH/2} C${hubX},${(hubY+rowY)/2} ${fx},${(hubY+rowY)/2} ${fx},${rowY-RH/2}" stroke="${lineColor}" stroke-width="2.5" fill="none" ${dash}/>`;
    if(worstLink){
      const midX = (hubX+fx)/2, midY = (hubY+rowY)/2;
      svg += `<text x="${midX}" y="${midY-4}" text-anchor="middle" fill="${lineColor}" font-size="9" font-weight="bold" font-family="Arial">${escapeXml(worstLink.status)}</text>`;
    }
  });
  // الغرفة المركزية (Hub)
  svg += `<g onclick="${centralFactory?`openFactoryReportPickerFor('${centralFactory.id}')`:''}" style="cursor:pointer">
    <rect x="${hubX-100}" y="${hubY-RH/2}" width="200" height="${RH}" rx="10" fill="${pal.hubF}" stroke="${pal.hubS}" stroke-width="2"/>
    <text x="${hubX}" y="${hubY-3}" text-anchor="middle" fill="${pal.text}" font-size="13" font-weight="bold" font-family="Arial">🏛️ ${centralFactory?escapeXml(centralFactory.name):'الغرفة المركزية'}</text>
    <text x="${hubX}" y="${hubY+13}" text-anchor="middle" fill="${pal.hubS}" font-size="9.5" font-family="Arial">Central Monitoring Room</text>
  </g>`;
  // كل مصنع تحت
  otherFactories.forEach((f,i)=>{
    const fx = GAP + i*(RW+GAP) + RW/2;
    const facTowers = allTowers.filter(t=>t.factory_id===f.id);
    const hasTower = facTowers.length>0;
    svg += `<g onclick="showCentralFactoryDetails('${f.id}')" style="cursor:pointer">
      <rect x="${fx-RW/2}" y="${rowY-RH/2}" width="${RW}" height="${RH}" rx="8" fill="${pal.facF}" stroke="${pal.facS}" stroke-width="1.5"/>
      <text x="${fx}" y="${rowY-4}" text-anchor="middle" fill="${pal.text}" font-size="10.5" font-weight="bold" font-family="Arial">${escapeXml(f.name)}</text>
      <text x="${fx}" y="${rowY+12}" text-anchor="middle" fill="${pal.sub}" font-size="8.5" font-family="Arial">${hasTower?'🗼 '+facTowers.length+' برج':'⚠️ بدون برج'}</text>
    </g>`;
  });
  svg += `</svg>`;

  document.getElementById('modalHost').innerHTML = `
    <div class="modal-head"><h3>🌐 الخريطة المركزية للشبكة</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="mini-grid" style="margin-bottom:10px">
      <div class="mini"><div class="n">${factoriesData.length}</div><div class="t">إجمالي المصانع</div></div>
      <div class="mini"><div class="n">${allTowers.length}</div><div class="t">إجمالي الأبراج</div></div>
      <div class="mini"><div class="n" style="color:var(--success)">${allLinks.filter(l=>l.status==='يعمل').length}/${allLinks.length}</div><div class="t">روابط تعمل</div></div>
    </div>
    ${!centralFactory ? `<div class="offline-banner" style="display:block;margin-bottom:10px">⚠️ لم يتم تحديد أي مصنع كـ"الغرفة المركزية" بعد. حدّد ذلك من تعديل بيانات المصنع.</div>`:''}
    <div style="overflow-x:auto">${svg}</div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn" onclick="toggleCentralMapTheme()">🎨 تغيير لون الخريطة (${isLight?'أبيض':'أسود'})</button>
      <button class="btn primary" onclick="downloadCentralMap()">⬇️ تنزيل كصورة</button>
    </div>
    <p style="font-size:10px;color:var(--muted-2);margin-top:10px">💡 دوس على أي مصنع لعرض بيانات اتصاله بالغرفة المركزية، أو على الخط نفسه لعرض تفاصيل الرابط.</p>
  `;
}

/* ============================================================
   تحويل عنصر SVG لصورة PNG بجودة عالية حقيقية (وليس تمطيطًا)
   عن طريق ضبط أبعاد الرسم الفعلية قبل الرسترة، لا بعدها
   ============================================================ */
function svgToHighResPngBlob(svgEl, bgColor, scale){
  return new Promise((resolve, reject)=>{
    scale = scale || 3;
    const vb = svgEl.getAttribute('viewBox').split(' ').map(Number);
    const baseW = vb[2], baseH = vb[3];
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('width', baseW*scale);
    clone.setAttribute('height', baseH*scale);
    // تضمين خط عربي واضح صراحة داخل الـSVG نفسه لضمان ظهوره بجودة كاملة عند الرسترة
    const styleTag = document.createElementNS('http://www.w3.org/2000/svg','style');
    styleTag.textContent = `text{font-family:'Tajawal','Segoe UI',Arial,sans-serif;}`;
    clone.insertBefore(styleTag, clone.firstChild);
    const svgStr = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = baseW*scale; canvas.height = baseH*scale;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = bgColor; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=> blob?resolve(blob):reject(new Error('فشل التحويل')), 'image/png', 1.0);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('فشل تحميل SVG')); };
    img.src = url;
  });
}
function downloadCentralMap(){
  const svgEl = document.getElementById('centralMapSvg');
  if(!svgEl){ toast('تعذّر إيجاد الخريطة'); return; }
  toast('جاري تجهيز صورة عالية الدقة...');
  svgToHighResPngBlob(svgEl, centralMapTheme==='light'?'#ffffff':'#0B1220', 3)
    .then(blob=> saveOrShareFile(blob, `الخريطة-المركزية-${new Date().toISOString().slice(0,10)}.png`))
    .catch(()=> toast('🚫 تعذّر تحويل الخريطة لصورة'));
}

/* ============================================================
   خريطة الشبكة (Network Map) — رسم تلقائي من البيانات المسجّلة
   ============================================================ */
let netMapTheme = localStorage.getItem('rc_netmap_theme') || 'dark';
function toggleNetworkMapTheme(factoryId){
  netMapTheme = netMapTheme==='dark' ? 'light' : 'dark';
  localStorage.setItem('rc_netmap_theme', netMapTheme);
  openNetworkMap(factoryId);
}
function openNetworkMap(factoryId){
  const f = factoriesData.find(x=>x.id===factoryId);
  const fSwitches = switchesData.filter(sw=>sw.factory_id===factoryId);
  const totalMappedCams = fSwitches.reduce((a,sw)=>a+getSwitchCameraCount(sw),0);
  const rootSwitches = fSwitches.filter(sw=>!sw.uplink_switch_id && !sw.uplink_server_id);
  const childSwitchesOf = (swId) => fSwitches.filter(sw=>sw.uplink_switch_id===swId);
  const serversWithUplinkChildren = serversData.filter(sv=>sv.factory_id===factoryId && fSwitches.some(sw=>sw.uplink_server_id===sv.id));
  const fTowers = (towersData||[]).filter(t=>t.factory_id===factoryId);
  const fTowerLinks = fTowers.length ? (wirelessLinksData||[]).filter(l=> fTowers.some(t=>t.id===l.from_tower_id)) : [];
  const hasTowers = fTowers.length>0;
  const TOWER_ROW_H = hasTowers ? 100 : 0;
  const isLight = netMapTheme==='light';
  const pal = isLight
    ? { bg:'#FFFFFF', line:'#333333', coreF:'#EFEFEF', coreS:'#111111', coreT:'#111111', rootF:'#FFF6E5', rootS:'#B8860B', accF:'#EEF3FF', accS:'#1D4ED8', text:'#111111', sub:'#555555', devF:'#F5F5F5', devSrv:'#1D4ED8', devCam:'#0F7A3D', devText:'#111111', srvF:'#E9FBF3', srvS:'#0F7A3D', towerF:'#FFF0E9', towerS:'#C2410C', ok:'#0F7A3D', warn:'#B8860B', bad:'#C62828' }
    : { bg:'#0B1220', line:'#38D9C9', coreF:'#182446', coreS:'#38D9C9', coreT:'#38D9C9', rootF:'#2A1F0E', rootS:'#F5A623', accF:'#182446', accS:'#38D9C9', text:'#E9EEFB', sub:'#38D9C9', devF:'#0F1A30', devSrv:'#38D9C9', devCam:'#4ADE80', devText:'#CFF7F1', srvF:'#0F2A20', srvS:'#4ADE80', towerF:'#2A180F', towerS:'#FF9F5A', ok:'#4ADE80', warn:'#F5A623', bad:'#FF6B6B' };
  const statusColor = s => s==='يعمل'?pal.ok : (s==='منقطع'||s==='خارج الخدمة'?pal.bad : pal.warn);

  if(!fSwitches.length){
    openModal(`<div class="modal-head"><h3>🗺️ خريطة الشبكة — ${f?f.name:''}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
      <div class="empty">أضف سويتشات أولًا لتظهر خريطة الشبكة.</div>`);
    return;
  }

  // ---------- بناء شجرة العُقد: سيرفرات (لو مُختارة كأصل) → سويتشات → أجهزة فرعية ----------
  const UNIT = 128, NODE_W = 112, NODE_H = 44, LEVEL_H = 100;
  function buildSwitchNode(sw){
    const directSrv = serversData.filter(s=>s.switch_id===sw.id && !serversWithUplinkChildren.some(x=>x.id===s.id)).length;
    const directCam = getSwitchCameraCount(sw);
    const childSwitches = childSwitchesOf(sw.id).map(buildSwitchNode);
    const deviceLeaves = [];
    if(directSrv>0) deviceLeaves.push({type:'device', kind:'srv', icon:'🖥️', label:`${directSrv} Server${directSrv>1?'s':''}`, width:1});
    if(directCam>0) deviceLeaves.push({type:'device', kind:'cam', icon:'🎥', label:`${directCam} كاميرا`, width:1});
    const children = [...childSwitches, ...deviceLeaves];
    const width = children.length ? children.reduce((a,c)=>a+c.width,0) : 1;
    return { type:'switch', sw, children, width: Math.max(1,width), isRoot: !sw.uplink_switch_id && !sw.uplink_server_id };
  }
  function buildServerNode(sv){
    const childSwitches = fSwitches.filter(sw=>sw.uplink_server_id===sv.id).map(buildSwitchNode);
    const width = childSwitches.length ? childSwitches.reduce((a,c)=>a+c.width,0) : 1;
    return { type:'server', sv, children: childSwitches, width: Math.max(1,width) };
  }
  const rootNodes = [...serversWithUplinkChildren.map(buildServerNode), ...rootSwitches.map(buildSwitchNode)];
  const totalWidth = Math.max(1, rootNodes.reduce((a,n)=>a+n.width,0));

  // ---------- حساب الإحداثيات (x,y) لكل عقدة (تبدأ بعد صف البرج لو موجود) ----------
  const positioned = [];
  const edges = [];
  const baseY = 70 + TOWER_ROW_H;
  function place(node, xStart, depth, parentPos){
    const cx = (xStart + node.width/2) * UNIT;
    const cy = baseY + depth*LEVEL_H;
    const pos = {...node, x:cx, y:cy};
    positioned.push(pos);
    if(parentPos) edges.push({x1:parentPos.x, y1:parentPos.y+NODE_H/2, x2:cx, y2:cy-NODE_H/2});
    let cursor = xStart;
    (node.children||[]).forEach(child=>{
      place(child, cursor, depth+1, pos);
      cursor += child.width;
    });
    return pos;
  }
  let xCursor = 0;
  rootNodes.forEach(n=>{ place(n, xCursor, 1, null); xCursor += n.width; });

  const svgW = Math.max(360, totalWidth*UNIT + 20);
  const maxDepth = positioned.reduce((m,p)=>Math.max(m, (p.y-baseY)/LEVEL_H), 0);
  const svgH = baseY + maxDepth*LEVEL_H + 60;
  const coreX = svgW/2;

  let svg = `<svg id="netmapSvg" viewBox="0 0 ${svgW} ${svgH}" style="width:100%;background:${pal.bg};border-radius:12px" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect x="${coreX-90}" y="16" width="180" height="34" rx="8" fill="${pal.coreF}" stroke="${pal.coreS}" stroke-width="1.5"/>
    <text x="${coreX}" y="37" text-anchor="middle" fill="${pal.coreT}" font-size="13" font-weight="bold" font-family="Arial">🌐 Internet / Core</text>`;

  // صف البرج/الأبراج (لو موجودة) — بين Core والسويتشات، يعكس الاتصال بالغرفة المركزية
  if(hasTowers){
    const towerY = 50 + TOWER_ROW_H/2 + 10;
    const towerW = Math.min(svgW-20, fTowers.length*(NODE_W+20));
    const towerStartX = coreX - towerW/2;
    fTowers.forEach((t,i)=>{
      const tx = towerStartX + (i+0.5)*(towerW/fTowers.length);
      svg += `<path d="M${coreX},50 C${coreX},${(50+towerY)/2} ${tx},${(50+towerY)/2} ${tx},${towerY-NODE_H/2}" stroke="${pal.line}" stroke-width="2" fill="none" opacity="0.6"/>`;
      const link = fTowerLinks.find(l=>l.from_tower_id===t.id);
      const lStatus = link ? link.status : t.status;
      svg += `<g onclick="openTowerForm('${factoryId}','${t.id}')" style="cursor:pointer">
        <rect x="${tx-NODE_W/2}" y="${towerY-NODE_H/2}" width="${NODE_W}" height="${NODE_H}" rx="8" fill="${pal.towerF}" stroke="${pal.towerS}" stroke-width="1.5"/>
        <text x="${tx}" y="${towerY-4}" text-anchor="middle" fill="${pal.text}" font-size="10" font-weight="bold" font-family="Arial">🗼 ${escapeXml(t.tower_name)}</text>
        <text x="${tx}" y="${towerY+11}" text-anchor="middle" fill="${statusColor(lStatus)}" font-size="8" font-family="Arial">${escapeXml(lStatus)}${link&&link.to_central_hub?' → مركزي':''}</text>
      </g>`;
    });
    // خط من صف البرج (نقطة وسط) لكل عقدة رئيسية تحت
    positioned.filter(p=>(p.type==='switch' && p.isRoot) || p.type==='server').forEach(p=>{
      edges.unshift({x1:coreX, y1:towerY+NODE_H/2, x2:p.x, y2:p.y-NODE_H/2});
    });
  } else {
    positioned.filter(p=>(p.type==='switch' && p.isRoot) || p.type==='server').forEach(p=>{
      edges.unshift({x1:coreX, y1:50, x2:p.x, y2:p.y-NODE_H/2});
    });
  }

  edges.forEach(e=>{
    const midY = (e.y1+e.y2)/2;
    svg += `<path d="M${e.x1},${e.y1} C${e.x1},${midY} ${e.x2},${midY} ${e.x2},${e.y2}" stroke="${pal.line}" stroke-width="2" fill="none" opacity="0.6"/>`;
  });
  positioned.forEach(p=>{
    if(p.type==='server'){
      svg += `<g onclick="openServerProfile('${p.sv.id}')" style="cursor:pointer">
        <rect x="${p.x-NODE_W/2}" y="${p.y-NODE_H/2}" width="${NODE_W}" height="${NODE_H}" rx="8" fill="${pal.srvF}" stroke="${pal.srvS}" stroke-width="1.5"/>
        <text x="${p.x}" y="${p.y-4}" text-anchor="middle" fill="${pal.text}" font-size="10.5" font-weight="bold" font-family="Arial">🖥️ ${escapeXml(p.sv.server_name)}</text>
        <text x="${p.x}" y="${p.y+11}" text-anchor="middle" fill="${pal.srvS}" font-size="8.5" font-family="Arial">سيرفر رئيسي</text>
      </g>`;
    } else if(p.type==='switch'){
      const fill = p.isRoot ? pal.rootF : pal.accF;
      const stroke = p.isRoot ? pal.rootS : pal.accS;
      svg += `<g onclick="showSwitchDetailsPopup('${p.sw.id}')" style="cursor:pointer">
        <rect x="${p.x-NODE_W/2}" y="${p.y-NODE_H/2}" width="${NODE_W}" height="${NODE_H}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
        <text x="${p.x}" y="${p.y-4}" text-anchor="middle" fill="${pal.text}" font-size="10.5" font-weight="bold" font-family="Arial">🔌 ${escapeXml(p.sw.switch_name)}</text>
        <text x="${p.x}" y="${p.y+11}" text-anchor="middle" fill="${stroke}" font-size="8.5" font-family="Arial">${p.isRoot?'رئيسي':'فرعي'}</text>
      </g>`;
    } else {
      const strokeColor = p.kind==='srv' ? pal.devSrv : pal.devCam;
      svg += `<rect x="${p.x-NODE_W/2}" y="${p.y-NODE_H/2}" width="${NODE_W}" height="${NODE_H}" rx="8" fill="${pal.devF}" stroke="${strokeColor}" stroke-width="1.5"/>
        <text x="${p.x}" y="${p.y-2}" text-anchor="middle" font-size="15">${p.icon}</text>
        <text x="${p.x}" y="${p.y+14}" text-anchor="middle" fill="${pal.devText}" font-size="9" font-family="Arial">${escapeXml(p.label)}</text>`;
    }
  });
  svg += `</svg>`;

  openModal(`
    <div class="modal-head"><h3>🗺️ خريطة الشبكة — ${f?f.name:''}</h3><button class="x-close" onclick="closeModal()">✕</button></div>

    </div>

    <div class="btn-row" style="margin-top:10px">

      <button class="btn primary" onclick="downloadNetworkMap('${(f?f.name:'network').replace(/'/g,'')}')">⬇️ تنزيل الخريطة كصورة</button>
    </div>
    <p style="font-size:10px;color:var(--muted-2);margin-top:10px">💡 دوس على أي سويتش في الخريطة لعرض تفاصيله الكاملة. السويتشات "الفرعية" تتفرّع من السويتش الرئيسي المحدَّد لها.</p>

async function captureNetworkMapForReport(factoryId){
  const svgEl = document.getElementById('netmapSvg');
  if(!svgEl) return;
  try{
    const bg = netMapTheme==='light' ? '#ffffff' : '#0B1220';
    const blob = await svgToHighResPngBlob(svgEl, bg, 2.5);
    const dataUri = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    if(!window.__lastNetworkMapPng) window.__lastNetworkMapPng = {};
    window.__lastNetworkMapPng[factoryId] = dataUri;
  }catch(e){ console.warn('تعذّر حفظ صورة الخريطة للتقرير', e); }
}
function escapeXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function downloadNetworkMap(factoryName){
  const svgEl = document.getElementById('netmapSvg');
  if(!svgEl){ toast('تعذّر إيجاد الخريطة'); return; }
  toast('جاري تجهيز صورة عالية الدقة...');
  const bg = netMapTheme==='light' ? '#ffffff' : '#0B1220';
  svgToHighResPngBlob(svgEl, bg, 3)
    .then(blob=> saveOrShareFile(blob, `خريطة-الشبكة-${factoryName}-${new Date().toISOString().slice(0,10)}.png`))
    .catch(()=> toast('🚫 تعذّر تحويل الخريطة لصورة'));
}

async function saveRackForm(factoryId, rackId){
  const name = document.getElementById('rk_name').value.trim();
  if(!name){ toast('أدخل اسم الراك'); return; }
  const payload = { factory_id:factoryId, rack_name:name, location:document.getElementById('rk_location').value.trim(), notes:document.getElementById('rk_notes').value.trim() };
  try{
    if(rackId){ const {error}=await supa.from('factory_racks').update(payload).eq('id',rackId); if(error) throw error; await logAudit('تعديل راك', name); }
    else { payload.created_by=currentProfile.id; const {error}=await supa.from('factory_racks').insert(payload); if(error) throw error; await logAudit('إضافة راك', name); }
    closeModal(); toast('✅ تم الحفظ'); loadNetworkData(factoryId);
  }catch(e){ toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
async function uploadRackPhoto(rackId, factoryId, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  toast('جاري رفع الصورة...');
  try{
    const compressed = await compressImageFile(file);
    const path = `racks/${rackId}-${Date.now()}.jpg`;
    const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
    if(upErr) throw upErr;
    const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
    const {error} = await supa.from('factory_racks').update({photo_url: pub.publicUrl}).eq('id', rackId);
    if(error) throw error;
    toast('✅ تم رفع الصورة'); loadNetworkData(factoryId);
  }catch(e){ console.error(e); toast('🚫 تعذّر الرفع: '+(e.message||'')); }
}

  if(!name){ toast('أدخل اسم السويتش'); return; }
  const totalPorts = Math.max(0, parseInt(document.getElementById('sw_total').value)||0);
  const usedPorts = Math.min(totalPorts, Math.max(0, parseInt(document.getElementById('sw_used').value)||0));
  const camerasList = Array.from(document.querySelectorAll('.sw_cam_chk:checked')).map(el=>el.value);
  const manualCountRaw = document.getElementById('sw_cam_count').value;
  const uplinkRaw = document.getElementById('sw_uplink').value; // بصيغة "switch:id" أو "server:id" أو فاضي
  const payload = {
    factory_id: factoryId, rack_id: document.getElementById('sw_rack').value || null,
    uplink_switch_id: uplinkRaw.startsWith('switch:') ? uplinkRaw.slice(7) : null,
    uplink_server_id: uplinkRaw.startsWith('server:') ? uplinkRaw.slice(7) : null,
    switch_name: name, location: document.getElementById('sw_location').value.trim(),

    model: document.getElementById('sw_model').value.trim(), total_ports: totalPorts, used_ports: usedPorts,
    connected_cameras: camerasList, camera_count_manual: manualCountRaw===''?null:Math.max(0,parseInt(manualCountRaw)||0),
    notes: document.getElementById('sw_notes').value.trim()
  };

    if(switchId){ const {error}=await supa.from('factory_switches').update(payload).eq('id',switchId); if(error) throw error; await logAudit('تعديل سويتش', name); }

function renderTimelinePlaceholder(){
  return `<div class="view active">

    <p style="font-size:11px;color:var(--muted-2);margin-top:-6px">آخر الأحداث المهمة مرتبة زمنيًا من كل أقسام التطبيق</p>
    <div id="timelineHost"><div class="empty">جاري التحميل...</div></div>
  </div>`;
}
async function loadTimeline(){
  const host = document.getElementById('timelineHost');
  const events = [];
  try{
    const {data} = await supa.from('audit_log').select('*').order('ts',{ascending:false}).limit(60);
    (data||[]).forEach(r=> events.push({ts:r.ts, icon:'📝', text:`${r.actor_name}: ${r.action}${r.details?' — '+r.details:''}`}));
  }catch(e){}
  (faultsData||[]).forEach(f=>{
    events.push({ts:f.reported_at, icon:'🔴', text:`تسجيل عطل: ${f.device_name} (${f.severity})`});
    if(f.response_started_at) events.push({ts:f.response_started_at, icon:'🟡', text:`بدء متابعة عطل: ${f.device_name}`});
    if(f.resolved_at) events.push({ts:f.resolved_at, icon:'🟢', text:`إغلاق عطل: ${f.device_name}`});
  });
  (preventiveTasks||[]).forEach(t=> events.push({ts:t.created_at||t.scheduled_date, icon:'🛠️', text:`جدولة صيانة: ${t.target_name} — ${t.maintenance_type}`}));
  (archiveData||[]).forEach(a=> events.push({ts:a.approved_at||a.report_date, icon:'📄', text:`إنشاء تقرير — ${fmtDateAr(a.report_date)}`}));
  events.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  if(!host) return;
  if(!events.length){ host.innerHTML = '<div class="empty">لا توجد أحداث مسجّلة بعد.</div>'; return; }
  host.innerHTML = `<div style="border-right:2px solid var(--border);margin-right:8px;padding-right:16px">
    ${events.slice(0,80).map(e=>`
      <div style="position:relative;margin-bottom:14px">
        <div style="position:absolute;right:-24px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px">${e.icon}</div>
        <div style="font-size:10px;color:var(--muted-2)">${new Date(e.ts).toLocaleString('ar-EG')}</div>
        <div style="font-size:12.5px;margin-top:2px">${e.text}</div>
      </div>`).join('')}
  </div>`;
}

      const uplink = switches.find(x=>x.id===sw.uplink_switch_id);
      return [sw.switch_name, sw.switch_type||'', sw.total_ports||0, sw.used_ports||0, getSwitchCameraCount(sw), uplink?uplink.switch_name:'رئيسي', imgTagLocal(sw.photo_url)];
    })) : '<p>لا توجد سويتشات مسجّلة.</p>'}

    <h3>Servers</h3>
    ${servers.length? table(['الاسم','الحالة','الموديل','IP','OS','Switch المتصل'], servers.map(s=>{
      const sw = switches.find(x=>x.id===s.switch_id);
      return [s.server_name, s.status, `${s.brand||''} ${s.model||''}`, s.ip_address||'—', s.os_name||'—', sw?sw.switch_name:'—'];
    })) : '<p>لا توجد سيرفرات مسجّلة.</p>'}

    <h3>Storage / Hard Drives</h3>
    ${drives.length? table(['السيرفر','Slot','النوع','السعة','الحالة'], drives.map(dr=>{
      const srv = servers.find(s=>s.id===dr.server_id);
      return [srv?srv.server_name:'', dr.slot_number||'', dr.drive_type||'', fmtStorage(dr.capacity_gb), dr.status];
    })) : '<p>لا توجد بيانات تخزين مسجّلة.</p>'}

    <h3>UPS</h3>
    ${ups.length? table(['الاسم','المكان','الحالة','صورة'], ups.map(u=>[u.ups_name,u.location||'',u.status,imgTagLocal(u.photo_url)])) : '<p>لا توجد أجهزة UPS مسجّلة.</p>'}

    ${layouts.filter(l=>l.file_type==='image').length? `<h3>الخرائط (Layouts)</h3>
      <div>${layouts.filter(l=>l.file_type==='image').map(l=>`<div style="display:inline-block;text-align:center;margin:6px">${imgTagLocal(l.file_url,140)}<div style="font-size:10px">${l.layout_name}</div></div>`).join('')}</div>` : ''}

    ${netFaults.length? `<h3>أعطال السيرفرات</h3>${table(['الجهاز','الخطورة','الحالة','التاريخ'], netFaults.map(x=>[x.device_name,x.severity,x.status,new Date(x.reported_at).toLocaleDateString('ar-EG')]))}` : ''}
    ${netMaint.length? `<h3>صيانة السيرفرات</h3>${table(['السيرفر','النوع','التاريخ'], netMaint.map(m=>[m.target_name,m.maintenance_type,fmtDateAr(m.scheduled_date)]))}` : ''}

    <p style="text-align:center;color:#888;margin-top:30px;font-size:11px;border-top:1px dashed #ccc;padding-top:10px">— تقرير تلقائي من نظام غرفة المراقبة المركزية —</p>`;
  document.body.appendChild(el);
  const blob = await html2pdf().set({margin:8, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'}, pagebreak:{mode:['css','legacy']}}).from(el).outputPdf('blob');
  el.remove(); closeModal();
  await saveOrShareFile(blob, `تقرير-البنية-التحتية-${f?f.name:''}-${new Date().toISOString().slice(0,10)}.pdf`);
  await logAudit('إنشاء تقرير البنية التحتية للشبكة', f?f.name:factoryId);
}

/* ============================================================
   رسم بياني تلقائي من بيانات المصنع الفعلية (Canvas)
   يُستخدم داخل PDF/Word (كصورة)، PowerPoint، Excel، والتقرير المصوّر
   ============================================================ */
function buildFactoryChartCanvas(d){
  const { s, faults, switches } = d;
  const W=760, H=420;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0B1220'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#38D9C9'; ctx.font='bold 18px Arial'; ctx.fillText('الرسم البياني — بيانات المصنع الفعلية', W/2, 28);

  // 1) أعمدة: تشغيل الكاميرات/الشاشات
  const barX=40, barY=60, barW=320, barH=140;
  const bars = [['الكاميرات', s.camUptime, '#38D9C9'], ['الشاشات', s.scrUptime, '#4ADE80']];
  bars.forEach((b,i)=>{
    const x = barX + i*150;
    const h = Math.max(2, (b[1]/100)*barH);
    ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(x, barY, 90, barH);
    ctx.fillStyle=b[2]; ctx.fillRect(x, barY+barH-h, 90, h);
    ctx.fillStyle='#E9EEFB'; ctx.font='12px Arial'; ctx.fillText(b[0], x+45, barY+barH+18);
    ctx.font='bold 14px Arial'; ctx.fillText(fmtPct2(b[1]), x+45, barY+barH-h-6>20?barY+barH-h-6:20);
  });

  // 2) دائرة: الأعطال حسب الخطورة
  const sevCounts = {'عالية':0,'متوسطة':0,'منخفضة':0};
  faults.forEach(f=> sevCounts[f.severity] = (sevCounts[f.severity]||0)+1);
  const totalF = faults.length;
  const cx=560, cy=130, r=70;
  ctx.fillStyle='#E9EEFB'; ctx.font='bold 13px Arial'; ctx.fillText('توزيع الأعطال حسب الخطورة', cx, 40);
  if(totalF>0){
    let start=-Math.PI/2;
    const colors={'عالية':'#FF6B6B','متوسطة':'#F5A623','منخفضة':'#4ADE80'};
    Object.entries(sevCounts).forEach(([k,v])=>{
      if(!v) return;
      const angle = (v/totalF)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+angle); ctx.closePath();
      ctx.fillStyle = colors[k]; ctx.fill();
      start += angle;
    });
  } else {
    ctx.strokeStyle='#333'; ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.stroke();
    ctx.fillStyle='#666'; ctx.font='12px Arial'; ctx.fillText('لا توجد أعطال', cx, cy+5);
  }
  let ly=cy+r+24;
  Object.entries(sevCounts).forEach(([k,v])=>{
    ctx.fillStyle = k==='عالية'?'#FF6B6B':(k==='متوسطة'?'#F5A623':'#4ADE80');
    ctx.fillRect(cx-60, ly-9, 10,10);
    ctx.fillStyle='#E9EEFB'; ctx.font='11px Arial'; ctx.textAlign='left'; ctx.fillText(`${k}: ${v}`, cx-44, ly);
    ly+=16;
  });
  ctx.textAlign='center';

  // 3) أعمدة: منافذ السويتشات المستخدمة/الفارغة
  const totalPorts = switches.reduce((a,sw)=>a+(sw.total_ports||0),0);
  const usedPorts = switches.reduce((a,sw)=>a+(sw.used_ports||0),0);
  const freePorts = Math.max(0,totalPorts-usedPorts);
  const py = 250, pw = 640, ph=26;
  ctx.fillStyle='#E9EEFB'; ctx.font='bold 13px Arial'; ctx.textAlign='right'; ctx.fillText('استخدام منافذ الشبكة (Ports)', 700, py-10);
  ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(40, py, pw, ph);
  if(totalPorts>0){
    const usedW = (usedPorts/totalPorts)*pw;
    ctx.fillStyle='#F5A623'; ctx.fillRect(40, py, usedW, ph);
  }
  ctx.fillStyle='#E9EEFB'; ctx.font='12px Arial'; ctx.textAlign='center';
  ctx.fillText(`إجمالي: ${totalPorts}  ·  مستخدمة: ${usedPorts}  ·  فارغة: ${freePorts}`, 40+pw/2, py+ph+18);

  ctx.fillStyle='#5E6E92'; ctx.font='10px Arial'; ctx.fillText('رسم تلقائي من البيانات الفعلية المسجّلة — بدون أرقام افتراضية', W/2, H-12);
  return cv;
}

/* ============================================================
   التقرير الشامل الحقيقي لمصنع محدد — يجمع كل بياناته تلقائيًا
   من كل جداول التطبيق، كمستند واحد متصل (بدون فصل كل قسم بصفحة)
   ============================================================ */
async function gatherFullFactoryData(factoryId){
  const f = factoriesData.find(x=>x.id===factoryId);
  const s = computeFactory(f);
  const safe = async (table, extra) => { try{ let q = supa.from(table).select('*').eq('factory_id', factoryId); if(extra) q = extra(q); const {data,error} = await q; if(error) throw error; return data||[]; }catch(e){ return []; } };
  const [cameras, screens, faults, lighting, cameraMods, racks, switches, servers, ups, layouts, maintenanceLog] = await Promise.all([
    safe('cameras', q=>q.order('camera_name')), safe('screens', q=>q.order('screen_name')),
    safe('faults', q=>q.order('reported_at',{ascending:false})), safe('lighting_needs'), safe('camera_modifications'),
    safe('factory_racks'), safe('factory_switches'), safe('factory_servers'), safe('factory_ups'), safe('factory_layouts'),
    safe('maintenance_log')
  ]);
  let drives = [];
  if(servers.length){ try{ const {data} = await supa.from('server_drives').select('*').in('server_id', servers.map(x=>x.id)); drives = data||[]; }catch(e){} }
  // الصيانة الوقائية غير مرتبطة بـfactory_id مباشرة (target_name نصي) — نطابقها باسم المصنع أو أسماء أجهزته
  const deviceNames = new Set([f?.name, ...cameras.map(c=>c.camera_name), ...servers.map(sv=>sv.server_name)]);
  const maintenance = (preventiveTasks||[]).filter(t=> deviceNames.has(t.target_name));
  return { f, s, cameras, screens, faults, lighting, cameraMods, racks, switches, servers, ups, layouts, maintenance, maintenanceLog, drives };
}

function fmtNoData(list, msg){ return list.length ? null : `<p style="color:#999;font-style:italic;font-size:11px">${msg||'لا توجد بيانات مسجلة.'}</p>`; }

async function buildFullFactoryReportHtml(d){
  const { f, s, cameras, screens, faults, lighting, cameraMods, racks, switches, servers, ups, layouts, maintenance, drives } = d;
  const table = (headers, rows) => `<table style="width:100%;border-collapse:collapse;font-size:10px;margin-top:6px" border="1" cellpadding="4">

    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
  const h2 = t => `<h2 style="color:#12716A;border-bottom:2px solid #12716A;padding-bottom:4px;margin:18px 0 8px;font-size:15px">${t}</h2>`;

  // تحميل كل الصور المطلوبة كـ Base64 لتضمينها فعليًا
  const camImgs = cameras.map(c=>c.photo_url);
  const faultImgsForFactory = []; // يُملأ أدناه بعد الجلب
  let faultImages = [];
  try{ const ids = faults.map(x=>x.id); if(ids.length){ const {data} = await supa.from('fault_images').select('*').in('fault_id', ids); faultImages = data||[]; } }catch(e){}
  const allImgUrls = [
    ...camImgs, ...faultImages.map(im=>im.image_url), ...lighting.map(l=>l.photo_url),
    ...cameraMods.flatMap(c=>[c.photo_before_url,c.photo_after_url]),
    ...racks.map(r=>r.photo_url), ...switches.map(sw=>sw.photo_url), ...ups.map(u=>u.photo_url),
    ...servers.map(sv=>sv.id), // placeholder, server images fetched separately below
    ...layouts.filter(l=>l.file_type==='image').map(l=>l.file_url)
  ].filter(u=>typeof u==='string');
  let serverImages = [];
  try{ const ids=servers.map(x=>x.id); if(ids.length){ const {data} = await supa.from('server_images').select('*').in('server_id',ids); serverImages = data||[]; } }catch(e){}
  await urlsToDataUris([...allImgUrls, ...serverImages.map(im=>im.image_url)]);
  const img = (url,w) => { const du = __imgDataCache[url]; return du ? `<img src="${du}" style="width:${w||70}px;height:${w||70}px;object-fit:cover;border:1px solid #ccc;border-radius:4px;margin:2px">` : ''; };

  let html = `<div style="direction:rtl;font-family:Arial;color:#0B1220;padding:6px">
    <div style="text-align:center;padding:26px 0;border-bottom:4px solid #12716A;margin-bottom:16px">
      <h1 style="margin-bottom:6px">التقرير الشامل — ${f?f.name:''}</h1>
      <p style="color:#666">غرفة المراقبة المركزية — شركة جهينة للصناعات الغذائية</p>
      <p style="color:#888;font-size:11px">تاريخ التقرير: ${new Date().toLocaleString('ar-EG')}</p>
    </div>`;

  // 1) بيانات المصنع
  html += h2('1. بيانات المصنع') + `<p style="font-size:12px;line-height:1.9">
    <b>الاسم:</b> ${f?f.name:'—'} &nbsp; | &nbsp; <b>تاريخ التقرير:</b> ${new Date().toLocaleDateString('ar-EG')}
    ${f?.updated_at? ` &nbsp; | &nbsp; <b>آخر تحديث:</b> ${new Date(f.updated_at).toLocaleDateString('ar-EG')}`:''}
  </p>`;

  // 2) الملخص
  html += h2('2. ملخص حالة المصنع') + table(['البند','القيمة'], [
    ['إجمالي الكاميرات', s.camerasTotal], ['الكاميرات العاملة', s.camerasUp], ['الكاميرات المنقطعة', s.camerasDown],
    ['نسبة تشغيل الكاميرات', fmtPct2(s.camUptime)], ['إجمالي الشاشات', s.screens], ['الشاشات المنقطعة', s.screensDown],
    ['نسبة تشغيل الشاشات', fmtPct2(s.scrUptime)]
  ]);

  // 3) الكاميرات
  html += h2('3. الكاميرات') + (fmtNoData(cameras) ||
    table(['الرقم','الاسم','الحالة','Switch','Port','ملاحظات','صورة'], cameras.map(c=>{
      const sw = switches.find(x=>x.id===c.switch_id);
      return [c.camera_number||'—', c.camera_name, c.status, sw?sw.switch_name:'—', c.port_number||'—', c.notes||'', img(c.photo_url,55)];
    })));

  // 4) الشاشات
  html += h2('4. الشاشات') + (fmtNoData(screens) ||
    table(['الرقم','الاسم','الحالة','ملاحظات'], screens.map(sc=>[sc.screen_number||'—', sc.screen_name, sc.status, sc.notes||''])));

  // 5) الأعطال
  html += h2('5. الأعطال') + (fmtNoData(faults) ||
    table(['الجهاز','النوع','الوصف','الخطورة','الحالة','تاريخ الإبلاغ','صورة'], faults.map(fl=>{
      const fi = faultImages.find(im=>im.fault_id===fl.id);
      return [fl.device_name, fl.fault_type||'', fl.description||'', fl.severity, fl.status, new Date(fl.reported_at).toLocaleDateString('ar-EG'), fi?img(fi.image_url,55):''];
    })));

  // 6) الإضاءة
  html += h2('6. احتياجات الإضاءة') + (fmtNoData(lighting) ||
    table(['المكان','المشكلة','الحالة','التاريخ','صورة'], lighting.map(l=>[l.place_name||'', l.problem_description||l.description||'', l.status, l.created_at?new Date(l.created_at).toLocaleDateString('ar-EG'):'', img(l.photo_url,55)])));

  // 7) الكاميرات التي تحتاج تعديل
  html += h2('7. الكاميرات التي تحتاج تعديل') + (fmtNoData(cameraMods) ||
    table(['الكاميرا','الموقع','السبب','الحالة','قبل','بعد'], cameraMods.map(c=>[c.camera_name, c.place_name||'', c.problem_description||'', c.status, img(c.photo_before_url,50), img(c.photo_after_url,50)])));

  // 8) Racks
  html += h2('8. Racks') + (fmtNoData(racks) ||

  // 9) Switches
  html += h2('9. Switches') + (fmtNoData(switches) ||

      const rack = racks.find(r=>r.id===sw.rack_id);

    })));

  html += h2('10. Servers') + (fmtNoData(servers) ||
    table(['الاسم','الحالة','الموديل','IP','OS','Switch','صورة'], servers.map(sv=>{
      const sw = switches.find(x=>x.id===sv.switch_id);
      const simg = serverImages.find(im=>im.server_id===sv.id);
      return [sv.server_name, sv.status, `${sv.brand||''} ${sv.model||''}`, sv.ip_address||'—', sv.os_name||'—', sw?sw.switch_name:'—', simg?img(simg.image_url,55):''];
    })));

  // 11) Hard Drives / Storage
  html += h2('11. Hard Drives / Storage') + (fmtNoData(drives) ||
    table(['السيرفر','Slot','النوع','السعة','الحالة'], drives.map(dr=>{
      const sv = servers.find(x=>x.id===dr.server_id);
      return [sv?sv.server_name:'', dr.slot_number||'', dr.drive_type||'', fmtStorage(dr.capacity_gb), dr.status];
    })));

  // 12) UPS
  html += h2('12. UPS') + (fmtNoData(ups) ||
    table(['الاسم','الموقع','الحالة','صورة'], ups.map(u=>[u.ups_name, u.location||'', u.status, img(u.photo_url,55)])));

  // 12.5) الرسم البياني التلقائي من البيانات الفعلية
  try{
    const chartCv = buildFactoryChartCanvas(d);
    html += h2('الرسم البياني') + `<div style="text-align:center"><img src="${chartCv.toDataURL('image/png')}" style="max-width:100%;border-radius:8px"></div>`;
  }catch(e){ console.warn('تعذّر إنشاء الرسم البياني', e); }

  // 13) Network Infrastructure (ملخص)
  html += h2('13. البنية التحتية للشبكة (ملخص)') + table(['البند','العدد'], [
    ['Racks', racks.length], ['Switches', switches.length], ['Servers', servers.length], ['UPS', ups.length],
    ['إجمالي Ports', switches.reduce((a,sw)=>a+(sw.total_ports||0),0)], ['Ports مستخدمة', switches.reduce((a,sw)=>a+(sw.used_ports||0),0)],

    table(['الهدف','نوع الصيانة','الموعد','ملاحظات'], maintenance.map(m=>[m.target_name, m.maintenance_type, fmtDateAr(m.scheduled_date), m.notes||''])));

  // 17-19: المشتملات / المخزن / الاحتياجات (غير مرتبطة بمصنع محدد في بنية البيانات الحالية)
  html += h2('17. المشتملات والمخزن والاحتياجات') + `<p style="font-size:11px;color:#666">
    هذه الأقسام (المخزن، مشتملات الغرفة، احتياجات الغرفة) مشتركة على مستوى غرفة المراقبة المركزية ككل وليست مرتبطة بمصنع محدد في تصميم النظام الحالي — لذلك لا تظهر ضمن تقرير مصنع بعينه. يمكن مراجعتها من أقسامها المستقلة في التطبيق.</p>`;

  // 20) ملاحظات
  html += h2('18. ملاحظات') + (f?.notes ? `<p style="font-size:12px">${f.notes}</p>` : `<p style="color:#999;font-style:italic;font-size:11px">لا توجد ملاحظات إضافية مسجلة.</p>`);

  html += `<p style="text-align:center;color:#888;margin-top:24px;font-size:10.5px;border-top:1px dashed #ccc;padding-top:8px">— تقرير شامل تلقائي من نظام غرفة المراقبة المركزية — إعداد وتشغيل: إبراهيم رمضان —</p></div>`;
  return html;
}
