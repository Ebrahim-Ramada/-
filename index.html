<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>غرفة المراقبة المركزية — النسخة السحابية</title>
<link rel="manifest" href="./manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="غرفة المراقبة">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1220'/%3E%3Ccircle cx='32' cy='30' r='16' fill='none' stroke='%2338D9C9' stroke-width='4'/%3E%3Ccircle cx='32' cy='30' r='5' fill='%2338D9C9'/%3E%3Crect x='24' y='47' width='16' height='4' rx='2' fill='%2338D9C9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#0B1220; --bg-2:#0E1830; --panel:#131B2E; --panel-2:#182446;
  --border:#243055; --border-soft:#1C2745; --text:#E9EEFB; --muted:#8CA0C4; --muted-2:#5E6E92;
  --accent:#38D9C9; --amber:#F5A623; --danger:#FF6B6B; --success:#4ADE80;
  --radius:16px; --radius-sm:10px; --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
body.light-mode{
  --bg:#F3F6FB; --bg-2:#E9EFF7; --panel:#FFFFFF; --panel-2:#F0F4FA;
  --border:#D8E0EE; --border-soft:#E4EAF3; --text:#0F1A2E; --muted:#5A6B87; --muted-2:#8493AC;
  --accent:#0E9488; --amber:#B9770E; --danger:#D9463C; --success:#1E9E5A;
}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;align-items:center;justify-content:center;padding:20px;}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain;}
.lightbox-close{position:absolute;top:calc(16px + var(--safe-top));left:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px;cursor:pointer;z-index:2;}
.lightbox-zoom-controls{position:absolute;bottom:calc(20px + var(--safe-bottom));display:flex;gap:10px;z-index:2;}
.lightbox-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:26px;cursor:pointer;z-index:2;line-height:1;}
#lightboxPrev{right:14px;} #lightboxNext{left:14px;}
.lightbox-zoom-controls button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:18px;cursor:pointer;}
.alert-item{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.alert-item .dismiss{background:none;border:none;color:inherit;opacity:.6;font-size:14px;cursor:pointer;flex:none;padding:2px 4px;}
.alert-item .dismiss:hover{opacity:1;}
.lock-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;}
.lock-screen.open{display:flex;}
.lock-box{width:100%;max-width:340px;}
body.app-locked .topbar,body.app-locked .container,body.app-locked .bottomnav{display:none!important;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease;}
*{box-sizing:border-box;}
html,body{height:100%;max-width:100%;overflow-x:hidden;}
body{
  margin:0;
  background:radial-gradient(1200px 600px at 100% -10%, rgba(56,217,201,.08), transparent 60%), var(--bg);
  color:var(--text); font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  min-height:100%; padding-bottom:calc(78px + var(--safe-bottom));
}
h1,h2,h3,h4{font-family:'Tajawal','IBM Plex Sans Arabic',sans-serif;}
.container{max-width:860px;width:100%;margin:0 auto;padding:0 14px;box-sizing:border-box;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

.topbar{position:sticky;top:0;z-index:40;padding-top:var(--safe-top);background:linear-gradient(180deg, rgba(11,18,32,.97), rgba(11,18,32,.9) 70%, rgba(11,18,32,0));backdrop-filter:blur(6px);border-bottom:1px solid var(--border-soft);}
.topbar-inner{max-width:860px;width:100%;margin:0 auto;padding:14px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-sizing:border-box;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;overflow:hidden;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--panel-2),var(--panel));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;flex:none;}
.dot{width:8px;height:8px;border-radius:50%;position:absolute;top:6px;left:6px;box-shadow:0 0 8px currentColor;animation:blink 2.2s ease-in-out infinite;}
.dot.online{background:var(--success);color:var(--success);}
.dot.offline{background:var(--danger);color:var(--danger);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.brand-title{font-weight:900;font-size:15px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbtn{background:var(--panel);border:1px solid var(--border-soft);color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:14px;flex:none;}

.view{display:none;padding:16px 0 30px;animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
.section-title h2{font-size:15px;margin:0;}
.eyebrow{font-size:11px;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:4px;}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:520px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-card .label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.stat-card .value{font-size:24px;font-weight:800;font-family:'Tajawal';}
.stat-card .sub{font-size:11px;color:var(--muted-2);margin-top:4px;}
.stat-card.danger .value{color:var(--danger);} .stat-card.success .value{color:var(--success);} .stat-card.accent .value{color:var(--accent);}

.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hero-card{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 14px 16px;border-inline-start:4px solid var(--border);}
.hero-card.ok{border-inline-start-color:var(--success);}
.hero-card.warn{border-inline-start-color:var(--amber);}
.hero-card.bad{border-inline-start-color:var(--danger);}
.hero-card .hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.hero-card .hero-icon{font-size:15px;}
.hero-card .hero-pct{font-family:'Tajawal';font-weight:900;font-size:26px;}
.hero-card .hero-label{font-size:11px;color:var(--muted);margin-top:2px;}
.hero-card .hero-sub{font-size:10.5px;color:var(--muted-2);margin-top:6px;display:flex;justify-content:space-between;}

.quickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.quickgrid .qbtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:right;}
.quickgrid .qbtn .qicon{font-size:16px;flex:none;}
.quickgrid .qbtn:active{transform:scale(.98);}

.site-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.site-name{font-weight:800;font-size:15.5px;font-family:'Tajawal';word-break:break-word;}
.site-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted);}
.pill.ok{color:var(--success);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08);}
.pill.bad{color:var(--danger);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08);}
.pill.warn{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08);}
.pill.role-admin{color:#04211E;background:var(--accent);border-color:var(--accent);font-weight:800;}

.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;}
.mini{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:10px;padding:8px;text-align:center;}
.mini .n{font-weight:800;font-size:15px;font-family:'Tajawal';}
.mini .t{font-size:9.5px;color:var(--muted-2);margin-top:2px;}

.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.btn{appearance:none;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(150deg,var(--accent),#22A99B);color:#04211E;border-color:transparent;font-weight:800;}
.btn.danger{color:var(--danger);}
.btn.block{width:100%;justify-content:center;}
.btn.sm{padding:6px 10px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.field{margin-bottom:10px;}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
.input{width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 11px;font-size:14px;outline:none;box-sizing:border-box;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,217,201,.12);}
textarea.input{min-height:64px;resize:vertical;line-height:1.7;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px;}
thead th{background:var(--panel-2);color:var(--accent);font-weight:700;font-size:11px;padding:9px 7px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:8px 7px;border-bottom:1px solid var(--border-soft);white-space:nowrap;text-align:center;}
tbody td:first-child{text-align:right;font-weight:700;}

.bottomnav{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(19,27,46,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border-soft);padding-bottom:var(--safe-bottom);}
.bottomnav-inner{max-width:860px;margin:0 auto;display:flex;}
.navbtn{flex:1;background:none;border:none;color:var(--muted);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;cursor:pointer;}
.navbtn svg{width:20px;height:20px;}
.navbtn.active{color:var(--accent);}

.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.7);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;overflow-x:hidden;padding:18px 16px calc(20px + var(--safe-bottom));box-sizing:border-box;}
@media(min-width:640px){.modal-bg{align-items:center;}.modal{border-radius:18px;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.modal-head h3{margin:0;font-size:16px;min-width:0;}
.x-close{background:var(--bg-2);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;flex:none;}

.toast{position:fixed;bottom:calc(90px + var(--safe-bottom));right:50%;transform:translateX(50%);background:var(--panel-2);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:12px;font-size:12.5px;z-index:200;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.toast.show{opacity:1;transform:translateX(50%) translateY(-6px);}

.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:26px 22px;}
.offline-banner{background:linear-gradient(90deg, rgba(245,166,35,.15), rgba(245,166,35,.04));border:1px solid rgba(245,166,35,.4);color:#FFE3B0;border-radius:12px;padding:10px 12px;font-size:12.5px;margin:10px 0;display:none;}
.empty{text-align:center;color:var(--muted-2);font-size:12.5px;padding:30px 10px;}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen" style="display:none"></div>

<div id="appShell" style="display:none">
  <div class="topbar">
    <div class="topbar-inner">
      <button id="backBtn" class="topbtn" onclick="goBack()" title="رجوع" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="brand">
        <div class="brand-mark"><div class="dot online" id="connDot"></div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="11" r="6.2" stroke="#38D9C9" stroke-width="1.8"/><circle cx="12" cy="11" r="1.8" fill="#38D9C9"/><rect x="9" y="18.5" width="6" height="1.8" rx="0.9" fill="#38D9C9"/></svg>
        </div>
        <div style="min-width:0;overflow:hidden">
          <div class="brand-title">غرفة المراقبة المركزية</div>
          <div class="brand-sub" id="userBadge">—</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex:none">
        <button class="topbtn" id="themeToggleBtn" onclick="toggleLightMode()" title="تبديل الوضع الفاتح/الداكن">🌙</button>
        <button class="topbtn" onclick="openNotifications()" title="الإشعارات" style="position:relative">🔔<span id="notifDot" style="display:none;position:absolute;top:3px;left:3px;width:8px;height:8px;border-radius:50%;background:var(--danger)"></span></button>
        <button class="topbtn" onclick="openGlobalSearch()" title="بحث شامل">🔍</button>
        <button class="topbtn" onclick="manualSync()" title="مزامنة الآن">🔄</button>
        <button class="topbtn" id="quickLockBtn" onclick="relockApp()" title="قفل التطبيق الآن" style="display:none">🔒</button>
        <button class="topbtn" onclick="doSignOut()" title="تسجيل الخروج">🚪</button>
      </div>
    </div>
    <div class="container"><div class="offline-banner" id="offlineBanner">📡 أنت غير متصل بالإنترنت الآن — التطبيق يعمل محليًا وسيتم رفع أي تعديل تلقائيًا عند عودة الاتصال.</div><div id="alertsBox"></div></div>
  </div>

  <div class="container" id="viewsHost"></div>

  <div class="bottomnav">
    <div class="bottomnav-inner">
      <button class="navbtn" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>الرئيسية</span></button>
      <button class="navbtn" data-view="factories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-8h6v8"/></svg><span>المصانع</span></button>
      <button class="navbtn" data-view="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>التقرير</span></button>
      <button class="navbtn" data-view="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg><span>الأرشيف</span></button>
      <button class="navbtn" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z"/></svg><span>المزيد</span></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalHost"></div></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>
  <button class="lightbox-nav-btn" id="lightboxPrev" onclick="event.stopPropagation(); navLightbox(-1)" style="display:none">‹</button>
  <img id="lightboxImg" src="" onclick="event.stopPropagation()">
  <button class="lightbox-nav-btn" id="lightboxNext" onclick="event.stopPropagation(); navLightbox(1)" style="display:none">›</button>
  <div id="lightboxCounter" style="position:absolute;top:calc(16px + var(--safe-top));left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;display:none">1/1</div>
  <div class="lightbox-zoom-controls" onclick="event.stopPropagation()">
    <button onclick="zoomLightbox(0.8)">➖</button>
    <button onclick="zoomLightbox(1.25)">➕</button>
  </div>
</div>
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="brand-mark" style="width:56px;height:56px;margin:0 auto 14px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="11" r="6.2" stroke="#38D9C9" stroke-width="1.8"/><circle cx="12" cy="11" r="1.8" fill="#38D9C9"/><rect x="9" y="18.5" width="6" height="1.8" rx="0.9" fill="#38D9C9"/></svg>
    </div>

        document.head.appendChild(s);

    }catch(e){ /* جرّب المصدر التالي */ }

}

function downloadBlob(blob, filename){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){ return false; }
}
async function saveOrShareFile(blob, filename){
  window.__lastExport = {blob, filename};
  downloadBlob(blob, filename);
  toast(`✅ تم تنزيل ${filename}`);
}
async function shareLastExport(){
  const ex = window.__lastExport; if(!ex) return;
  try{
    const file = new File([ex.blob], ex.filename);
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
    else toast('المشاركة غير مدعومة على هذا المتصفح');
  }catch(e){}
}

/* ============================================================
   القفل السريع بكلمة مرور محلية على هذا الجهاز (طبقة إضافية فوق
   تسجيل الدخول الأساسي — مفيدة لو سبت الهاتف مفتوح وابعدت شوية)
   + دعم البصمة (WebAuthn) إن كان الجهاز/الرابط يدعمها
   ============================================================ */
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16) + '_' + str.length;
}
function getDeviceLockHash(){ return localStorage.getItem('rc_device_lock_hash'); }
function isAppLocked(){ return !!getDeviceLockHash() && sessionStorage.getItem('rc_device_unlocked') !== '1'; }
function isWebAuthnSupported(){ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
function updateQuickLockBtn(){
  const btn = document.getElementById('quickLockBtn');
  if(btn) btn.style.display = getDeviceLockHash() ? 'flex' : 'none';
}
function showLockScreen(){
  document.body.classList.add('app-locked');
  document.getElementById('lockScreen').classList.add('open');
  const bioBtn = document.getElementById('lockBiometricBtn');
  if(bioBtn) bioBtn.style.display = (localStorage.getItem('rc_biometric_cred') && isWebAuthnSupported()) ? 'block' : 'none';
  setTimeout(()=>{ const el=document.getElementById('lockPasswordInput'); if(el) el.focus(); }, 100);
}
function hideLockScreen(){
  document.body.classList.remove('app-locked');
  document.getElementById('lockScreen').classList.remove('open');
}
function attemptUnlock(){
  const input = document.getElementById('lockPasswordInput');
  if(simpleHash(input.value) === getDeviceLockHash()){
    sessionStorage.setItem('rc_device_unlocked','1');
    input.value=''; document.getElementById('lockError').style.display='none';
    hideLockScreen(); resetIdleTimer();
  } else {
    document.getElementById('lockError').style.display='block';
    const box = document.querySelector('.lock-box');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    input.value=''; input.focus();
  }
}
const __lockInputEl0 = document.getElementById('lockPasswordInput');
if(__lockInputEl0) __lockInputEl0.addEventListener('keydown', e=>{ if(e.key==='Enter') attemptUnlock(); });
function relockApp(){
  if(!getDeviceLockHash()){ toast('لم تفعّل قفلًا سريعًا بعد — من الإعدادات'); return; }
  sessionStorage.removeItem('rc_device_unlocked');
  showLockScreen();
}
function setDeviceLock(pin){
  if(pin.length<4){ toast('كلمة القفل يجب أن تكون 4 أرقام/أحرف على الأقل'); return; }
  localStorage.setItem('rc_device_lock_hash', simpleHash(pin));
  sessionStorage.setItem('rc_device_unlocked','1');
  updateQuickLockBtn(); toast('✅ تم تفعيل القفل السريع على هذا الجهاز'); resetIdleTimer();
}
function removeDeviceLock(){
  localStorage.removeItem('rc_device_lock_hash');
  localStorage.removeItem('rc_biometric_cred');
  updateQuickLockBtn(); toast('تم إلغاء القفل السريع');
}
let idleTimer = null;
function resetIdleTimer(){
  clearTimeout(idleTimer);
  const mins = parseInt(localStorage.getItem('rc_autolock_minutes')||'10');
  if(!getDeviceLockHash() || !mins) return;
  idleTimer = setTimeout(()=>{ if(!isAppLocked()) relockApp(); }, mins*60000);
}
['click','touchstart','keydown'].forEach(evt=> document.addEventListener(evt, ()=>{ if(!isAppLocked()) resetIdleTimer(); }, {passive:true}));

function arrayBufferToBase64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToUint8(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes; }
async function enableBiometricLogin(){
  if(!getDeviceLockHash()){ toast('فعّل القفل السريع بكلمة مرور أولًا'); return; }
  if(!isWebAuthnSupported()){ toast('⚠️ البصمة غير مدعومة (تحتاج فتح التطبيق عبر رابط HTTPS آمن)'); return; }
  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp:{ name:'غرفة المراقبة المركزية' },
      user:{ id: crypto.getRandomValues(new Uint8Array(16)), name:'user', displayName: currentProfile?.display_name||'user' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
      timeout:60000, attestation:'none'
    }});
    if(cred){ localStorage.setItem('rc_biometric_cred', arrayBufferToBase64(cred.rawId)); toast('✅ تم تفعيل الدخول بالبصمة'); }
  }catch(e){ console.warn(e); toast('⚠️ تعذّر تفعيل البصمة على هذا الجهاز/الرابط'); }
}
async function attemptBiometricUnlock(){
  const credId = localStorage.getItem('rc_biometric_cred');
  if(!credId){ toast('البصمة غير مفعّلة'); return; }
  try{
    const assertion = await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{ id: base64ToUint8(credId), type:'public-key' }],
      userVerification:'required', timeout:60000
    }});
    if(assertion){ sessionStorage.setItem('rc_device_unlocked','1'); hideLockScreen(); resetIdleTimer(); toast('✅ تم الدخول بالبصمة'); }
  }catch(e){ console.warn(e); toast('⚠️ تعذّر التحقق بالبصمة'); }
}

let authMode = 'login'; // 'login' | 'signup'
function renderAuthScreen(){

          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="11" r="6.2" stroke="#38D9C9" stroke-width="1.8"/><circle cx="12" cy="11" r="1.8" fill="#38D9C9"/><rect x="9" y="18.5" width="6" height="1.8" rx="0.9" fill="#38D9C9"/></svg>
        </div>
        <div style="font-weight:900;font-size:17px;font-family:'Tajawal'">غرفة المراقبة المركزية</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">شركة جهينة للصناعات الغذائية</div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:16px;background:var(--bg-2);border-radius:10px;padding:4px">
        <button class="btn ${authMode==='login'?'primary':''} sm" style="flex:1" onclick="switchAuthMode('login')">تسجيل الدخول</button>
        <button class="btn ${authMode==='signup'?'primary':''} sm" style="flex:1" onclick="switchAuthMode('signup')">حساب جديد</button>
      </div>
      ${authMode==='signup' ? `<div class="field"><label>الاسم الظاهر</label><input class="input" id="auth_name" placeholder="مثال: أحمد علي"></div>` : ''}
      <div class="field"><label>البريد الإلكتروني</label><input class="input" id="auth_email" type="email" placeholder="name@example.com" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label>
        <div style="position:relative">
          <input class="input" id="auth_pass" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-left:40px">
          <button type="button" onclick="togglePassVisibility()" style="position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px">👁️</button>
        </div>
      </div>
      <div id="authError" style="color:var(--danger);font-size:12px;margin-bottom:8px;display:none"></div>
      <button class="btn primary block" id="authSubmitBtn" onclick="submitAuth()">${authMode==='login'?'🔓 دخول':'✅ إنشاء الحساب'}</button>
      ${authMode==='signup' ? `<p style="font-size:10.5px;color:var(--muted-2);text-align:center;margin-top:12px">أول شخص يسجّل في النظام يصبح Admin تلقائيًا وللأبد. أي حساب بعده يكون "زميل" بصلاحيات مشاهدة أساسية فقط حتى يمنحه الـAdmin صلاحيات إضافية.</p>` : ''}
      <p style="text-align:center;font-size:10px;color:var(--muted-2);margin-top:18px">إعداد وتشغيل النظام: إبراهيم رمضان</p>
    </div>`;
}
function switchAuthMode(m){ authMode = m; renderAuthScreen(); }
function togglePassVisibility(){
  const el = document.getElementById('auth_pass');
  el.type = el.type==='password' ? 'text' : 'password';
}
async function submitAuth(){
  const email = document.getElementById('auth_email').value.trim();
  const pass = document.getElementById('auth_pass').value;
  const errBox = document.getElementById('authError');
  errBox.style.display='none';
  if(!email || !pass){ errBox.textContent='من فضلك أدخل البريد الإلكتروني وكلمة المرور'; errBox.style.display='block'; return; }
  if(!SUPA_READY){ errBox.textContent='تعذّر الاتصال بالخادم — تحقق من اتصال الإنترنت وحاول مرة أخرى'; errBox.style.display='block'; return; }
  const btn = document.getElementById('authSubmitBtn'); btn.disabled = true; btn.textContent = 'جاري المعالجة...';
  try{
    if(authMode==='signup'){
      const name = (document.getElementById('auth_name').value||'').trim();
      const { data, error } = await supa.auth.signUp({ email, password: pass, options:{ data:{ display_name: name || email.split('@')[0] } } });
      if(error) throw error;
      if(data && data.user && !data.session){
        toast('✅ تم إنشاء الحساب — إذا طُلب تأكيد البريد الإلكتروني، تحقق من بريدك ثم سجّل الدخول');
        switchAuthMode('login');
        return;
      }
    } else {
      const { error } = await supa.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
    }
    // onAuthStateChange سيتولى الباقي (تحميل الملف الشخصي وعرض التطبيق)
  }catch(e){
    console.error(e);
    errBox.textContent = translateAuthError(e.message);
    errBox.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = authMode==='login'?'🔓 دخول':'✅ إنشاء الحساب';
  }
}
function translateAuthError(msg){
  if(!msg) return 'حدث خطأ غير متوقع';
  if(msg.includes('Invalid login credentials')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
  if(msg.includes('already registered')) return 'هذا البريد الإلكتروني مسجّل بالفعل — جرّب تسجيل الدخول';
  if(msg.includes('Password should be')) return 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
  if(msg.includes('rate limit')) return 'محاولات كثيرة جدًا، انتظر قليلًا وحاول مرة أخرى';
  return msg;
}
async function doSignOut(){
  try{ await supa.auth.signOut(); }catch(e){}
  currentSession = null; currentProfile = null;
  if(realtimeChannel){ try{ supa.removeChannel(realtimeChannel); }catch(e){} realtimeChannel=null; }
  authMode='login';
  renderAuthScreen();
}

/* ============================================================
   دورة حياة الجلسة: مراقبة تسجيل الدخول/الخروج تلقائيًا
   (تُفعَّل من startApp() بعد التأكد من تحميل مكتبة Supabase بنجاح)
   ملاحظة مهمة: Supabase يطلق هذا الحدث كثيرًا (مثل تجديد الرمز
   التلقائي كل ساعة، أو عند رجوعك للتطبيق بعد تصفّح شيء آخر).
   يجب عدم إعادة تحميل/الخروج من التطبيق إلا عند دخول أو خروج حقيقي.
   ============================================================ */
function registerAuthListener(){
  supa.auth.onAuthStateChange(async (event, session)=>{
    currentSession = session;
    if(event === 'SIGNED_OUT' || !session){
      renderAuthScreen();
      return;
    }
    if(event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED'){
      // الجلسة اتجددت فقط — لا داعي لإعادة تحميل كل شيء أو المخاطرة بتسجيل خروج بسبب خطأ شبكة عابر
      return;
    }
    // SIGNED_IN أو INITIAL_SESSION فقط
    await loadProfileAndEnterApp();
  });
}

/* ============================================================
   نبض دوري: تحديث "آخر ظهور" أثناء استخدام التطبيق (كل 3 دقائق)
   وأيضًا عند رجوع المستخدم للتطبيق بعد تصفّح شيء آخر
   ============================================================ */
let presenceInterval = null;
function startPresenceHeartbeat(){
  if(presenceInterval) return;
  presenceInterval = setInterval(async ()=>{
    if(document.visibilityState==='visible' && !isAppLocked()){
      try{ await supa.rpc('touch_my_presence'); }catch(e){}
    }
  }, 3*60000);
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState==='visible' && currentProfile && !isAppLocked()){
      try{ await supa.rpc('touch_my_presence'); }catch(e){}
    }
  });
}
function fmtRelativeTime(iso){
  if(!iso) return 'لم يسجّل دخول بعد';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins<3) return '🟢 متصل الآن';
  if(mins<60) return `منذ ${mins} دقيقة`;
  const hrs = Math.floor(mins/60);
  if(hrs<24) return `منذ ${hrs} ساعة`;
  const days = Math.floor(hrs/24);
  if(days<30) return `منذ ${days} يوم`;
  return new Date(iso).toLocaleDateString('ar-EG');
}

async function loadProfileAndEnterApp(){
  try{
    const { data: profile, error } = await supa.from('profiles').select('*').eq('id', currentSession.user.id).single();
    if(error) throw error;
    currentProfile = profile;
    if(profile.status === 'suspended'){
      toast('🚫 هذا الحساب موقوف من الأدمن — تواصل مع إبراهيم');
      await doSignOut();
      return;
    }
    enterApp();
    subscribeRealtime();
    flushPendingQueue();
    try{ await supa.rpc('touch_my_login'); }catch(e){ console.warn('تعذّر تسجيل وقت الدخول (غير خطير)', e); }
    startPresenceHeartbeat();
  }catch(e){
    console.error('فشل تحميل الملف الشخصي', e);
    // لو كان عندنا بالفعل بروفايل محمّل من قبل (يعني المستخدم داخل التطبيق أصلًا)،
    // فده على الأغلب خطأ شبكة عابر — لا نسجّل خروجه أبدًا، فقط نبلغه ونستمر
    if(currentProfile){
      toast('⚠️ تعذّر تحديث بياناتك (مشكلة شبكة مؤقتة) — تابع استخدام التطبيق بأمان');
      return;
    }
    if(e.code==='PGRST116' || (e.message||'').includes('multiple (or no) rows')){
      toast('⚠️ حسابك مسجّل لكن بدون صف صلاحيات في قاعدة البيانات. شغّل ملف fix_missing_profiles.sql في SQL Editor ثم أعد تسجيل الدخول.');
    } else {
      toast('⚠️ تعذّر تحميل بيانات حسابك: '+(e.message||'خطأ غير معروف'));
    }

  }
}

/* ============================================================
   حالة الاتصال + طابور المزامنة أثناء انقطاع الإنترنت
   ============================================================ */
const PENDING_QUEUE_KEY = 'rc_pending_queue_v1';
function getPendingQueue(){ try{ return JSON.parse(localStorage.getItem(PENDING_QUEUE_KEY)||'[]'); }catch(e){ return []; } }
function savePendingQueue(q){ localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(q)); }
function queuePendingOp(op){
  const q = getPendingQueue(); q.push({...op, queuedAt:new Date().toISOString()}); savePendingQueue(q);
  updateOfflineBanner();
}
async function flushPendingQueue(){
  if(!navigator.onLine) return;
  const q = getPendingQueue();
  if(!q.length) return;
  toast(`🔄 جاري رفع ${q.length} عملية معلّقة...`);
  const remaining = [];
  for(const op of q){
    try{
      if(op.table==='factories' && op.type==='update') await supa.from('factories').update(op.data).eq('id', op.id);
      else if(op.table==='factories' && op.type==='insert') await supa.from('factories').insert(op.data);
      else if(op.table==='factories' && op.type==='delete') await supa.from('factories').delete().eq('id', op.id);
      else if(op.table==='audit_log' && op.type==='insert') await supa.from('audit_log').insert(op.data);
    }catch(e){ console.warn('فشلت إعادة المزامنة لعملية، ستُحفظ للمحاولة لاحقًا', op, e); remaining.push(op); }
  }
  savePendingQueue(remaining);
  if(remaining.length===0){ toast('✅ تمت مزامنة كل البيانات المعلّقة بنجاح'); loadAllData(); }
  else toast(`⚠️ تعذّر رفع ${remaining.length} عملية، سيُعاد المحاولة تلقائيًا`);
  updateOfflineBanner();
}
function updateOfflineBanner(){
  const banner = document.getElementById('offlineBanner');
  const dot = document.getElementById('connDot');
  if(!banner || !dot) return;
  const q = getPendingQueue();
  if(!navigator.onLine){
    dot.className = 'dot offline';
    banner.style.display='block';
    banner.textContent = '📡 أنت غير متصل بالإنترنت الآن — أي تعديل سيُحفظ محليًا ويُرفع تلقائيًا عند عودة الاتصال.';
  } else if(q.length>0){
    dot.className = 'dot offline';
    banner.style.display='block';
    banner.textContent = `🔄 يوجد ${q.length} عملية بانتظار المزامنة...`;
  } else {
    dot.className = 'dot online';
    banner.style.display='none';
  }
}
window.addEventListener('online', ()=>{ updateOfflineBanner(); flushPendingQueue(); });
window.addEventListener('offline', updateOfflineBanner);
function manualSync(){
  if(!navigator.onLine){ toast('لا يوجد اتصال بالإنترنت حاليًا'); return; }
  flushPendingQueue(); loadAllData();
}

/* ============================================================
   المزامنة الفورية (Realtime) — أي تغيير من أي جهاز يظهر فورًا
   ============================================================ */
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = supa.channel('rc-live-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'factories'}, ()=>{ loadFactories(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'audit_log'}, ()=>{ if(currentView==='audit') renderCurrentView(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, ()=>{ if(currentView==='users') renderCurrentView(); })
    .subscribe();
}

function getAlerts(){
  const alerts = [];
  factoriesData.map(computeFactory).forEach(s=>{
    if(s.camerasDown > appSettings.alert_threshold) alerts.push({level:'bad', text:`⚠️ عدد مرتفع من الكاميرات المنقطعة في ${s.name} (${s.camerasDown}).`});
    else if(s.camUptime < appSettings.alert_pct_threshold && s.camerasTotal>0) alerts.push({level:'warn', text:`⚠️ نسبة تشغيل الكاميرات في ${s.name} أقل من ${appSettings.alert_pct_threshold}% (${fmtPct2(s.camUptime)}).`});
    if(s.screensDown>0) alerts.push({level:'warn', text:`⚠️ توجد ${s.screensDown} شاشة منقطعة في ${s.name}.`});
  });
  // تصعيد الأعطال المتأخرة عن حد SLA
  const slaMs = (appSettings.fault_sla_hours||24) * 3600000;
  (faultsData||[]).forEach(f=>{
    if(f.status!=='مغلق' && f.status!=='تم الإصلاح'){
      const ageMs = Date.now() - new Date(f.reported_at).getTime();
      if(ageMs > slaMs) alerts.push({level:'bad', text:`🔴 عطل متأخر عن حد الاستجابة (${appSettings.fault_sla_hours} ساعة): ${f.device_name}.`});
    }
  });
  // صيانة وقائية متأخرة
  const today = new Date().toISOString().slice(0,10);
  const overdueMaint = (preventiveTasks||[]).filter(t=>t.scheduled_date<today);
  if(overdueMaint.length) alerts.push({level:'warn', text:`🛠️ يوجد ${overdueMaint.length} مهمة صيانة وقائية متأخرة عن موعدها.`});
  // احتياجات غرفة عاجلة لم تُنفَّذ
  const urgentNeeds = (roomNeedsData||[]).filter(r=>r.priority==='عاجلة' && r.status!=='تم التنفيذ');
  if(urgentNeeds.length) alerts.push({level:'bad', text:`📋 يوجد ${urgentNeeds.length} احتياج غرفة عاجل لم يُنفَّذ بعد.`});
  return alerts;
}
const DISMISSED_ALERTS_KEY = 'rc_dismissed_alerts_v1';
function loadDismissedAlerts(){
  try{ return new Set(JSON.parse(localStorage.getItem(DISMISSED_ALERTS_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveDismissedAlerts(){
  try{ localStorage.setItem(DISMISSED_ALERTS_KEY, JSON.stringify([...dismissedAlerts])); }catch(e){}
}
let dismissedAlerts = loadDismissedAlerts();
let lastBadAlertSig = '';
function playAlertBeep(){
  if(localStorage.getItem('rc_sound_alerts')==='0') return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach(delay=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      const t0 = ctx.currentTime+delay;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+0.22);
    });
  }catch(e){}
}
function dismissAlert(alertText){
  dismissedAlerts.add(alertText);
  saveDismissedAlerts();
  renderAlertsBar();
}
function renderAlertsBar(){
  const box = document.getElementById('alertsBox');
  if(!box) return;
  const allAlerts = getAlerts();
  const badSig = allAlerts.filter(a=>a.level==='bad').map(a=>a.text).join('|');
  if(badSig && badSig !== lastBadAlertSig) playAlertBeep();
  lastBadAlertSig = badSig;
  const alerts = allAlerts.filter(a=>!dismissedAlerts.has(a.text));
  if(!alerts.length){ box.innerHTML=''; }
  else box.innerHTML = alerts.slice(0,4).map((a)=>`
    <div class="offline-banner alert-item" style="display:flex;margin-top:8px;${a.level==='bad'?'border-color:rgba(255,107,107,.4);color:#FFD4D4;background:linear-gradient(90deg, rgba(255,107,107,.12), rgba(255,107,107,.03))':''}">
      <span>${a.text}</span><button class="dismiss" onclick='dismissAlert(${JSON.stringify(a.text)})' title="إخفاء">✕</button>
    </div>`).join('');
  updateNotifDot();
}

// تحويل صف قاعدة البيانات لنفس شكل الحسابات المستخدم في الواجهة
function computeFactory(f){
  const camerasTotal = f.cameras_total||0, camerasDown = Math.min(f.cameras_down||0, camerasTotal);
  const camerasUp = camerasTotal - camerasDown;
  const screens = f.screens||0, screensDown = Math.min(f.screens_down||0, screens);
  const screensUp = screens - screensDown;
  const pct = (a,b)=> b>0 ? (a/b*100) : 0;
  return {...f, camerasTotal, camerasDown, camerasUp, screens, screensDown, screensUp,
    camUptime: pct(camerasUp, camerasTotal), camDownPct: pct(camerasDown, camerasTotal),
    scrUptime: pct(screensUp, screens), scrDownPct: pct(screensDown, screens)};
}
function computeTotals(list){
  const t = list.reduce((a,f)=>{ a.screens+=f.screens; a.screensDown+=f.screensDown; a.screensUp+=f.screensUp;
    a.camerasTotal+=f.camerasTotal; a.camerasDown+=f.camerasDown; a.camerasUp+=f.camerasUp; return a; },
    {screens:0,screensDown:0,screensUp:0,camerasTotal:0,camerasDown:0,camerasUp:0});
  const pct=(a,b)=> b>0?(a/b*100):0;
  t.camUptime=pct(t.camerasUp,t.camerasTotal); t.camDownPct=pct(t.camerasDown,t.camerasTotal);
  t.scrUptime=pct(t.screensUp,t.screens); t.scrDownPct=pct(t.screensDown,t.screens);
  t.count = list.length;
  return t;
}
function fmtPct2(v){ return v.toFixed(2)+'%'; }

  catch(e){ queuePendingOp({table:'audit_log', type:'insert', data:row}); }
}

  if(navHistory.length<=1) return;

}

});

async function saveFactoryForm(id, migrated){
  if(!isAdmin()){ toast('🚫 هذه العملية متاحة للأدمن فقط'); return; }
  const name = document.getElementById('ff_name').value.trim();
  if(!name){ toast('أدخل اسم الموقع'); return; }
  const isHub = document.getElementById('ff_ishub').checked;
  const payload = {
    name, is_central_hub: isHub,
    root_causes: document.getElementById('ff_root').value.trim(),
    actions: document.getElementById('ff_actions').value.trim(),
    updated_by: currentProfile.id
  };
  if(!migrated){
    const camerasTotal = Math.max(0, parseInt(document.getElementById('ff_camTotal').value)||0);
    const camerasDown = Math.min(camerasTotal, Math.max(0, parseInt(document.getElementById('ff_camDown').value)||0));
    const screens = Math.max(0, parseInt(document.getElementById('ff_screens').value)||0);
    const screensDown = Math.min(screens, Math.max(0, parseInt(document.getElementById('ff_screensDown').value)||0));
    const downList = document.getElementById('ff_downList').value.split('\n').map(x=>x.trim()).filter(Boolean);
    Object.assign(payload, { cameras_total:camerasTotal, cameras_down:camerasDown, screens, screens_down:screensDown, down_list:downList });
  }
  try{
    if(isHub){ try{ await supa.from('factories').update({is_central_hub:false}).neq('id', id||'00000000-0000-0000-0000-000000000000'); }catch(e){} }
    if(id){
      if(!navigator.onLine){ queuePendingOp({table:'factories', type:'update', id, data:payload}); toast('📥 تم الحفظ محليًا، سيُرفع عند عودة الاتصال'); }
      else { const {error} = await supa.from('factories').update(payload).eq('id', id); if(error) throw error; }
      await logAudit('تعديل بيانات موقع', name);
    } else {
      payload.created_by = currentProfile.id;
      if(!navigator.onLine){ queuePendingOp({table:'factories', type:'insert', data:payload}); toast('📥 تم الحفظ محليًا، سيُرفع عند عودة الاتصال'); }
      else { const {error} = await supa.from('factories').insert(payload); if(error) throw error; }
      await logAudit('إضافة موقع جديد', name);
    }
    closeModal(); toast('✅ تم الحفظ بنجاح'); loadFactories();
  }catch(e){
    console.error(e);
    if(e.message && (e.message.includes('permission') || e.message.includes('policy') || e.code==='42501')){
      toast('🚫 الخادم رفض العملية — لا تملك صلاحية التعديل');
    } else { toast('⚠️ حدث خطأ: '+ (e.message||'غير معروف')); }
  }
}

/* ============================================================
   SLA قديم (احتفظنا بالدالة لأغراض التوافق، لم تعد تُستدعى من نموذج
   المصنع؛ التتبع الآن يتم من شاشة إدارة الكاميرات مباشرة)
   ============================================================ */
async function handleSlaTracking(oldFactory, newDownList){
  const oldList = oldFactory.down_list || [];
  const oldSince = oldFactory.down_since || {};
  const fixedCameras = oldList.filter(n=> !newDownList.includes(n));
  for(const cam of fixedCameras){
    const since = oldSince[cam];
    if(!since) continue;
    const hrs = Math.max(0.01, (Date.now()-new Date(since).getTime())/3600000);
    const row = { factory_id: oldFactory.id, site_name: oldFactory.name, camera_name: cam, down_since: since, fixed_at: new Date().toISOString(), duration_hours: hrs };
    try{ await supa.from('maintenance_log').insert(row); }catch(e){ console.warn('تعذّر تسجيل SLA', e); }
  }
}
/* ============================================================
   صور الكاميرات المنقطعة — رفع حقيقي إلى Supabase Storage
   ============================================================ */
function compressImageFile(file, maxW=800, quality=0.65){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*(maxW/w)); w=maxW; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(blob=>resolve(blob), 'image/jpeg', quality);
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

/* ============================================================
   رسوم بيانية HTML/CSS/SVG خالصة — بدون أي مكتبة خارجية أو إنترنت
   ============================================================ */
function renderUptimeBars(sites){
  return sites.map(s=>{
    const color = s.camUptime<90?'var(--danger)':(s.camUptime<95?'var(--amber)':'var(--accent)');
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:3px"><span>${s.name}</span><b style="color:${color}">${fmtPct2(s.camUptime)}</b></div>
      <div style="width:100%;height:12px;border-radius:5px;background:var(--bg-2);overflow:hidden"><div style="width:${Math.min(100,s.camUptime)}%;height:100%;background:${color}"></div></div>
    </div>`;
  }).join('');
}
function ringSvg(value, size){
  const r = (size-8)/2; const c = 2*Math.PI*r;
  const off = c - (Math.min(100,Math.max(0,value))/100)*c;
  const color = value<80 ? 'var(--danger)' : (value<95 ? 'var(--amber)' : 'var(--accent)');
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s ease"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${size<60?12:14}px;font-weight:800;font-family:'Tajawal'">${Math.round(value)}%</div>
  </div>`;
}
function renderDonut(up, down, label){
  const total = up+down;
  const size=120, stroke=16, r=(size-stroke)/2, c=2*Math.PI*r;
  const pct = total? up/total : 0;
  return `<div style="text-align:center">
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${label}</div>
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--danger)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c-c*pct}"/>
    </svg>
    <div style="margin-top:-${size/2+8}px;font-weight:800;font-family:'Tajawal';font-size:17px">${total?Math.round(pct*100):0}%</div>
    <div style="margin-top:${size/2+10}px;font-size:10.5px;color:var(--muted)">${up} تعمل / ${down} منقطعة</div>
  </div>`;
}

/* ============================================================
   SLA / متوسط زمن الإصلاح (من جدول maintenance_log الفعلي)
   ============================================================ */
let maintenanceLogData = [];
async function loadMaintenanceLog(){
  try{
    const { data, error } = await supa.from('maintenance_log').select('*').order('fixed_at', {ascending:false}).limit(200);
    if(error) throw error;
    maintenanceLogData = data || [];
  }catch(e){ console.warn('تعذّر تحميل سجل الصيانة', e); }
}
function calcMTTR(){
  if(!maintenanceLogData.length) return null;
  const avg = maintenanceLogData.reduce((a,x)=>a+Number(x.duration_hours),0)/maintenanceLogData.length;
  const fastest = maintenanceLogData.reduce((min,x)=> Number(x.duration_hours)<Number(min.duration_hours)?x:min, maintenanceLogData[0]);
  return { avg, count: maintenanceLogData.length, fastest };
}
function fmtHours(h){
  if(h<1) return Math.round(h*60)+' دقيقة';
  if(h<24) return h.toFixed(1)+' ساعة';
  return (h/24).toFixed(1)+' يوم';
}
function fmtDateAr(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

/* ============================================================
   تقييم الأداء + الشارات + نقاط الضعف المتكررة + توصية ذكية
   (من واقع بيانات حقيقية من Supabase فقط)
   ============================================================ */
function calcStreak(){
  if(!archiveData.length) return 0;
  const uniqueDates = [...new Set(archiveData.map(a=>a.report_date))].sort().reverse();
  const today = new Date().toISOString().slice(0,10);
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(uniqueDates[0] !== today && uniqueDates[0] !== y) return 0;
  let streak = 1; let cursor = new Date(uniqueDates[0]);
  for(let i=1;i<uniqueDates.length;i++){
    cursor.setDate(cursor.getDate()-1);
    if(uniqueDates[i] === cursor.toISOString().slice(0,10)) streak++; else break;
  }
  return streak;
}
function calcPerformanceScore(){
  const sites = factoriesData.map(computeFactory);
  const t = computeTotals(sites);
  const streak = calcStreak();
  const mttr = calcMTTR();
  const camScore = Math.min(100, t.camUptime);
  const scrScore = Math.min(100, t.scrUptime);
  const streakScore = Math.min(100, streak*3.2);
  let mttrScore = 70;
  if(mttr){ if(mttr.avg<=2) mttrScore=100; else if(mttr.avg<=6) mttrScore=88; else if(mttr.avg<=24) mttrScore=70; else if(mttr.avg<=72) mttrScore=50; else mttrScore=30; }
  const needDoc = sites.filter(s=>s.camerasDown>0||s.screensDown>0);
  const documented = needDoc.filter(s=>s.root_causes && s.root_causes.trim().length>0);
  const docScore = needDoc.length ? (documented.length/needDoc.length*100) : 100;
  const total = camScore*0.35 + scrScore*0.15 + streakScore*0.2 + mttrScore*0.15 + docScore*0.15;
  const score = Math.round(total);
  let grade='D', color='var(--danger)';
  if(score>=95){grade='A+';color='var(--success)';} else if(score>=90){grade='A';color='var(--success)';}
  else if(score>=80){grade='B+';color='var(--accent)';} else if(score>=70){grade='B';color='var(--amber)';}
  else if(score>=60){grade='C';color='var(--amber)';} else {grade='D';color='var(--danger)';}
  return { score, grade, color };
}
function calcBadges(){
  const streak = calcStreak();
  const perf = calcPerformanceScore();
  const mttr = calcMTTR();
  const sites = factoriesData.map(computeFactory);
  const needDoc = sites.filter(s=>s.camerasDown>0||s.screensDown>0);
  const fullyDocumented = needDoc.length>0 && needDoc.every(s=>s.root_causes && s.root_causes.trim().length>0);
  const badges = [];
  if(streak>=7) badges.push({icon:'🔥', label:'التزام 7 أيام'});
  if(streak>=30) badges.push({icon:'🏅', label:'التزام 30 يوم'});
  if(streak>=90) badges.push({icon:'👑', label:'التزام 90 يوم'});
  if(perf.score>=90) badges.push({icon:'🌟', label:'أداء ممتاز'});
  if(mttr && mttr.avg<=2) badges.push({icon:'⚡', label:'إصلاح سريع'});
  if(fullyDocumented) badges.push({icon:'📋', label:'توثيق كامل'});
  return badges;
}
function calcFrequentFailures(){
  const counts = {};
  maintenanceLogData.forEach(m=>{
    const key = m.site_name+' — '+m.camera_name;
    if(!counts[key]) counts[key] = { site:m.site_name, camera:m.camera_name, count:0 };
    counts[key].count++;
  });
  return Object.values(counts).sort((a,b)=>b.count-a.count).slice(0,5).filter(x=>x.count>=2);
}
function generateSmartInsight(){
  const sites = factoriesData.map(computeFactory);
  if(!sites.length) return null;
  const worst = [...sites].sort((a,b)=>a.camUptime-b.camUptime)[0];
  const best = [...sites].sort((a,b)=>b.camUptime-a.camUptime)[0];
  const freq = calcFrequentFailures();
  const parts = [];
  if(worst.camUptime<90) parts.push(`⚠️ ${worst.name} يحتاج متابعة عاجلة (نسبة تشغيل ${fmtPct2(worst.camUptime)}).`);
  else parts.push(`✅ كل المواقع فوق 90% تشغيل — أفضل أداء اليوم في ${best.name} (${fmtPct2(best.camUptime)}).`);
  if(freq.length) parts.push(`🔁 الأكثر تكرارًا للعطل: ${freq[0].camera} في ${freq[0].site} (${freq[0].count} مرات).`);
  return parts.join(' ');
}
function getComparisonWithLastArchive(){
  if(!archiveData.length) return null;
  const last = archiveData[0];
  if(!last.snapshot || !last.snapshot.sites) return null;
  const lastSites = last.snapshot.sites.map(computeFactory);
  const lastTotals = computeTotals(lastSites);
  const currTotals = computeTotals(factoriesData.map(computeFactory));
  return {
    date: last.report_date,
    camDelta: currTotals.camUptime - lastTotals.camUptime,
    scrDelta: currTotals.scrUptime - lastTotals.scrUptime,
    camDownDelta: currTotals.camerasDown - lastTotals.camerasDown,
  };
}
function trendBadge(delta, invert){
  const good = invert ? delta<=0 : delta>=0;
  const arrow = Math.abs(delta)<0.05 ? '▬' : (delta>0?'▲':'▼');
  const color = Math.abs(delta)<0.05 ? 'var(--muted)' : (good?'var(--success)':'var(--danger)');
  return `<span style="color:${color};font-weight:700;font-size:12px">${arrow} ${Math.abs(delta).toFixed(2)}</span>`;
}
function generateCertificate(){
  const perf = calcPerformanceScore();
  const streak = calcStreak();
  const t = computeTotals(factoriesData.map(computeFactory));
  const badges = calcBadges();
  const W=1400, H=990;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#0B1220'); grad.addColorStop(1,'#122038');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#38D9C9'; ctx.lineWidth=4; ctx.strokeRect(30,30,W-60,H-60);
  ctx.strokeStyle='rgba(56,217,201,0.35)'; ctx.lineWidth=1.5; ctx.strokeRect(46,46,W-92,H-92);
  ctx.textAlign='center';
  ctx.fillStyle='#8CA0C4'; ctx.font='600 22px Arial'; ctx.fillText('شركة جهينة للصناعات الغذائية — غرفة المراقبة المركزية', W/2, 120);
  ctx.fillStyle='#38D9C9'; ctx.font='900 30px Tajawal, Arial'; ctx.fillText('C E R T I F I C A T E   O F   E X C E L L E N C E', W/2, 160);
  ctx.fillStyle='#E9EEFB'; ctx.font='900 58px Tajawal, Arial'; ctx.fillText('شهادة تقدير الأداء', W/2, 240);
  ctx.fillStyle='#8CA0C4'; ctx.font='500 20px Arial'; ctx.fillText('تُمنح هذه الشهادة تقديرًا للجهد المتميز في متابعة وتشغيل نظام المراقبة اليومي', W/2, 288);
  ctx.fillStyle='#38D9C9'; ctx.font='900 60px Tajawal, Arial'; ctx.fillText(currentProfile.display_name, W/2, 375);
  ctx.strokeStyle='rgba(56,217,201,0.5)'; ctx.beginPath(); ctx.moveTo(W/2-220,398); ctx.lineTo(W/2+220,398); ctx.stroke();
  function box(x,y,w,h,label,value,color){
    ctx.fillStyle='rgba(255,255,255,0.04)'; roundRectC(ctx,x,y,w,h,14); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.1)'; roundRectC(ctx,x,y,w,h,14); ctx.stroke();
    ctx.fillStyle='#8CA0C4'; ctx.font='500 17px Arial'; ctx.fillText(label, x+w/2, y+32);
    ctx.fillStyle=color; ctx.font='900 40px Tajawal, Arial'; ctx.fillText(value, x+w/2, y+76);
  }
  function roundRectC(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  const bw=(W-5*36)/4, by=440, bh=105;
  box(36,by,bw,bh,'التقييم العام', `${perf.score}/100 (${perf.grade})`, perf.score>=90?'#4ADE80':'#F5A623');
  box(36*2+bw,by,bw,bh,'الالتزام المتواصل', `${streak} يوم`, '#38D9C9');
  box(36*3+bw*2,by,bw,bh,'متوسط تشغيل الكاميرات', fmtPct2(t.camUptime), '#4ADE80');
  box(36*4+bw*3,by,bw,bh,'متوسط تشغيل الشاشات', fmtPct2(t.scrUptime), '#4ADE80');
  ctx.fillStyle='#E9EEFB'; ctx.font='700 22px Tajawal'; ctx.fillText('الشارات المكتسبة', W/2, 600);
  const badgeText = badges.length ? badges.map(b=>b.icon+' '+b.label).join('     ') : 'استمر في الالتزام لفتح شارات إنجاز جديدة';
  ctx.font='500 22px Arial'; ctx.fillStyle='#8CA0C4'; ctx.fillText(badgeText, W/2, 640);
  ctx.fillStyle='#5E6E92'; ctx.font='500 16px Arial'; ctx.fillText(`تاريخ الإصدار: ${new Date().toLocaleDateString('ar-EG')}`, W/2, 850);
  ctx.fillStyle='#38D9C9'; ctx.font='700 18px Tajawal, Arial'; ctx.fillText('نظام تقرير غرفة المراقبة المركزية — إعداد وتشغيل: إبراهيم رمضان', W/2, 890);
  cv.toBlob(async (blob)=>{ await saveOrShareFile(blob, `شهادة-تقدير-${currentProfile.display_name}-${new Date().toISOString().slice(0,10)}.png`, 'image/png'); }, 'image/png', 0.95);
}

function reportPlainText(){

    'تقرير الحالة اليومية لغرفة المراقبة المركزية', 'شركة جهينة للصناعات الغذائية', '',
    `التاريخ: ${fmtDateAr(m.date)}`, `الوردية: ${m.shift}`, `معد التقرير: ${m.preparer||'—'}`, `حالة الغرفة: ${m.roomStatus}`, '',
  ];
  sites.forEach(s=> lines.push(`${s.name}: ${s.camerasUp}/${s.camerasTotal} كاميرا تعمل، ${s.screensUp}/${s.screens} شاشة تعمل، نسبة التشغيل ${fmtPct2(s.camUptime)}`));

async function saveReportToArchive(){
  if(!isAdmin() && !hasPerm('create_report')){ toast('🚫 لا تملك صلاحية حفظ التقارير في الأرشيف'); return; }
  saveReportMetaFromForm();
  const sites = factoriesData.map(computeFactory);
  const t = computeTotals(sites);
  const m = reportMeta;
  const payload = {
    report_date: m.date, report_time: m.time, shift: m.shift, preparer: m.preparer, room_status: m.roomStatus,
    handover: m.handover, snapshot: { sites: factoriesData, totals: t }, report_text: reportPlainText(),
    signature_url: m.signatureDataUrl, gps: m.gps, approved_by: currentProfile.id, approved_at: new Date().toISOString(),
    created_by: currentProfile.id
  };
  try{
    if(!navigator.onLine){ toast('⚠️ لا يمكن حفظ تقرير جديد في الأرشيف وأنت غير متصل — سيتم إعادة المحاولة لاحقًا يدويًا'); return; }
    const {error} = await supa.from('reports_archive').insert(payload);
    if(error) throw error;
    await logAudit('اعتماد تقرير يومي', `${fmtDateAr(m.date)} — ${m.shift}`);
    toast('✅ تم حفظ واعتماد التقرير في الأرشيف');
  }catch(e){ console.error(e); toast('🚫 تعذّر الحفظ — '+(e.message||'')); }
}

async function exportExcelReport(){
  toast('جاري تجهيز ملف Excel...');
  const ok = await ensureExcelLib();
  if(!ok){ toast('⚠️ تعذّر تحميل مكتبة Excel — تحقق من الاتصال بالإنترنت'); return; }
  const sites = factoriesData.map(computeFactory);
  const t = computeTotals(sites);
  const m = reportMeta;
  const border = { top:{style:'thin',color:{argb:'FFC9D3E3'}}, left:{style:'thin',color:{argb:'FFC9D3E3'}}, bottom:{style:'thin',color:{argb:'FFC9D3E3'}}, right:{style:'thin',color:{argb:'FFC9D3E3'}} };
  const wb = new ExcelJS.Workbook();

  // ---- الورقة 1: التقرير اليومي ----

  ws.getCell('A1').alignment={horizontal:'center',vertical:'middle'}; ws.getRow(1).height=28;
  ws.mergeCells('A2:G2'); ws.getCell('A2').value='شركة جهينة للصناعات الغذائية';
  ws.getCell('A2').font={italic:true,size:11,color:{argb:'FFFFFFFF'}}; ws.getCell('A2').fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12716A'}};
  ws.getCell('A2').alignment={horizontal:'center'};
  ws.getCell('A3').value=`التاريخ: ${fmtDateAr(m.date)}`; ws.getCell('D3').value=`الوردية: ${m.shift}`;

  const headers=['المصنع','الشاشات','الشاشات المنقطعة','إجمالي الكاميرات','الكاميرات تعمل','الكاميرات منقطعة','نسبة تشغيل الكاميرات'];
  const hRow = ws.getRow(6);
  headers.forEach((h,i)=>{ const c=hRow.getCell(i+1); c.value=h; c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12716A'}}; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border=border; });
  hRow.height=32;
  sites.forEach((s,i)=>{
    const row = ws.getRow(7+i);
    row.getCell(1).value=s.name; row.getCell(2).value=s.screens; row.getCell(3).value=s.screensDown;
    row.getCell(4).value=s.camerasTotal; row.getCell(5).value=s.camerasUp; row.getCell(6).value=s.camerasDown;
    row.getCell(7).value = s.camerasTotal? s.camerasUp/s.camerasTotal : 0; row.getCell(7).numFmt='0.00%';
    for(let c=1;c<=7;c++){ const cell=row.getCell(c); cell.border=border; cell.alignment={horizontal:c===1?'right':'center'};
      if(i%2===1) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3F7FB'}}; }
    if(s.screensDown>0){ row.getCell(3).font={bold:true,color:{argb:'FFB00020'}}; row.getCell(3).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFDE8E8'}}; }
    if(s.camerasDown>0){ row.getCell(6).font={bold:true,color:{argb:'FFB00020'}}; row.getCell(6).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFDE8E8'}}; }
  });
  const totalRowIdx = 7+sites.length;
  const totalRow = ws.getRow(totalRowIdx);
  totalRow.getCell(1).value='الإجمالي'; totalRow.getCell(2).value=t.screens; totalRow.getCell(3).value=t.screensDown;
  totalRow.getCell(4).value=t.camerasTotal; totalRow.getCell(5).value=t.camerasUp; totalRow.getCell(6).value=t.camerasDown;
  totalRow.getCell(7).value = t.camerasTotal? t.camerasUp/t.camerasTotal:0; totalRow.getCell(7).numFmt='0.00%';
  for(let c=1;c<=7;c++){ const cell=totalRow.getCell(c); cell.font={bold:true,color:{argb:'FFFFFFFF'}}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12716A'}}; cell.border=border; cell.alignment={horizontal:c===1?'right':'center'}; }

  let ry = totalRowIdx+3;
  ws.mergeCells(`A${ry}:G${ry}`); ws.getCell(`A${ry}`).value='المشكلات الجذرية والإجراءات المتخذة';
  ws.getCell(`A${ry}`).font={bold:true,color:{argb:'FFFFFFFF'}}; ws.getCell(`A${ry}`).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B1220'}};
  ws.getCell(`A${ry}`).alignment={horizontal:'center'};
  ry++;
  sites.filter(s=>s.camerasDown>0||s.screensDown>0||s.actions).forEach(s=>{
    ws.mergeCells(`A${ry}:G${ry}`);
    ws.getCell(`A${ry}`).value = `${s.name}: ${s.root_causes||'لم يتم تسجيل المشكلة الجذرية بعد.'}${s.actions?' — الإجراء: '+s.actions:''}`;
    ws.getCell(`A${ry}`).alignment={horizontal:'right',wrapText:true}; ws.getCell(`A${ry}`).font={size:10.5};
    ry++;
  });

  // ---- الورقة 2: تفاصيل الكاميرات المنقطعة ----
  const ws2 = wb.addWorksheet('تفاصيل الكاميرات المنقطعة', {views:[{rightToLeft:true}]});
  ws2.columns = [{width:20},{width:34},{width:16}];
  ws2.addRow(['المصنع','مكان الكاميرا','الحالة']).eachCell(c=>{ c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12716A'}}; c.border=border; });
  sites.forEach(s=>{ (s.down_list||[]).forEach(name=>{ const row=ws2.addRow([s.name, name, 'منقطعة']); row.eachCell(c=>{c.border=border;}); row.getCell(3).font={color:{argb:'FFB00020'},bold:true}; }); });

  const buf = await wb.xlsx.writeBuffer();
  await saveOrShareFile(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `تقرير-${m.date}.xlsx`);
}

/* ============================================================
   تصدير صورة إنفوجرافيك (Canvas — بدون أي مكتبة خارجية)
   ============================================================ */
async function exportImageReport(){
  const sites = factoriesData.map(computeFactory);
  const t = computeTotals(sites);
  const m = reportMeta;
  const rowH = 40;
  const H = 700 + sites.length*rowH + 90;
  const W = 1080;
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#0B1220'); grad.addColorStop(1,'#0E1830');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H); ctx.textAlign='center';

  ctx.fillStyle='#38D9C9'; ctx.font='700 26px Arial'; ctx.fillText('غرفة المراقبة المركزية — جهينة', W/2, 70);
  ctx.fillStyle='#E9EEFB'; ctx.font='900 34px Arial'; ctx.fillText('تقرير الحالة اليومية للمراقبة', W/2, 118);
  ctx.fillStyle='#8CA0C4'; ctx.font='500 20px Arial'; ctx.fillText(`${fmtDateAr(m.date)}  |  ${m.time||''}  |  ${m.shift}`, W/2, 150);

  const cards = [
    ['إجمالي الشاشات', t.screens, '#E9EEFB'],
    ['نسبة تشغيل الشاشات', fmtPct2(t.scrUptime), t.scrUptime>=95?'#4ADE80':'#F5A623'],
    ['إجمالي الكاميرات', t.camerasTotal, '#38D9C9'],
    ['نسبة تشغيل الكاميرات', fmtPct2(t.camUptime), t.camUptime>=90?'#4ADE80':'#F5A623'],
    ['كاميرات منقطعة', t.camerasDown, '#FF6B6B'],
    ['شاشات منقطعة', t.screensDown, '#FF6B6B'],
  ];
  const cardW = (W-3*40)/2, cardH = 100, top = 185;
  cards.forEach(([label,val,color], i)=>{
    const col = i%2, row = Math.floor(i/2);
    const x = 40 + col*(cardW+40), y = top + row*(cardH+16);
    ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(x,y,cardW,cardH);
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.strokeRect(x,y,cardW,cardH);
    ctx.fillStyle='#8CA0C4'; ctx.font='500 19px Arial'; ctx.fillText(label, x+cardW/2, y+34);
    ctx.fillStyle=color; ctx.font='900 38px Arial'; ctx.fillText(String(val), x+cardW/2, y+76);
  });

  let ty = top + 3*(cardH+16) + 26;
  ctx.fillStyle='#E9EEFB'; ctx.font='700 22px Arial'; ctx.fillText('ملخص المصانع', W/2, ty);
  ty += 30;
  const cols = [['الموقع',300],['إجمالي',190],['تعمل',190],['منقطعة',190]];
  ctx.font='700 16px Arial'; ctx.fillStyle='#38D9C9';
  let cx = W-40;
  cols.forEach(([label,w])=>{ cx -= w; ctx.fillText(label, cx+w/2, ty+26); });
  ty += 36;
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(40,ty); ctx.lineTo(W-40,ty); ctx.stroke();
  sites.forEach((s,i)=>{
    const ry = ty + i*rowH;
    if(i%2===0){ ctx.fillStyle='rgba(255,255,255,0.02)'; ctx.fillRect(40, ry, W-80, rowH); }
    ctx.font='600 17px Arial';
    let cx2 = W-40;
    const vals = [s.name, s.camerasTotal, s.camerasUp, s.camerasDown];
    vals.forEach((v,j)=>{
      const w = cols[j][1]; cx2 -= w;
      ctx.fillStyle = j===3 && s.camerasDown>0 ? '#FF6B6B' : (j===2?'#4ADE80':'#E9EEFB');
      ctx.fillText(String(v), cx2+w/2, ry+27);
    });
  });

  ctx.fillStyle='#5E6E92'; ctx.font='500 14px Arial';
  ctx.fillText('تم إعداد التقرير بواسطة غرفة المراقبة المركزية — البيانات فعلية بالكامل بدون أي تقدير', W/2, H-48);
  ctx.fillStyle='#38D9C9'; ctx.font='700 16px Arial';
  ctx.fillText('إعداد وتشغيل النظام: إبراهيم رمضان', W/2, H-20);

  cv.toBlob(async blob=> await saveOrShareFile(blob, `تقرير-مصور-${m.date}.png`), 'image/png', 0.95);
}

/* ============================================================
   التوقيع الإلكتروني (Canvas)
   ============================================================ */
let sigDrawing = false, sigCtx = null;
function initSignaturePad(){
  const cv = document.getElementById('sigPad'); if(!cv) return;
  cv.width = cv.clientWidth; cv.height = 140;
  sigCtx = cv.getContext('2d');
  sigCtx.strokeStyle = '#0B1220'; sigCtx.lineWidth = 2.2; sigCtx.lineCap = 'round';
  const pos = e=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
  const start = e=>{ sigDrawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); };
  const move = e=>{ if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = ()=> sigDrawing=false;
  cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  cv.addEventListener('touchstart', start, {passive:false}); cv.addEventListener('touchmove', move, {passive:false}); cv.addEventListener('touchend', end);
}
function clearSignature(){ const cv=document.getElementById('sigPad'); if(cv&&sigCtx) sigCtx.clearRect(0,0,cv.width,cv.height); reportMeta.signatureDataUrl=null; }
function saveSignature(){
  const cv = document.getElementById('sigPad'); if(!cv) return;
  reportMeta.signatureDataUrl = cv.toDataURL('image/png');
  toast('✅ تم اعتماد التوقيع'); renderCurrentView();
}
function saveTextSignature(){
  const name = document.getElementById('sigTextName').value.trim();
  if(!name){ toast('اكتب اسمك أولًا'); return; }
  const cv = document.createElement('canvas'); cv.width=500; cv.height=140;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#0B1220';
  ctx.font = 'italic 700 42px "Segoe Script","Brush Script MT",cursive, Tajawal, Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, cv.width/2, cv.height/2);
  ctx.strokeStyle = '#0B1220'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(60, cv.height/2+38); ctx.lineTo(cv.width-60, cv.height/2+38); ctx.stroke();
  reportMeta.signatureDataUrl = cv.toDataURL('image/png');
  toast('✅ تم اعتماد التوقيع النصي'); renderCurrentView();
}

async function saveAppSettings(){
  if(!isAdmin()) return;
  const threshold = Math.max(0, parseInt(document.getElementById('st_threshold').value)||0);
  const pct = Math.max(0, Math.min(100, parseInt(document.getElementById('st_pct').value)||0));
  try{
    const {error} = await supa.from('settings').update({alert_threshold:threshold, alert_pct_threshold:pct}).eq('id',1);
    if(error) throw error;
    appSettings.alert_threshold = threshold; appSettings.alert_pct_threshold = pct;
    await logAudit('تعديل إعدادات التنبيهات', `الحد: ${threshold}, النسبة: ${pct}%`);
    toast('✅ تم حفظ الإعدادات'); renderAlertsBar();
  }catch(e){ toast('🚫 تعذّر الحفظ'); }
}

function exportBackupJson(){
  if(!isAdmin()) return;
  const backup = { exportedAt:new Date().toISOString(), factories:factoriesData, settings:appSettings };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  saveOrShareFile(blob, `نسخة-احتياطية-${new Date().toISOString().slice(0,10)}.json`);
  logAudit('تصدير نسخة احتياطية', `${factoriesData.length} مصنع`);
}
async function restoreBackupJson(inputEl){
  if(!isAdmin()){ toast('🚫 الاستعادة متاحة للأدمن فقط'); return; }
  const file = inputEl.files[0]; if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.factories || !Array.isArray(backup.factories)) throw new Error('ملف غير صالح');
    openModal(`
      <div class="modal-head"><h3>⚠️ تأكيد الاستعادة</h3><button class="x-close" onclick="closeModal()">✕</button></div>
      <p style="font-size:13px;color:var(--muted)">هذا الملف يحتوي على ${backup.factories.length} مصنع بتاريخ ${new Date(backup.exportedAt).toLocaleString('ar-EG')}. سيتم تحديث بيانات كل مصنع مطابق بالاسم. هل تريد المتابعة؟</p>
      <button class="btn danger block" onclick="confirmRestore(${JSON.stringify(text).replace(/"/g,'&quot;')})">تأكيد الاستعادة</button>
    `);
  }catch(e){ toast('⚠️ ملف النسخة الاحتياطية غير صالح'); }
}
async function confirmRestore(jsonText){
  try{
    const backup = JSON.parse(jsonText.replace(/&quot;/g,'"'));
    let count=0;
    for(const f of backup.factories){
      const existing = factoriesData.find(x=>x.name===f.name);
      const payload = {name:f.name, screens:f.screens, screens_down:f.screens_down, cameras_total:f.cameras_total, cameras_down:f.cameras_down, down_list:f.down_list||[], root_causes:f.root_causes||'', actions:f.actions||''};
      if(existing) await supa.from('factories').update(payload).eq('id', existing.id);
      else await supa.from('factories').insert({...payload, created_by:currentProfile.id});
      count++;
    }
    await logAudit('استعادة نسخة احتياطية', `${count} مصنع`);
    closeModal(); toast(`✅ تم استعادة ${count} مصنع`); loadFactories();
  }catch(e){ console.error(e); toast('🚫 تعذّرت الاستعادة'); }
}

async function uploadMaintenanceImages(taskId, inputEl){
  if(!isAdmin()){ toast('🚫 الأدمن فقط'); return; }
  const files = Array.from(inputEl.files||[]);
  if(!files.length) return;
  toast(`جاري رفع ${files.length} صورة...`);
  let ok=0;
  for(const file of files){
    try{
      const compressed = await compressImageFile(file);
      const path = `maintenance/${taskId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
      if(upErr) throw upErr;
      const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
      const {error} = await supa.from('maintenance_images').insert({task_id:taskId, image_url:pub.publicUrl, created_by:currentProfile.id});
      if(error) throw error;
      ok++;
    }catch(e){ console.error(e); }
  }
  const {data} = await supa.from('maintenance_images').select('*').order('sort_order');
  maintenanceImagesData = data||[];
  toast(`✅ تم رفع ${ok} صورة`); openMaintenanceGallery(taskId); renderMaintenanceList();
}

    maintenanceImagesData = maintenanceImagesData.filter(x=>x.id!==imageId);
    toast('✅ تم الحذف'); openMaintenanceGallery(taskId); renderMaintenanceList();
  }catch(e){ toast('🚫 تعذّر الحذف'); }

async function saveMaintenanceTask(id){
  if(!isAdmin()) return;
  const payload = {
    target_name: document.getElementById('mt_site').value,
    maintenance_type: document.getElementById('mt_type').value.trim(),
    scheduled_date: document.getElementById('mt_date').value,
    recurrence: document.getElementById('mt_recur').value,
    notes: document.getElementById('mt_notes').value.trim()
  };
  if(!payload.maintenance_type || !payload.scheduled_date){ toast('أدخل نوع الصيانة والموعد'); return; }
  try{
    if(id){

async function removeLegacyCameraPhoto(factoryId, idx){

async function uploadLegacyCameraPhoto(factoryId, idx, inputEl){
  const file = inputEl.files && inputEl.files[0]; if(!file) return;
  toast('جاري رفع الصورة...');
  try{
    const compressed = await compressImageFile(file);
    const path = `legacy/${factoryId}/${idx}_${Date.now()}.jpg`;
    const { error: upErr } = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});

    const { data: pub } = supa.storage.from('camera-photos').getPublicUrl(path);
    const f = factoriesData.find(x=>x.id===factoryId);
    const newPhotos = {...(f.camera_photos||{}), [idx]: pub.publicUrl};
    const { error } = await supa.from('factories').update({camera_photos:newPhotos}).eq('id', factoryId);
    if(error) throw error;
    await logAudit('رفع صورة كاميرا منقطعة', f.name);
    toast('✅ تم رفع الصورة'); await loadFactories();
    openLegacyDownCamerasModal(factoryId);
  }catch(e){
    console.error(e);
    if(e.message && (e.message.includes('policy')||e.code==='42501')) toast('🚫 لا تملك صلاحية رفع الصور (الأدمن فقط)');

async function saveCameraForm(factoryId, camId){
  const name = document.getElementById('cf_name').value.trim();
  if(!name){ toast('أدخل اسم الكاميرا'); return; }
  const newStatus = document.getElementById('cf_status').value;
  const payload = {
    factory_id: factoryId, camera_number: document.getElementById('cf_number').value.trim(),
    camera_name: name, status: newStatus, fault_reason: document.getElementById('cf_reason').value.trim(),
    switch_id: document.getElementById('cf_switch').value || null, port_number: document.getElementById('cf_port').value.trim(),
    responsible: document.getElementById('cf_resp').value.trim(), notes: document.getElementById('cf_notes').value.trim(),
    updated_by: currentProfile.id
  };
  try{
    if(camId){
      const old = camerasData.find(x=>x.id===camId);
      await trackCameraSla(old, newStatus);
      if(newStatus==='عطل' && old.status!=='عطل') payload.fault_date = new Date().toISOString();
      if(newStatus==='تعمل' && old.status==='عطل') payload.repair_date = new Date().toISOString();
      const {error} = await supa.from('cameras').update(payload).eq('id', camId);
      if(error) throw error;
      await logAudit('تعديل كاميرا', `${name} — الحالة: ${newStatus}`, old.status, newStatus);
    } else {
      payload.created_by = currentProfile.id;
      if(newStatus==='عطل') payload.fault_date = new Date().toISOString();
      const {error} = await supa.from('cameras').insert(payload);
      if(error) throw error;
      await logAudit('إضافة كاميرا', name);
    }
    closeModal(); toast('✅ تم الحفظ'); loadCameras(factoryId); loadFactories();
  }catch(e){ console.error(e); toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
async function quickUpdateCameraStatus(camId, newStatus){
  const old = camerasData.find(x=>x.id===camId);
  if(!old) return;
  try{
    await trackCameraSla(old, newStatus);
    const payload = {status:newStatus, updated_by:currentProfile.id};
    if(newStatus==='عطل' && old.status!=='عطل') payload.fault_date = new Date().toISOString();
    if(newStatus==='تعمل' && old.status==='عطل') payload.repair_date = new Date().toISOString();
    const {error} = await supa.from('cameras').update(payload).eq('id', camId);
    if(error) throw error;
    await logAudit('تغيير حالة كاميرا', old.camera_name, old.status, newStatus);
    toast('✅ تم التحديث'); loadCameras(old.factory_id); loadFactories();
  }catch(e){ toast('🚫 تعذّر التحديث'); }
}
async function trackCameraSla(oldCam, newStatus){
  if(oldCam.status==='عطل' && newStatus==='تعمل' && oldCam.fault_date){
    const hrs = Math.max(0.01, (Date.now()-new Date(oldCam.fault_date).getTime())/3600000);
    try{ await supa.from('maintenance_log').insert({ factory_id:oldCam.factory_id, site_name:factoriesData.find(f=>f.id===oldCam.factory_id)?.name||'', camera_name:oldCam.camera_name, down_since:oldCam.fault_date, fixed_at:new Date().toISOString(), duration_hours:hrs }); }
    catch(e){ console.warn('تعذّر تسجيل SLA', e); }
  }
}

        <div class="mini"><div class="n" style="font-size:11px">${relatedSwitch?relatedSwitch.switch_name:'—'}</div><div class="t">Switch</div></div>
      </div>
      ${cam.fault_reason? `<p style="font-size:12px;color:var(--muted);margin-top:8px"><b>سبب العطل الحالي:</b> ${cam.fault_reason}</p>`:''}
