    <div class="section-title" style="margin-top:12px"><h2 style="font-size:13px">📋 الأعطال السابقة (${relatedFaults.length})</h2></div>
    ${relatedFaults.length ? relatedFaults.slice(0,10).map(f=>`
      <div class="site-card" style="padding:8px 12px">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span>${f.fault_type||'—'} <span class="pill ${FAULT_SEVERITY_COLOR[f.severity]}">${f.severity}</span></span>
          <span class="pill ${f.status==='مغلق'||f.status==='تم الإصلاح'?'ok':'bad'}">${f.status}</span>
        </div>
        <div style="font-size:10.5px;color:var(--muted-2);margin-top:3px">${new Date(f.reported_at).toLocaleDateString('ar-EG')}</div>
      </div>`).join('') : `<div class="empty">لا توجد أعطال مسجّلة لهذه الكاميرا.</div>`}

    <div class="section-title"><h2 style="font-size:13px">🛠️ سجل الصيانة/الإصلاح (${relatedMaint.length})</h2></div>
    ${relatedMaint.length ? relatedMaint.slice(0,10).map(m=>`
      <div class="site-card" style="padding:8px 12px;font-size:12px">
        أُصلحت خلال ${fmtHours(Number(m.duration_hours))} — ${new Date(m.fixed_at).toLocaleDateString('ar-EG')}
      </div>`).join('') : `<div class="empty">لا يوجد سجل صيانة سابق.</div>`}

    ${relatedSwitch ? `<div class="section-title"><h2 style="font-size:13px">🔌 بيانات الشبكة</h2></div>
    <div class="site-card" style="font-size:12px">متصلة بـ <b>${relatedSwitch.switch_name}</b> (${relatedSwitch.switch_type||''}) — ${relatedSwitch.used_ports||0}/${relatedSwitch.total_ports||0} منفذ مستخدم</div>` : ''}

    <button class="btn primary block" style="margin-top:10px" onclick="downloadCameraQR('${cam.id}')">📱 QR الكاميرا</button>
  `;
}
async function downloadCameraQR(camId){
  const cam = camerasData.find(x=>x.id===camId);
  if(!cam) return;
  const ok = await ensureQrLib();
  if(!ok){ toast('⚠️ تعذّر تحميل مكتبة QR'); return; }
  const factory = factoriesData.find(f=>f.id===cam.factory_id);
  const text = `كاميرا: ${cam.camera_name}\nرقم: ${cam.camera_number||'—'}\nالمصنع: ${factory?factory.name:''}\nالحالة: ${cam.status}`;
  openModal(`
    <div class="modal-head"><h3>📱 QR — ${cam.camera_name}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div style="display:flex;justify-content:center;padding:14px;background:#fff;border-radius:14px" id="camQrHost"></div>
    <button class="btn primary block" style="margin-top:10px" onclick="downloadCamQrImage()">⬇️ حفظ الصورة</button>
  `);
  setTimeout(()=>{ const host=document.getElementById('camQrHost'); if(host){ host.innerHTML=''; try{ new QRCode(host,{text,width:220,height:220}); }catch(e){} } }, 50);
}
function downloadCamQrImage(){
  const canvas = document.querySelector('#camQrHost canvas');
  if(!canvas){ toast('لم يتم إنشاء الصورة بعد'); return; }
  canvas.toBlob(blob=> saveOrShareFile(blob, `QR-كاميرا-${Date.now()}.png`));
}

/* ============================================================
   البحث الشامل (Global Search) — يدوّر في كل أقسام التطبيق مرة واحدة
   ============================================================ */
function openGlobalSearch(){
  openModal(`
    <div class="modal-head"><h3>🔍 بحث شامل</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="field"><input class="input" id="globalSearchInput" placeholder="اكتب اسم كاميرا، مصنع، صنف، سويتش..." oninput="runGlobalSearch(this.value)" autofocus></div>
    <div id="globalSearchResults"><p style="font-size:11px;color:var(--muted-2);text-align:center;margin-top:10px">اكتب حرفين على الأقل للبحث في: المصانع، الكاميرات، الشاشات، الأعطال، المخزن، Racks، Switches، UPS، الصيانة، احتياجات الغرفة.</p></div>
  `);
  setTimeout(()=>document.getElementById('globalSearchInput')?.focus(), 100);
}
let globalSearchDebounce = null;
function runGlobalSearch(q){
  clearTimeout(globalSearchDebounce);
  if(q.trim().length<2){ document.getElementById('globalSearchResults').innerHTML = '<p style="font-size:11px;color:var(--muted-2);text-align:center;margin-top:10px">اكتب حرفين على الأقل...</p>'; return; }
  globalSearchDebounce = setTimeout(()=> executeGlobalSearch(q.trim()), 300);
}
async function executeGlobalSearch(q){
  const host = document.getElementById('globalSearchResults');
  if(!host) return;
  host.innerHTML = '<div class="empty">جاري البحث...</div>';
  const results = [];
  const factoryMatches = factoriesData.filter(f=>f.name.includes(q));
  factoryMatches.forEach(f=> results.push({cat:'🏭 مصانع', label:f.name, action:`goTo('factories')`}));

  try{
    const {data} = await supa.from('cameras').select('*').ilike('camera_name', `%${q}%`).limit(15);
    (data||[]).forEach(c=>{ const f=factoriesData.find(x=>x.id===c.factory_id); results.push({cat:'🎥 كاميرات', label:`${c.camera_name} (${f?f.name:''})`, action:`goTo('cameras','${c.factory_id}')`}); });
  }catch(e){}
  try{
    const {data} = await supa.from('screens').select('*').ilike('screen_name', `%${q}%`).limit(15);
    (data||[]).forEach(s=>{ const f=factoriesData.find(x=>x.id===s.factory_id); results.push({cat:'🖥️ شاشات', label:`${s.screen_name} (${f?f.name:''})`, action:`goTo('screens','${s.factory_id}')`}); });
  }catch(e){}
  try{
    const {data} = await supa.from('faults').select('*').ilike('device_name', `%${q}%`).limit(15);
    (data||[]).forEach(f=> results.push({cat:'📋 أعطال', label:`${f.device_name} — ${f.status}`, action:`goTo('faults')`}));
  }catch(e){}
  try{
    const {data} = await supa.from('store_items').select('*').ilike('item_name', `%${q}%`).limit(15);
    (data||[]).forEach(it=> results.push({cat:'📦 مخزن', label:it.item_name, action:`goTo('store')`}));
  }catch(e){}
  try{
    const {data} = await supa.from('factory_servers').select('*').or(`server_name.ilike.%${q}%,ip_address.ilike.%${q}%,hostname.ilike.%${q}%,serial_number.ilike.%${q}%,mac_address.ilike.%${q}%`).limit(15);
    (data||[]).forEach(s=>{ const f=factoriesData.find(x=>x.id===s.factory_id); results.push({cat:'🖥️ سيرفرات', label:`${s.server_name} (${f?f.name:''})`, action:`openServerProfile('${s.id}')`}); });
  }catch(e){}
  try{
    const {data} = await supa.from('factory_switches').select('*').ilike('switch_name', `%${q}%`).limit(10);
    (data||[]).forEach(sw=>{ const f=factoriesData.find(x=>x.id===sw.factory_id); results.push({cat:'🔌 Switches', label:`${sw.switch_name} (${f?f.name:''})`, action:`goTo('network','${sw.factory_id}')`}); });
  }catch(e){}
  try{
    const {data} = await supa.from('factory_racks').select('*').ilike('rack_name', `%${q}%`).limit(10);
    (data||[]).forEach(r=>{ const f=factoriesData.find(x=>x.id===r.factory_id); results.push({cat:'🗄️ Racks', label:`${r.rack_name} (${f?f.name:''})`, action:`goTo('network','${r.factory_id}')`}); });
  }catch(e){}
  try{
    const {data} = await supa.from('factory_ups').select('*').ilike('ups_name', `%${q}%`).limit(10);
    (data||[]).forEach(u=>{ const f=factoriesData.find(x=>x.id===u.factory_id); results.push({cat:'🔋 UPS', label:`${u.ups_name} (${f?f.name:''})`, action:`goTo('ups','${u.factory_id}')`}); });
  }catch(e){}
  try{
    const {data} = await supa.from('preventive_maintenance').select('*').ilike('maintenance_type', `%${q}%`).limit(10);
    (data||[]).forEach(m=> results.push({cat:'🛠️ صيانة وقائية', label:`${m.target_name} — ${m.maintenance_type}`, action:`goTo('maintenance')`}));
  }catch(e){}
  try{
    const {data} = await supa.from('room_needs').select('*').ilike('title', `%${q}%`).limit(10);
    (data||[]).forEach(r=> results.push({cat:'📋 احتياجات الغرفة', label:r.title, action:`goTo('roomneeds')`}));
  }catch(e){}

  if(!results.length){ host.innerHTML = '<div class="empty">لا توجد نتائج مطابقة.</div>'; return; }
  const grouped = {};
  results.forEach(r=>{ if(!grouped[r.cat]) grouped[r.cat]=[]; grouped[r.cat].push(r); });
  host.innerHTML = Object.entries(grouped).map(([cat, items])=>`
    <div style="margin-top:10px">
      <div style="font-size:11px;color:var(--accent);font-weight:700;margin-bottom:4px">${cat} (${items.length})</div>
      ${items.map(it=>`<div class="site-card" style="padding:8px 12px;cursor:pointer;margin-bottom:6px" onclick='closeModal(); ${it.action}'>${it.label}</div>`).join('')}
    </div>`).join('');
}

/* ============================================================
   شاشة: إدارة الشاشات الفردية لكل مصنع
   ============================================================ */
let screensRecordsData = [];
function renderScreensPlaceholder(factoryId){
  const f = factoriesData.find(x=>x.id===factoryId);
  return `<div class="view active">
    <div class="section-title" style="margin-top:0"><h2>🖥️ شاشات: ${f?f.name:'—'}</h2>
      ${isAdmin()? `<button class="btn primary sm" onclick="openScreenForm('${factoryId}')">+ إضافة شاشة</button>`:''}
    </div>
    <button class="btn sm" onclick="goTo('factories')">→ رجوع للمصانع</button>
    <div id="screensListHost" style="margin-top:12px"><div class="empty">جاري التحميل...</div></div>
  </div>`;
}
async function loadScreens(factoryId){
  try{
    const {data, error} = await supa.from('screens').select('*').eq('factory_id', factoryId).order('screen_name');
    if(error) throw error;
    screensRecordsData = data||[];
  }catch(e){ console.error(e); screensRecordsData=[]; }
  const host = document.getElementById('screensListHost');
  if(!host) return;
  if(!screensRecordsData.length){
    const f = factoriesData.find(x=>x.id===factoryId);
    const manualTotal = f ? (f.screens||0) : 0;
    host.innerHTML = manualTotal>0
      ? `<div class="empty" style="text-align:right;line-height:1.9">
          💡 هذا المصنع يستخدم حاليًا <b>الأرقام الإجمالية اليدوية</b> (${manualTotal} شاشة مسجّلة من "تعديل المصنع")، ولا توجد بعد سجلات فردية لكل شاشة هنا.
          <br>ده وضع طبيعي وسليم — الأرقام الإجمالية شغّالة عادي في التقارير والداشبورد.
          ${isAdmin()? '<br><br>لو حبيت تتابع كل شاشة لوحدها، ابدأ بإضافتها من الزرار فوق.':''}
        </div>`
      : '<div class="empty">لا توجد شاشات مسجّلة بعد.</div>';
    return;
  }
  host.innerHTML = screensRecordsData.map(s=>`
    <div class="site-card">
      <div class="site-name" style="font-size:14px">${s.screen_name}</div>
      ${s.fault_reason? `<div class="site-meta">السبب: ${s.fault_reason}</div>`:''}
      <div style="margin-top:8px">
        ${isAdmin() ? `<select class="input" style="font-size:12px;padding:6px 8px" onchange="quickUpdateScreenStatus('${s.id}', this.value)">
          ${['تعمل','عطل','تحت الصيانة'].map(st=>`<option ${s.status===st?'selected':''}>${st}</option>`).join('')}
        </select>` : `<span class="pill ${s.status==='تعمل'?'ok':'bad'}">${s.status}</span>`}
      </div>
      ${isAdmin()? `<div class="btn-row">
        <button class="btn sm" onclick="openScreenForm('${s.factory_id}','${s.id}')">✏️ تعديل</button>
        <button class="btn sm danger" onclick="deleteScreenRecord('${s.id}','${s.factory_id}')">🗑</button>
      </div>`:''}
    </div>`).join('');
}
function openScreenForm(factoryId, screenId){
  const isNew = !screenId;
  const f = factoriesData.find(x=>x.id===factoryId);
  if(isNew && f && !f.use_individual_screens && (f.screens||0)>0){
    openModal(`
      <div class="modal-head"><h3>⚠️ تنبيه مهم قبل المتابعة</h3><button class="x-close" onclick="closeModal()">✕</button></div>
      <p style="font-size:13px;line-height:1.9;color:var(--text)">
        هذا المصنع يستخدم حاليًا <b>الأرقام الإجمالية اليدوية</b> (${f.screens} شاشة).<br><br>
        لو بدأت تضيف شاشات فردية، هيتحوّل المصنع تلقائيًا لوضع <b>"التتبع الفردي"</b>، وهيبقى إجمالي الشاشات = عدد السجلات الفردية بس.<br><br>
        <b style="color:var(--amber)">تأكد إنك عايز تضيف كل الـ${f.screens} شاشة فرديًا فعلًا قبل ما تكمل.</b>
      </p>
      <button class="btn primary block" onclick="confirmSwitchToIndividualScreens('${factoryId}')">فهمت، كمّل بإضافة الشاشة</button>
      <button class="btn block" style="margin-top:8px" onclick="closeModal()">إلغاء</button>
    `);
    return;
  }
  renderScreenFormModal(factoryId, screenId);
}
async function confirmSwitchToIndividualScreens(factoryId){
  try{ await supa.from('factories').update({use_individual_screens:true}).eq('id',factoryId); }catch(e){ console.warn(e); }
  renderScreenFormModal(factoryId, null);
}
function renderScreenFormModal(factoryId, screenId){
  const s = screenId ? screensRecordsData.find(x=>x.id===screenId) : null;
  const isNew = !s;
  const d = s || {screen_number:'', screen_name:'', status:'تعمل', fault_reason:'', notes:''};
  openModal(`
    <div class="modal-head"><h3>${isNew?'إضافة شاشة':'تعديل شاشة'}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="row2">
      <div class="field"><label>رقم الشاشة</label><input class="input" id="sf_number" value="${d.screen_number||''}"></div>
      <div class="field"><label>الحالة</label><select class="input" id="sf_status">${['تعمل','عطل','تحت الصيانة'].map(st=>`<option ${d.status===st?'selected':''}>${st}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>اسم الشاشة</label><input class="input" id="sf_name" value="${d.screen_name}"></div>
    <div class="field"><label>سبب العطل</label><input class="input" id="sf_reason" value="${d.fault_reason||''}"></div>
    <div class="field"><label>ملاحظات</label><textarea class="input" id="sf_notes">${d.notes||''}</textarea></div>
    <button class="btn primary block" onclick="saveScreenForm('${factoryId}','${isNew?'':screenId}')">💾 حفظ</button>
  `);
}
async function saveScreenForm(factoryId, screenId){
  const name = document.getElementById('sf_name').value.trim();
  if(!name){ toast('أدخل اسم الشاشة'); return; }
  const payload = {
    factory_id: factoryId, screen_number: document.getElementById('sf_number').value.trim(),
    screen_name: name, status: document.getElementById('sf_status').value,
    fault_reason: document.getElementById('sf_reason').value.trim(), notes: document.getElementById('sf_notes').value.trim()
  };
  try{
    if(screenId){ const {error} = await supa.from('screens').update(payload).eq('id', screenId); if(error) throw error; await logAudit('تعديل شاشة', name); }
    else { payload.created_by = currentProfile.id; const {error} = await supa.from('screens').insert(payload); if(error) throw error; await logAudit('إضافة شاشة', name); }
    closeModal(); toast('✅ تم الحفظ'); loadScreens(factoryId); loadFactories();
  }catch(e){ toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
async function quickUpdateScreenStatus(screenId, newStatus){
  try{
    await supa.from('screens').update({status:newStatus}).eq('id', screenId);
    const s = screensRecordsData.find(x=>x.id===screenId);
    await logAudit('تغيير حالة شاشة', s?s.screen_name:screenId, s?.status, newStatus);
    toast('✅ تم التحديث'); loadScreens(s.factory_id); loadFactories();
  }catch(e){ toast('🚫 تعذّر التحديث'); }
}
async function deleteScreenRecord(screenId, factoryId){
  try{ await supa.from('screens').delete().eq('id', screenId); await logAudit('حذف شاشة', screenId); toast('تم الحذف'); loadScreens(factoryId); loadFactories(); }
  catch(e){ toast('🚫 تعذّر الحذف'); }
}

/* ============================================================
   شاشة: الأعطال (سجل مستقل بدرجة الخطورة و SLA)
   ============================================================ */
let faultsData = [];
let faultsFilter = { text:'', factory:'', status:'', severity:'' };
function renderFaultsPlaceholder(){
  return `<div class="view active">
    <div class="section-title" style="margin-top:0"><h2>📋 الأعطال</h2>
      ${isAdmin()? `<button class="btn primary sm" onclick="openFaultForm()">+ تسجيل عطل</button>`:''}
    </div>
    <div class="field"><input class="input" placeholder="🔍 بحث باسم الجهاز أو النوع..." value="${faultsFilter.text}" oninput="faultsFilter.text=this.value; renderFaultsList()"></div>
    <div class="row2">
      <div class="field"><select class="input" onchange="faultsFilter.factory=this.value; renderFaultsList()">
        <option value="">كل المصانع</option>${factoriesData.map(s=>`<option value="${s.id}" ${faultsFilter.factory===s.id?'selected':''}>${s.name}</option>`).join('')}
      </select></div>
      <div class="field"><select class="input" onchange="faultsFilter.severity=this.value; renderFaultsList()">
        <option value="">كل درجات الخطورة</option><option>عالية</option><option>متوسطة</option><option>منخفضة</option>
      </select></div>
    </div>
    <div class="field"><select class="input" onchange="faultsFilter.status=this.value; renderFaultsList()">
      <option value="">كل الحالات</option>${['مفتوح','جاري الإصلاح','تم الإصلاح','مغلق','متوقف بانتظار قطع غيار'].map(s=>`<option>${s}</option>`).join('')}
    </select></div>
    <div id="faultsListHost"><div class="empty">جاري التحميل...</div></div>
  </div>`;
}
const FAULT_SEVERITY_COLOR = {'عالية':'bad','متوسطة':'warn','منخفضة':'ok'};
async function loadFaults(){
  try{
    const {data, error} = await supa.from('faults').select('*').order('reported_at',{ascending:false}).limit(300);
    if(error) throw error;
    faultsData = data||[];
  }catch(e){
    console.warn('تعذّر تحميل الأعطال', e);
    const host = document.getElementById('faultsListHost');
    if(host) host.innerHTML = `<div class="empty">⚠️ تعذّر تحميل بيانات الأعطال: ${e.message||'تحقق من تفعيل جدول faults'}</div>`;
    return;
  }
  try{ const {data} = await supa.from('fault_images').select('*').order('sort_order'); faultImagesData = data||[]; }
  catch(e){ faultImagesData = []; }
  renderFaultsList();
}
let faultImagesData = [];
function getFaultImages(faultId){ return faultImagesData.filter(im=>im.fault_id===faultId); }
function renderFaultsList(){
  const host = document.getElementById('faultsListHost');
  if(!host) return;
  const f = faultsFilter;
  const list = faultsData.filter(x=>
    (!f.text || x.device_name.includes(f.text) || (x.fault_type||'').includes(f.text)) &&
    (!f.factory || x.factory_id===f.factory) && (!f.status || x.status===f.status) && (!f.severity || x.severity===f.severity)
  );
  if(!list.length){ host.innerHTML='<div class="empty">لا توجد نتائج مطابقة.</div>'; return; }
  host.innerHTML = list.map(f=>{
    const responseMin = f.response_started_at ? Math.round((new Date(f.response_started_at)-new Date(f.reported_at))/60000) : null;
    const repairHrs = f.resolved_at ? ((new Date(f.resolved_at)-new Date(f.reported_at))/3600000).toFixed(1) : null;
    const factoryName = factoriesData.find(s=>s.id===f.factory_id)?.name || '';
    const images = getFaultImages(f.id);
    return `<div class="site-card">
      <div style="display:flex;justify-content:space-between">
        <div class="site-name" style="font-size:14px">${f.device_name} <span class="pill ${FAULT_SEVERITY_COLOR[f.severity]}" style="margin-right:6px">${f.severity}</span></div>
        <span class="pill ${f.status==='مغلق'||f.status==='تم الإصلاح'?'ok':(f.status==='مفتوح'?'bad':'warn')}">${f.status}</span>
      </div>
      <div class="site-meta">${factoryName} ${f.fault_type?'· '+f.fault_type:''} ${f.description?'— '+f.description:''}</div>
      <div style="font-size:11px;color:var(--muted-2);margin-top:6px">أُبلغ عنه: ${new Date(f.reported_at).toLocaleString('ar-EG')}
        ${responseMin!=null?` · زمن الاستجابة: ${responseMin} دقيقة`:''}${repairHrs!=null?` · زمن الإصلاح: ${repairHrs} ساعة`:''}</div>
      ${images.length ? `<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto">
        ${images.slice(0,5).map((im,i)=>`<img src="${im.image_url}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;cursor:zoom-in" onclick='openGalleryLightbox(${JSON.stringify(images.map(x=>x.image_url))},${i})'>`).join('')}
      </div>` : ''}
      <div class="btn-row" style="margin-top:8px">
        <button class="btn sm" onclick="openFaultGallery('${f.id}')">🖼️ الصور (${images.length})</button>
        ${isAdmin() ? `<select class="input" style="font-size:12px;padding:6px 8px;width:auto" onchange="updateFaultStatus('${f.id}', this.value)">
          ${['مفتوح','جاري الإصلاح','تم الإصلاح','مغلق','متوقف بانتظار قطع غيار'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn sm" onclick="openFaultForm('${f.id}')">✏️ تعديل</button>
        <button class="btn sm danger" onclick="deleteFault('${f.id}')">🗑 حذف</button>` : ''}
      </div>
    </div>`;
  }).join('');
}
function openFaultGallery(faultId){
  const f = faultsData.find(x=>x.id===faultId);
  const images = getFaultImages(faultId);
  openModal(`
    <div class="modal-head"><h3>🖼️ صور العطل: ${f.device_name}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    ${isAdmin() ? `<div id="faultGalleryDropzone" style="border:2px dashed var(--border);border-radius:12px;padding:16px;text-align:center;margin-bottom:12px">
      <label class="btn primary sm" style="cursor:pointer">📷 إضافة صور<input type="file" accept="image/*" multiple style="display:none" onchange="uploadFaultImages('${faultId}', this)"></label>
    </div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${images.length===0 ? `<div class="empty" style="grid-column:1/-1">لا توجد صور بعد.</div>` :
        images.map((im,i)=>`
        <div style="position:relative">
          <img src="${im.image_url}" style="width:100%;height:90px;object-fit:cover;border-radius:8px;cursor:zoom-in" onclick='openGalleryLightbox(${JSON.stringify(images.map(x=>x.image_url))},${i})'>
          ${isAdmin()? `<button onclick="deleteFaultImage('${im.id}','${faultId}')" style="position:absolute;top:4px;left:4px;background:rgba(255,60,60,.9);color:#fff;border:none;width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer">🗑</button>`:''}
        </div>`).join('')}
    </div>
  `);
}
async function uploadFaultImages(faultId, inputEl){
  if(!isAdmin()){ toast('🚫 الأدمن فقط'); return; }
  const files = Array.from(inputEl.files||[]);
  if(!files.length) return;
  toast(`جاري رفع ${files.length} صورة...`);
  let ok=0;
  for(const file of files){
    try{
      const compressed = await compressImageFile(file);
      const path = `faults/${faultId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
      if(upErr) throw upErr;
      const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
      const {error} = await supa.from('fault_images').insert({fault_id:faultId, image_url:pub.publicUrl, created_by:currentProfile.id});
      if(error) throw error;
      ok++;
    }catch(e){ console.error(e); }
  }
  const {data} = await supa.from('fault_images').select('*').order('sort_order');
  faultImagesData = data||[];
  toast(`✅ تم رفع ${ok} صورة`); openFaultGallery(faultId); renderFaultsList();
}
async function deleteFaultImage(imageId, faultId){
  if(!isAdmin()){ toast('🚫 الأدمن فقط'); return; }
  try{
    await supa.from('fault_images').delete().eq('id', imageId);
    faultImagesData = faultImagesData.filter(x=>x.id!==imageId);
    toast('✅ تم الحذف'); openFaultGallery(faultId); renderFaultsList();
  }catch(e){ toast('🚫 تعذّر الحذف'); }
}
function openFaultForm(id){

    <div class="field"><label>المصنع</label><select class="input" id="ft_factory">${factoriesData.map(s=>`<option value="${s.id}" ${d.factory_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>

      <div class="field"><label>درجة الخطورة</label><select class="input" id="ft_severity">${['عالية','متوسطة','منخفضة'].map(s=>`<option ${d.severity===s?'selected':''}>${s}</option>`).join('')}</select></div>

  `);

async function saveFaultForm(id){
  const payload = {
    factory_id: document.getElementById('ft_factory').value,
    device_type: document.getElementById('ft_devtype').value,
    device_name: document.getElementById('ft_devname').value.trim(),
    fault_type: document.getElementById('ft_type').value.trim(),
    severity: document.getElementById('ft_severity').value,
    description: document.getElementById('ft_desc').value.trim(),
    responsible: document.getElementById('ft_resp').value.trim()
  };
  if(!payload.device_name){ toast('أدخل اسم الجهاز'); return; }
  try{
    if(id){
      const {error} = await supa.from('faults').update(payload).eq('id', id);
      if(error) throw error;
      await logAudit('تعديل بيانات عطل', payload.device_name);
    } else {
      payload.created_by = currentProfile.id;
      const {error} = await supa.from('faults').insert(payload);
      if(error) throw error;
      await logAudit('تسجيل عطل جديد', `${payload.device_name} — ${payload.severity}`);
    }
    closeModal(); toast('✅ تم الحفظ'); loadFaults();
  }catch(e){ console.error(e); toast('🚫 تعذّر الحفظ: '+(e.message||'خطأ غير معروف')); }
}
async function updateFaultStatus(id, newStatus){
  const f = faultsData.find(x=>x.id===id);
  if(!f) return;
  const payload = {status:newStatus};
  if(newStatus==='جاري الإصلاح' && !f.response_started_at) payload.response_started_at = new Date().toISOString();
  if((newStatus==='تم الإصلاح' || newStatus==='مغلق') && !f.resolved_at) payload.resolved_at = new Date().toISOString();
  try{
    const {error} = await supa.from('faults').update(payload).eq('id', id);
    if(error) throw error;
    await logAudit('تحديث حالة عطل', f.device_name, f.status, newStatus);
    toast('✅ تم التحديث'); loadFaults();
  }catch(e){ console.error(e); toast('🚫 تعذّر التحديث: '+(e.message||'')); }
}
function deleteFault(id){
  openModal(`<div class="modal-head"><h3>تأكيد الحذف</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <p style="font-size:13px;color:var(--muted)">حذف سجل هذا العطل نهائيًا؟</p>
    <button class="btn danger block" onclick="confirmDeleteFault('${id}')">حذف نهائيًا</button>`);
}
async function confirmDeleteFault(id){
  try{
    const {error} = await supa.from('faults').delete().eq('id', id);
    if(error) throw error;
    await logAudit('حذف سجل عطل', id); closeModal(); toast('✅ تم الحذف'); loadFaults();
  }catch(e){ console.error(e); toast('🚫 تعذّر الحذف: '+(e.message||'')); }
}

/* ============================================================
   الوحدة 1: مشتملات ومخزن الغرفة المركزية
   ============================================================ */
let storeItemsData = [];
let storeTransactionsData = [];
let storeFilterText = '';
function computeItemBalance(itemId){
  return storeTransactionsData.filter(t=>t.item_id===itemId).reduce((bal,t)=> bal + (t.in_qty||0) - (t.out_qty||0), 0);
}
function renderStorePlaceholder(){
  if(!isAdmin() && !hasPerm('view_store')) return `<div class="view active"><div class="empty">🚫 لا تملك صلاحية عرض المخزن. تواصل مع الأدمن لتفعيلها.</div></div>`;
  return `<div class="view active">
    <div class="section-title" style="margin-top:0"><h2>📦 مشتملات ومخزن الغرفة</h2>
      ${isAdmin()? `<button class="btn primary sm" onclick="openStoreItemForm()">+ إضافة صنف</button>`:''}
    </div>
    <div id="storeSummaryHost"></div>
    <div class="field"><input class="input" placeholder="🔍 ابحث باسم الصنف أو النوع..." value="${storeFilterText}" oninput="onStoreSearch(this.value)"></div>
    ${isAdmin()? `<div class="btn-row" style="margin-bottom:8px">
      <button class="btn sm" onclick="exportStoreExcel()">📊 Excel</button>
      <button class="btn sm" onclick="exportStorePdf()">🧾 PDF</button>
      <button class="btn sm" onclick="window.print()">🖨️ طباعة</button>
    </div>`:''}
    <div id="storeListHost"><div class="empty">جاري التحميل...</div></div>
  </div>`;
}
let storeItemImagesData = [];
async function loadStoreData(){
  try{
    const [{data: items, error: e1}, {data: txns, error: e2}] = await Promise.all([
      supa.from('store_items').select('*').order('item_name'),
      supa.from('store_transactions').select('*').order('transaction_date',{ascending:false})
    ]);
    if(e1) throw e1; if(e2) throw e2;
    storeItemsData = items||[]; storeTransactionsData = txns||[];
  }catch(e){
    console.warn('تعذّر تحميل المخزن', e);
    const host = document.getElementById('storeListHost');
    if(host) host.innerHTML = `<div class="empty">⚠️ هذه الميزة تحتاج تشغيل ملف schema_part4.sql في Supabase أولًا.</div>`;
    return;
  }
  try{
    const {data: imgs, error: e3} = await supa.from('store_item_images').select('*').order('sort_order');
    if(e3) throw e3;
    storeItemImagesData = imgs||[];
  }catch(e){ storeItemImagesData = []; /* صور الأصناف تحتاج schema_part5.sql — لا تمنع باقي المخزن من العمل */ }
  renderStoreSummary();
  renderStoreList();
}
function getItemImages(itemId){ return storeItemImagesData.filter(im=>im.item_id===itemId); }
function renderStoreSummary(){
  const host = document.getElementById('storeSummaryHost');
  if(!host) return;
  const totalIn = storeTransactionsData.reduce((a,t)=>a+(t.in_qty||0),0);
  const totalOut = storeTransactionsData.reduce((a,t)=>a+(t.out_qty||0),0);
  host.innerHTML = `<div class="stat-grid" style="margin-bottom:10px">
    <div class="stat-card"><div class="label">عدد الأصناف</div><div class="value">${storeItemsData.length}</div></div>
    <div class="stat-card success"><div class="label">إجمالي الوارد</div><div class="value">${totalIn}</div></div>
    <div class="stat-card danger"><div class="label">إجمالي الصادر</div><div class="value">${totalOut}</div></div>
    <div class="stat-card accent"><div class="label">الرصيد الإجمالي</div><div class="value">${totalIn-totalOut}</div></div>
  </div>`;
}
function onStoreSearch(v){ storeFilterText=v; renderStoreList(); }
function renderStoreList(){
  const host = document.getElementById('storeListHost');
  if(!host) return;
  const q = storeFilterText.trim();
  const items = storeItemsData.filter(i=> i.item_name.includes(q) || (i.item_type||'').includes(q));
  if(!items.length){ host.innerHTML = '<div class="empty">لا توجد أصناف مطابقة.</div>'; return; }
  host.innerHTML = items.map(item=>{
    const balance = computeItemBalance(item.id);
    const txns = storeTransactionsData.filter(t=>t.item_id===item.id).slice(0,5);
    const images = getItemImages(item.id);
    return `<div class="site-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="site-name" style="font-size:14px">${item.item_name}</div><div class="site-meta">${item.item_type||'—'}</div></div>
        <span class="pill ${balance>0?'ok':'bad'}" style="font-size:13px;font-weight:800">الرصيد: ${balance}</span>
      </div>
      ${item.notes? `<p style="font-size:11px;color:var(--muted);margin-top:6px">${item.notes}</p>`:''}
      ${(images.length && (isAdmin()||hasPerm('view_store_images'))) ? `<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto">
        ${images.slice(0,5).map((im,i)=>`<img src="${im.image_url}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;cursor:zoom-in" onclick='openGalleryLightbox(${JSON.stringify(images.map(x=>x.image_url))},${i})'>`).join('')}
        ${images.length>5? `<div style="width:52px;height:52px;border-radius:8px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex:none">+${images.length-5}</div>`:''}
      </div>` : ''}
      <div class="table-wrap" style="margin-top:8px"><table style="font-size:11px">
        <thead><tr><th>التاريخ</th><th>وارد</th><th>صادر</th><th>السبب</th><th>الجهة</th>${isAdmin()?'<th></th>':''}</tr></thead>
        <tbody>${txns.map(t=>`<tr><td>${fmtDateAr(t.transaction_date)}</td><td class="num-ok" style="color:var(--success)">${t.in_qty||0}</td><td style="color:var(--danger)">${t.out_qty||0}</td><td>${t.reason||'—'}</td><td>${t.destination||'—'}</td>${isAdmin()?`<td><button class="btn sm danger" style="padding:2px 6px;font-size:10px" onclick="deleteStoreTransaction('${t.id}','${item.id}')">🗑</button></td>`:''}</tr>`).join('') || `<tr><td colspan="${isAdmin()?6:5}">لا توجد حركات</td></tr>`}</tbody>
      </table></div>
      <div class="btn-row">
        ${(isAdmin()||hasPerm('view_store_images')) ? `<button class="btn sm" onclick="openItemGalleryModal('${item.id}')">🖼️ الصور (${images.length})</button>` : ''}
        ${isAdmin()? `<button class="btn sm primary" onclick="openStoreTransactionForm('${item.id}')">↔️ تسجيل حركة</button>
        <button class="btn sm" onclick="openStoreItemForm('${item.id}')">✏️ تعديل الصنف</button>
        <button class="btn sm danger" onclick="deleteStoreItem('${item.id}')">🗑 حذف الصنف</button>` : ''}
      </div>
    </div>`;
  }).join('');
}
function openStoreItemForm(id){
  const item = id ? storeItemsData.find(x=>x.id===id) : null;
  const isNew = !item;
  const d = item || {item_name:'', item_type:'', notes:''};
  openModal(`
    <div class="modal-head"><h3>${isNew?'إضافة صنف جديد':'تعديل صنف'}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>اسم الصنف</label><input class="input" id="si_name" value="${d.item_name}" placeholder="مثال: كاميرا 4 ميجا"></div>
    <div class="field"><label>النوع</label><input class="input" id="si_type" value="${d.item_type||''}" placeholder="مثال: 4 ميجا / ماوس / شاشة جديدة"></div>
    <div class="field"><label>ملاحظات</label><textarea class="input" id="si_notes">${d.notes||''}</textarea></div>
    <button class="btn primary block" onclick="saveStoreItemForm('${isNew?'':id}')">💾 حفظ</button>
  `);
}
async function saveStoreItemForm(id){
  const name = document.getElementById('si_name').value.trim();
  if(!name){ toast('أدخل اسم الصنف'); return; }
  const payload = { item_name:name, item_type:document.getElementById('si_type').value.trim(), notes:document.getElementById('si_notes').value.trim() };
  try{
    if(id){ const {error}=await supa.from('store_items').update(payload).eq('id',id); if(error) throw error; await logAudit('تعديل صنف مخزن', name); }
    else { payload.created_by=currentProfile.id; const {error}=await supa.from('store_items').insert(payload); if(error) throw error; await logAudit('إضافة صنف مخزن', name); }
    closeModal(); toast('✅ تم الحفظ'); loadStoreData();
  }catch(e){ toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
function deleteStoreItem(id){
  openModal(`<div class="modal-head"><h3>تأكيد الحذف</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <p style="font-size:13px;color:var(--muted)">حذف الصنف وكل حركاته المسجّلة نهائيًا؟</p>
    <button class="btn danger block" onclick="confirmDeleteStoreItem('${id}')">حذف نهائيًا</button>`);
}
async function confirmDeleteStoreItem(id){
  try{ await supa.from('store_items').delete().eq('id',id); await logAudit('حذف صنف مخزن', id); closeModal(); toast('تم الحذف'); loadStoreData(); }
  catch(e){ toast('🚫 تعذّر الحذف'); }
}

/* ============================================================
   معرض صور الصنف: إضافة متعددة / عرض / تكبير وتنقل / حذف
   ============================================================ */
function openItemGalleryModal(itemId){
  if(!isAdmin() && !hasPerm('view_store_images')){ toast('🚫 لا تملك صلاحية عرض الصور'); return; }
  const canUpload = isAdmin() || hasPerm('upload_store_images');
  const canDelete = isAdmin() || hasPerm('delete_store_images');
  const item = storeItemsData.find(x=>x.id===itemId);
  const images = getItemImages(itemId);
  openModal(`
    <div class="modal-head"><h3>🖼️ صور: ${item.item_name}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    ${canUpload ? `<div id="itemGalleryDropzone" style="border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;margin-bottom:12px">
      <p style="font-size:12px;color:var(--muted);margin:0 0 8px">اسحب الصور هنا أو اضغط للاختيار (يمكن اختيار أكثر من صورة)</p>
      <label class="btn primary sm" style="cursor:pointer">📷 إضافة صور<input type="file" accept="image/*" multiple style="display:none" onchange="uploadItemImages('${itemId}', this)"></label>
    </div>` : ''}
    <div id="itemGalleryGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${images.length===0 ? `<div class="empty" style="grid-column:1/-1">لا توجد صور بعد.</div>` :
        images.map((im,i)=>`
        <div style="position:relative">
          <img src="${im.image_url}" style="width:100%;height:90px;object-fit:cover;border-radius:8px;cursor:zoom-in" onclick='openGalleryLightbox(${JSON.stringify(images.map(x=>x.image_url))},${i})'>
          ${canDelete? `<button onclick="deleteItemImage('${im.id}','${itemId}')" style="position:absolute;top:4px;left:4px;background:rgba(255,60,60,.9);color:#fff;border:none;width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer">🗑</button>`:''}
        </div>`).join('')}
    </div>
  `);
  if(canUpload){
    const dz = document.getElementById('itemGalleryDropzone');
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.style.borderColor='var(--accent)'; });
    dz.addEventListener('dragleave', ()=>{ dz.style.borderColor='var(--border)'; });
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.style.borderColor='var(--border)';
      if(e.dataTransfer.files.length) uploadItemImages(itemId, {files:e.dataTransfer.files});
    });
  }
}
async function uploadItemImages(itemId, inputEl){
  if(!isAdmin() && !hasPerm('upload_store_images')){ toast('🚫 لا تملك صلاحية رفع الصور'); return; }
  const files = Array.from(inputEl.files||[]);
  if(!files.length) return;
  toast(`جاري رفع ${files.length} صورة...`);
  let ok=0, fail=0;
  for(const file of files){
    try{
      const compressed = await compressImageFile(file);
      const path = `items/${itemId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
      if(upErr) throw upErr;
      const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
      const {error} = await supa.from('store_item_images').insert({item_id:itemId, image_url:pub.publicUrl, sort_order:storeItemImagesData.length, created_by:currentProfile.id});
      if(error) throw error;
      ok++;
    }catch(e){ console.error(e); fail++; }
  }
  const {data: imgs} = await supa.from('store_item_images').select('*').order('sort_order');
  storeItemImagesData = imgs||[];
  toast(fail? `تم رفع ${ok}، وفشل ${fail}` : `✅ تم رفع ${ok} صورة`);
  const item = storeItemsData.find(x=>x.id===itemId);
  if(ok) await logAudit('إضافة صور صنف', `${item?item.item_name:itemId}: ${ok} صورة`);
  openItemGalleryModal(itemId);
  renderStoreList();
}

async function exportStoreExcel(){
  const ok = await ensureExcelLib(); if(!ok){ toast('⚠️ تعذّر تحميل مكتبة Excel'); return; }
  toast('جاري تجهيز الملف والصور...');
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('حركة المخزن', {views:[{rightToLeft:true}]});
  ws.columns = [{width:14},{width:20},{width:14},{width:8},{width:8},{width:10},{width:22},{width:18},{width:20}];
  ws.addRow(['التاريخ','الصنف','النوع','وارد','صادر','الرصيد','سبب الحركة','المصنع','ملاحظات']).font = {bold:true};
  storeTransactionsData.slice().reverse().forEach(t=>{
    const item = storeItemsData.find(i=>i.id===t.item_id);
    let running = 0;
    storeTransactionsData.filter(x=>x.item_id===t.item_id && x.transaction_date<=t.transaction_date).forEach(x=> running += (x.in_qty||0)-(x.out_qty||0));
    ws.addRow([fmtDateAr(t.transaction_date), item?item.item_name:'—', item?item.item_type:'', t.in_qty||0, t.out_qty||0, running, t.reason||'', t.destination||'', t.notes||'']);
  });
  // ورقة صور الأصناف — مُضمَّنة فعليًا (وليست روابط)
  if(storeItemImagesData.length){
    await urlsToDataUris(storeItemImagesData.map(im=>im.image_url));
    const ws2 = wb.addWorksheet('صور الأصناف', {views:[{rightToLeft:true, state:'frozen', ySplit:1}]});
    ws2.columns = [{width:26},{width:20}];
    ws2.getCell('A1').value='الصنف'; ws2.getCell('B1').value='الصورة';
    ['A1','B1'].forEach(c=>{ ws2.getCell(c).font={bold:true,color:{argb:'FFFFFFFF'}}; ws2.getCell(c).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12716A'}}; });
    storeItemImagesData.forEach((im,i)=>{
      const r=i+2; const it=storeItemsData.find(x=>x.id===im.item_id);
      ws2.getCell(`A${r}`).value = it?it.item_name:''; ws2.getRow(r).height=80;
      addEmbeddedImage(wb, ws2, __imgDataCache[im.image_url], 1, r-1, 100, 100);
    });
  }
  const buf = await wb.xlsx.writeBuffer();
  await saveOrShareFile(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `حركة-المخزن-${new Date().toISOString().slice(0,10)}.xlsx`);
}
async function exportStorePdf(){

    <table style="width:100%;border-collapse:collapse;font-size:11px" border="1" cellpadding="5">
      <tr style="background:#0B1220;color:#fff"><th>التاريخ</th><th>الصنف</th><th>النوع</th><th>وارد</th><th>صادر</th><th>السبب</th><th>المصنع</th></tr>
      ${storeTransactionsData.map(t=>{ const item=storeItemsData.find(i=>i.id===t.item_id);
        return `<tr><td>${fmtDateAr(t.transaction_date)}</td><td>${item?item.item_name:'—'}</td><td>${item?item.item_type:''}</td><td>${t.in_qty||0}</td><td>${t.out_qty||0}</td><td>${t.reason||''}</td><td>${t.destination||''}</td></tr>`;
      }).join('')}
    </table>

      <div>${storeItemsData.map(it=>{
        const imgs = storeItemImagesData.filter(im=>im.item_id===it.id);
        if(!imgs.length) return '';
        return `<div style="margin-bottom:10px"><b>${it.item_name}</b><br>${imgs.map(im=> __imgDataCache[im.image_url] ? `<img src="${__imgDataCache[im.image_url]}" style="width:90px;height:90px;object-fit:cover;border:1px solid #ccc;border-radius:4px;margin:4px">` : '').join('')}</div>`;

  document.body.appendChild(el);
  const blob = await html2pdf().set({margin:8, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'}}).from(el).outputPdf('blob');
  el.remove();
  await saveOrShareFile(blob, `تقرير-المخزن-${new Date().toISOString().slice(0,10)}.pdf`);
}

async function saveCameraModForm(id){
  const name = document.getElementById('cm_name').value.trim();
  if(!name){ toast('أدخل اسم الكاميرا'); return; }
  const factoryName = document.getElementById('cm_factory').value;
  const factory = factoriesData.find(f=>f.name===factoryName);
  const payload = {
    factory_id: factory?factory.id:null, factory_name: factoryName,
    place_name: document.getElementById('cm_place').value.trim(), camera_number: document.getElementById('cm_number').value.trim(),
    camera_name: name, camera_type: document.getElementById('cm_type').value.trim(),
    problem_description: document.getElementById('cm_problem').value.trim(), modification_reason: document.getElementById('cm_reason').value.trim(),
    required_change: document.getElementById('cm_required').value.trim(), priority: document.getElementById('cm_priority').value,
    status: document.getElementById('cm_status').value, notes: document.getElementById('cm_notes').value.trim(), updated_by: currentProfile.id
  };
  try{
    if(id){ const {error}=await supa.from('camera_modifications').update(payload).eq('id',id); if(error) throw error; await logAudit('تعديل سجل كاميرا للتعديل', name); }
    else { payload.created_by=currentProfile.id; const {error}=await supa.from('camera_modifications').insert(payload); if(error) throw error; await logAudit('إضافة كاميرا للتعديل', name); }
    closeModal(); toast('✅ تم الحفظ'); loadCameraMods();
  }catch(e){ toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}

async function uploadModPhoto(id, which, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  toast('جاري رفع الصورة...');
  try{
    const compressed = await compressImageFile(file);
    const path = `mods/${id}-${which}-${Date.now()}.jpg`;
    const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
    if(upErr) throw upErr;
    const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
    const col = which==='before' ? 'photo_before_url' : 'photo_after_url';
    const {error} = await supa.from('camera_modifications').update({[col]: pub.publicUrl}).eq('id', id);
    if(error) throw error;
    toast('✅ تم رفع الصورة'); loadCameraMods();
  }catch(e){ console.error(e); toast('🚫 تعذّر رفع الصورة: '+(e.message||'')); }
}
async function removeModPhoto(id, which){
  try{
    const col = which==='before' ? 'photo_before_url' : 'photo_after_url';
    const {error} = await supa.from('camera_modifications').update({[col]: null}).eq('id', id);
    if(error) throw error;
    const c = cameraModsData.find(x=>x.id===id);
    await logAudit('حذف صورة '+(which==='before'?'قبل التعديل':'بعد التعديل'), c?c.camera_name:id);
    toast('✅ تم حذف الصورة'); loadCameraMods();
  }catch(e){ console.error(e); toast('🚫 تعذّر الحذف: '+(e.message||'')); }
}

async function loadLightingFactoryPicker(){
  const host = document.getElementById('lightingFactoryPickerHost');
  if(!host) return;
  if(!factoriesData.length){ host.innerHTML = '<div class="empty">لا توجد مصانع مسجّلة بعد.</div>'; return; }
  let counts = {};
  try{
    const {data} = await supa.from('lighting_needs').select('factory_id, status');
    (data||[]).forEach(r=>{ if(!counts[r.factory_id]) counts[r.factory_id] = {total:0, open:0}; counts[r.factory_id].total++; if(r.status!=='تم الإصلاح' && r.status!=='مغلقة') counts[r.factory_id].open++; });
  }catch(e){ host.innerHTML = `<div class="empty">⚠️ تحتاج تشغيل schema_part4.sql في Supabase.</div>`; return; }
  host.innerHTML = factoriesData.map(f=>{
    const c = counts[f.id] || {total:0, open:0};
    return `<div class="site-card" style="cursor:pointer" onclick="goTo('lighting','${f.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="site-name" style="font-size:14px">${f.name}</div>
        <span class="pill ${c.open>0?'warn':'ok'}">${c.total} احتياج${c.open>0?' · '+c.open+' مفتوح':''}</span>
      </div>
    </div>`;
  }).join('');
}
const LIGHTING_STATUS_COLOR = {'تحتاج إضاءة':'bad','تم الإبلاغ':'warn','قيد التنفيذ':'warn','تم الإصلاح':'ok','مغلقة':'ok'};
async function loadLightingNeeds(factoryId){
  try{
    const {data, error} = await supa.from('lighting_needs').select('*').eq('factory_id', factoryId).order('created_at',{ascending:false});
    if(error) throw error;
    lightingData = data||[];
  }catch(e){
    console.warn(e);
    const host = document.getElementById('lightingListHost');
    if(host) host.innerHTML = `<div class="empty">⚠️ هذه الميزة تحتاج تشغيل ملف schema_part4.sql في Supabase أولًا.</div>`;
    return;
  }
  const sumHost = document.getElementById('lightingSummaryHost');
  if(sumHost){
    const open = lightingData.filter(l=>l.status!=='تم الإصلاح' && l.status!=='مغلقة').length;
    sumHost.innerHTML = `<div class="mini-grid"><div class="mini"><div class="n">${lightingData.length}</div><div class="t">الإجمالي</div></div><div class="mini"><div class="n" style="color:var(--danger)">${open}</div><div class="t">مفتوح</div></div><div class="mini"><div class="n" style="color:var(--success)">${lightingData.length-open}</div><div class="t">مُغلق</div></div></div>`;
  }
  renderLightingList();
}
function renderLightingList(){
  const host = document.getElementById('lightingListHost');
  if(!host) return;
  const f = lightingFilter;
  const list = lightingData.filter(l=> (!f.text || l.place_name.includes(f.text) || l.factory_name.includes(f.text)) && (!f.status||l.status===f.status) && (!f.priority||l.priority===f.priority));
  if(!list.length){ host.innerHTML='<div class="empty">لا توجد نتائج.</div>'; return; }
  host.innerHTML = list.map(l=>`
    <div class="site-card">
      <div style="display:flex;justify-content:space-between">
        <div><div class="site-name" style="font-size:14px">${l.place_name}</div><div class="site-meta">${l.factory_name}</div></div>

        </div>
      </div>

        <select class="input" style="font-size:12px;padding:6px 8px;width:auto" onchange="updateLightingStatus('${l.id}', this.value)">

function openLightingForm(factoryId, id){
  const l = id ? lightingData.find(x=>x.id===id) : null;

}
async function saveLightingForm(id){
  const place = document.getElementById('lt_place').value.trim();
  if(!place){ toast('أدخل اسم المكان'); return; }
  const factoryId = document.getElementById('lt_factory').value;
  const factory = factoriesData.find(f=>f.id===factoryId);
  const payload = {
    factory_id: factoryId||null, factory_name: factory?factory.name:'', place_name: place,
    problem_description: document.getElementById('lt_problem').value.trim(), need_type: document.getElementById('lt_type').value.trim(),
    priority: document.getElementById('lt_priority').value, status: document.getElementById('lt_status').value,
    notes: document.getElementById('lt_notes').value.trim(), updated_by: currentProfile.id
  };
  try{
    if(id){ const {error}=await supa.from('lighting_needs').update(payload).eq('id',id); if(error) throw error; await logAudit('تعديل احتياج إضاءة', place); }
    else { payload.created_by=currentProfile.id; const {error}=await supa.from('lighting_needs').insert(payload); if(error) throw error; await logAudit('إضافة احتياج إضاءة', place); }
    closeModal(); toast('✅ تم الحفظ'); loadLightingNeeds(factoryId);
  }catch(e){ toast('🚫 تعذّر الحفظ: '+(e.message||'')); }
}
async function updateLightingStatus(id, status){
  try{ await supa.from('lighting_needs').update({status}).eq('id',id); const l=lightingData.find(x=>x.id===id); await logAudit('تحديث حالة إضاءة', l.place_name, l.status, status); toast('✅ تم التحديث'); loadLightingNeeds(currentViewCtx); }
  catch(e){ toast('🚫 تعذّر التحديث'); }
}
function deleteLightingNeed(id){
  openModal(`<div class="modal-head"><h3>تأكيد الحذف</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <button class="btn danger block" onclick="confirmDeleteLighting('${id}')">حذف نهائيًا</button>`);
}
async function confirmDeleteLighting(id){
  try{ await supa.from('lighting_needs').delete().eq('id',id); await logAudit('حذف احتياج إضاءة', id); closeModal(); toast('تم الحذف'); loadLightingNeeds(currentViewCtx); }
  catch(e){ toast('🚫 تعذّر الحذف'); }
}
async function uploadLightingPhoto(id, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  toast('جاري رفع الصورة...');
  try{
    const compressed = await compressImageFile(file);
    const path = `lighting/${id}-${Date.now()}.jpg`;
    const {error: upErr} = await supa.storage.from('camera-photos').upload(path, compressed, {contentType:'image/jpeg', upsert:true});
    if(upErr) throw upErr;
    const {data: pub} = supa.storage.from('camera-photos').getPublicUrl(path);
    const {error} = await supa.from('lighting_needs').update({photo_url: pub.publicUrl}).eq('id', id);
    if(error) throw error;
    toast('✅ تم رفع الصورة'); loadLightingNeeds(currentViewCtx);
  }catch(e){ console.error(e); toast('🚫 تعذّر رفع الصورة: '+(e.message||'')); }
}

    const {error} = await supa.from('lighting_needs').update({photo_url:null}).eq('id', id);
